// ---- Full-text search index ----------------------------------
// Pull every piece of human-readable text out of one section's JSONB content.
// Returns a single space-joined string. Also strips markdown markers (== ** __ !! >>).
function extractSectionText(content){
  var c = content;
  if (typeof c === "string"){ try { c = JSON.parse(c); } catch(e){ return c.toLowerCase(); } }
  if (!c || typeof c !== "object") return "";
  var out = [];
  function push(v){ if (typeof v === "string" && v) out.push(v); }
  // generic shapes
  (c.paragraphs||[]).forEach(push);
  (c.pills||[]).forEach(push);
  (c.stats||[]).forEach(function(s){ push(s && s.value); push(s && s.label); });
  (c.lists||[]).forEach(function(l){ push(l && l.title); (l && l.items||[]).forEach(push); });
  // patho steps
  (c.steps||[]).forEach(function(s){ push(s && s.title); push(s && s.prompt); push(s && s.content); });
  // pearls: groups[].facts[].text/tag
  (c.groups||[]).forEach(function(g){ push(g && g.title); (g && g.facts||[]).forEach(function(f){ push(f && f.text); push(f && f.tag); }); });
  // pattern: patterns[].trigger[]/answer/pearl
  (c.patterns||[]).forEach(function(p){ (p && p.trigger||[]).forEach(push); push(p && p.answer); push(p && p.pearl); });
  // quick_facts: facts[].group/key/value
  (c.facts||[]).forEach(function(f){ push(f && f.group); push(f && f.key); push(f && f.value); });
  // images captions if any
  (c.images||[]).forEach(function(im){ push(im && im.caption); });
  var txt = out.join(" ");
  // strip our markdown markers so "==highlight==" matches "highlight"
  txt = txt.replace(/==|\*\*|__|!!|>>|\[\[dz:[^|\]]*\|?|\]\]|\[img:\d+\]/g, " ");
  return txt.toLowerCase();
}

// Build searchIndex for all diseases (call once after data load)
function buildSearchIndex(){
  searchIndex = {};
  diseases.forEach(function(d){
    var parts = [];
    parts.push((d.name||""));
    parts.push((d.name_en||""));
    parts.push((d.summary||""));
    var badges = d.badges||[];
    if (typeof badges === "string"){ try{ badges = JSON.parse(badges); }catch(e){ badges = []; } }
    parts.push(badges.join(" "));
    // all sections
    var secs = sectionMap[d.id] || {};
    for (var k in secs){ if (secs.hasOwnProperty(k)) parts.push(extractSectionText(secs[k])); }
    // drugs
    (drugMap[d.id]||[]).forEach(function(dr){
      parts.push([dr.name,dr.drug_class,dr.mechanism,dr.indication,dr.dosage,dr.notes,dr.badge_label].filter(Boolean).join(" "));
    });
    // complications
    (compMap[d.id]||[]).forEach(function(c){ parts.push([c.name,c.name_en].filter(Boolean).join(" ")); });
    searchIndex[d.id] = parts.join("  ").toLowerCase().replace(/==|\*\*|__|!!|>>/g," ");
  });
}

// For a matched disease, find WHICH tab the query text appears in + a short snippet (for the hint line)
var TAB_LABEL_BY_KEY = {};
TABS.forEach(function(t){ TAB_LABEL_BY_KEY[t.key] = t.label; });
function findMatchLocation(diseaseId, q){
  var secs = sectionMap[diseaseId] || {};
  // search tabs in display order for first hit
  for (var ti=0; ti<TABS.length; ti++){
    var key = TABS[ti].key;
    if (!secs[key]) continue;
    var txt = extractSectionText(secs[key]);
    var pos = txt.indexOf(q);
    if (pos >= 0){
      var start = Math.max(0, pos-18), end = Math.min(txt.length, pos+q.length+22);
      var snip = (start>0?"…":"") + txt.slice(start,end).trim() + (end<txt.length?"…":"");
      return { key: key, label: TAB_LABEL_BY_KEY[key]||key, snippet: snip };
    }
  }
  // drugs
  var drugs = drugMap[diseaseId]||[];
  for (var i=0;i<drugs.length;i++){
    var dt = [drugs[i].name,drugs[i].drug_class,drugs[i].mechanism,drugs[i].indication,drugs[i].notes].filter(Boolean).join(" ").toLowerCase();
    if (dt.indexOf(q)>=0) return { key:"drug", label:"藥物", snippet: drugs[i].name||"" };
  }
  return null;
}

var _searchDebounceTimer = null;
// Debounced search: avoids rebuilding the whole sidebar + running the full-text
// index on every keystroke (noticeable lag at 130+ diseases with deep search).
function filterListDebounced(){
  var el = document.getElementById("searchInput");
  var clr = document.getElementById("searchClear");
  if (clr) clr.style.display = (el && el.value) ? "flex" : "none";
  if (_searchDebounceTimer) clearTimeout(_searchDebounceTimer);
  _searchDebounceTimer = setTimeout(filterList, 150);
}
function clearSearch(){
  var el = document.getElementById("searchInput");
  if (el){ el.value = ""; el.focus(); }
  var clr = document.getElementById("searchClear");
  if (clr) clr.style.display = "none";
  if (_searchDebounceTimer) clearTimeout(_searchDebounceTimer);
  filterList();
}

function filterList() {
  var q = document.getElementById("searchInput").value.toLowerCase().trim();
  searchHitMap = {};
  var filtered = diseases.filter(function(d) {
    if(!q) return true;
    // shallow match (name/summary/badges) — these don't need a "matched in" hint
    if((d.name||"").toLowerCase().indexOf(q)>=0) return true;
    if((d.name_en||"").toLowerCase().indexOf(q)>=0) return true;
    if((d.summary||"").toLowerCase().indexOf(q)>=0) return true;
    var badges=d.badges||[];
    if(typeof badges==="string")try{badges=JSON.parse(badges)}catch(e){badges=[]}
    for(var i=0;i<badges.length;i++){if((badges[i]||"").toLowerCase().indexOf(q)>=0)return true}
    // deep match (section content / drugs / complications) — flag for hint
    var idx = searchIndex[d.id];
    if(idx && idx.indexOf(q)>=0){
      var loc = findMatchLocation(d.id, q);
      searchHitMap[d.id] = loc || { label:"內文", snippet:"" };
      return true;
    }
    return false;
  });
  renderSidebar(filtered);
}

function hasContent(data) {
  if (!data) return false;
  var c = data;
  if (typeof c === "string") try { c = JSON.parse(c); } catch(e) { return false; }
  if (!c || typeof c !== "object") return false;
  if (c.paragraphs && c.paragraphs.length > 0) return true;
  if (c.steps && c.steps.length > 0) return true;
  if (c.stats && c.stats.length > 0) return true;
  if (c.lists && c.lists.length > 0) return true;
  if (c.pills && c.pills.length > 0) return true;
  if (c.drugs && c.drugs.length > 0) return true;
  if (c.complications && c.complications.length > 0) return true;
  if (c.images && c.images.length > 0) return true;
  if (c.groups && c.groups.length > 0) return true;     // pearls (重點)
  if (c.patterns && c.patterns.length > 0) return true; // pattern (題型)
  return false;
}

function selectDisease(id, startTab, fromHistory) {
  hideEntityPreview();
  var prevId = currentId;
  var prevView = currentView;
  currentId = id;
  currentTab = startTab || "__first__";  // sentinel → renderEntry picks first available tab (重點 if present)
  currentView = "entry";
  pushRecent(id);
  // Sync sidebar accordion to the disease's category
  var d = diseases.find(function(x){ return x.id === id; });
  if (d && d.category) expandedCat = d.category;
  if (!fromHistory){
    try{
      // build hash with tab if we already know a concrete startTab (deep-link / link share)
      var tabPart = (currentTab && currentTab !== "__first__") ? (":" + currentTab) : "";
      // Same disease already open (e.g. tab switch) → replace; navigating to a different
      // disease (or coming from another view) → push a new history entry so Back works.
      if(prevView === "entry" && prevId === id){
        history.replaceState(null,null,"#"+id+tabPart);
      } else {
        history.pushState(null,null,"#"+id+tabPart);
      }
    }catch(e){}
  }
  closeSidebarMobile();
  // Smooth: DOM-only updates to keep CSS transitions alive (no innerHTML rebuild)
  applyAccordion();
  updateActiveSi();
  renderEntry();
}

  var bodyHtml = renderSection(secs[currentTab], currentTab === "drug" ? drugs : null, currentTab === "prog" ? comps : null, secs[currentTab]);

  renderBreadcrumb(d, availTabs);

  // keep the active tab visible in the horizontally-scrolling tab strip (mobile)
  try{
    var at = document.querySelector(".tabs .tab.active");
    if (at && at.scrollIntoView) at.scrollIntoView({ inline: "center", block: "nearest" });
  }catch(e){}
}

/* ===== One-level disease relationship navigator (subway-line view) ===== */
function getDiseaseRelations(id){
  // outgoing: current disease → diseases linked from its complications
  var outgoing = [];
  var seenOut = {};
  (compMap[id] || []).forEach(function(c){
    if (c.has_link && c.linked_disease_id && !seenOut[c.linked_disease_id]){
      var d = diseases.find(function(x){ return x.id === c.linked_disease_id; });
      if (d){ outgoing.push({ disease: d, via: c.name }); seenOut[c.linked_disease_id] = true; }
    }
  });
  // incoming: any disease whose complications link TO the current disease
  var incoming = [];
  var seenIn = {};
  diseases.forEach(function(src){
    if (src.id === id) return;
    (compMap[src.id] || []).forEach(function(c){
      if (c.has_link && c.linked_disease_id === id && !seenIn[src.id]){
        incoming.push({ disease: src, via: c.name });
        seenIn[src.id] = true;
      }
    });
  });
  return { incoming: incoming, outgoing: outgoing };
}

/* ===== Related diseases (differential / same-class), auto-derived + manual ===== */
// Build a map: disease_id → set of disease_ids that share at least one symptom.
var _symptomSharedCache = null;
function _buildSymptomShared(){
  if(_symptomSharedCache) return _symptomSharedCache;
  var map = {}; // diseaseId -> { otherId: count }
  // Walk every symptom → mechanism → anatomy → diseases, collecting co-occurring diseases.
  (symptoms || []).forEach(function(sx){
    var dset = {};
    (mechBySxId[sx.id] || []).forEach(function(m){
      (anatomyByMechId[m.id] || []).forEach(function(a){
        (anatomyDxMap[a.id] || []).forEach(function(ad){
          if(ad.disease_id) dset[ad.disease_id] = true;
        });
      });
    });
    var ids = Object.keys(dset);
    ids.forEach(function(a){
      ids.forEach(function(b){
        if(a === b) return;
        if(!map[a]) map[a] = {};
        map[a][b] = (map[a][b] || 0) + 1;
      });
    });
  });
  _symptomSharedCache = map;
  return map;
}

// Parse manual related ids from the disease record (supports array or comma string)
function _manualRelatedIds(d){
  if(!d) return [];
  var raw = d.related_ids || d.related_diseases || null;
  if(!raw) return [];
  if(Array.isArray(raw)) return raw.filter(Boolean);
  if(typeof raw === "string"){
    return raw.split(/[,\s]+/).map(function(x){ return x.trim(); }).filter(Boolean);
  }
  return [];
}

// Returns related diseases grouped/ranked: manual first, then same-category, then symptom-shared.
// Each item: { disease, reason: "manual"|"category"|"symptom"|"compare", score }
function getRelatedDiseases(id){
  var self = diseases.find(function(x){ return x.id === id; });
  if(!self) return [];
  var seen = {}; seen[id] = true;
  var out = [];
  function add(d, reason, score){
    if(!d || seen[d.id]) return;
    seen[d.id] = true;
    out.push({ disease: d, reason: reason, score: score });
  }
  // Manual only — explicitly curated related diseases (auto symptom/category derivation removed by design)
  _manualRelatedIds(self).forEach(function(rid){
    var d = diseases.find(function(x){ return x.id === rid; });
    add(d, "manual", 100);
  });
  return out;
}

function renderRelNav(id){

  var cur = diseases.find(function(x){ return x.id === id; });

    html += '<div class="relnav-header"><span class="relnav-header-zh">疾病關係</span>' +
      '<span class="relnav-header-en">· DISEASE RELATIONSHIPS</span></div>';

    html += colHtml("致病病因", "CAUSED BY", rel.incoming, "in");

    html += centerHtml;
    html += '<div class="relnav-arrow relnav-arrow-2"><i class="ti ti-arrow-right"></i></div>';
    html += colHtml("併發疾病", "LEADS TO", rel.outgoing, "out");
    html += '</div>';
  }
  // Related (differential / same-class) diseases
  if (related.length){
    html += '<div class="relnav-header rd-header"><span class="relnav-header-zh">相關疾病</span>' +
      '<span class="relnav-header-en">· RELATED</span></div>';
    html += '<div class="rd-list">';
    related.forEach(function(it){
      var d = it.disease;
      var col = CAT_COLORS[d.category] || "#7ab3d9";
      html += '<div class="rd-item">' +

        '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  return html;
}

/* ===== High-yield facts (pearls) ===== */
// Schema: { groups: [ { title, facts: [ "fact text", ... ] } ] }
//   or flat: { facts: [ ... ] }
// Classify a pearl tag into a "kind": clinical red-flag, exam point, or neutral.
// Detects keywords so existing free-text tags light up without a data migration.
function pearlKind(tag){
  if (!tag) return "";
  var t = String(tag);
  if (/紅旗|臨床|致命|must|miss|危|急|警/i.test(t)) return "clinical";
  if (/考|高頻|陷阱|常考|題|易錯|國考/i.test(t)) return "exam";
  return "";
}

function renderPearls(content){
  if (!content) return '<p style="color:var(--text3)">此疾病尚無重點整理</p>';
  var groups = content.groups;
  if (!groups && content.facts) groups = [{ title: "", facts: content.facts }];
  if (!groups || !groups.length) return '<p style="color:var(--text3)">此疾病尚無重點整理</p>';

  // Count how many clinical / exam pearls exist (to decide whether to show filters)
  var nClin = 0, nExam = 0;
  groups.forEach(function(g){
    (g.facts || []).forEach(function(f){
      var tag = (typeof f === "object" && f.tag) ? f.tag : "";
      var k = pearlKind(tag);
      if (k === "clinical") nClin++;
      else if (k === "exam") nExam++;
    });
  });
  var hasBoth = nClin > 0 && nExam > 0;

  var html = '<div class="pearls-wrap">';
  html += '<div class="pearls-intro"><i class="ti ti-bulb"></i> 高分重點 — 重點快速掃描</div>';
  // Filter toggles (only when both kinds are present)
  if (hasBoth){
    html += '<div class="pearls-filter" id="pearlsFilter">'+
      '<button class="pf-btn active" data-pf="all" onclick="setPearlFilter(\'all\')">全部</button>'+
      '<button class="pf-btn pf-clinical" data-pf="clinical" onclick="setPearlFilter(\'clinical\')">⚠️ 臨床紅旗 <span class="pf-n">'+nClin+'</span></button>'+
      '<button class="pf-btn pf-exam" data-pf="exam" onclick="setPearlFilter(\'exam\')">📝 考點 <span class="pf-n">'+nExam+'</span></button>'+
      '</div>';
  }
  groups.forEach(function(g){
    if (g.title) html += '<div class="sl">' + fmt(g.title) + '</div>';
    html += '<div class="pearls-list">';
    (g.facts || []).forEach(function(f){
      var text = (typeof f === "string") ? f : (f.text || "");
      var tag = (typeof f === "object" && f.tag) ? f.tag : "";
      var kind = pearlKind(tag);
      var cls = "pearl" + (kind ? " pearl-" + kind : "");
      var mark = kind === "clinical" ? "⚠️" : (kind === "exam" ? "📝" : '<i class="ti ti-point-filled"></i>');
      html += '<div class="' + cls + '" data-kind="' + (kind || "neutral") + '">';
      html += '<span class="pearl-mark">' + mark + '</span>';
      html += '<div class="pearl-body">' + linkifyEntities(fmt(text));
      if (tag) html += ' <span class="pearl-tag pearl-tag-' + (kind || "neutral") + '">' + escHtml(tag) + '</span>';
      html += '</div></div>';
    });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

// Filter pearls by kind (all / clinical / exam) without re-rendering
function setPearlFilter(kind){
  var wrap = document.querySelector(".pearls-wrap");
  if (!wrap) return;
  wrap.querySelectorAll(".pf-btn").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-pf") === kind);
  });
  wrap.querySelectorAll(".pearl").forEach(function(p){
    var k = p.getAttribute("data-kind");
    var show = (kind === "all") || (k === kind);
    p.style.display = show ? "" : "none";
  });
  // hide group sub-labels that now have no visible pearls
  wrap.querySelectorAll(".pearls-list").forEach(function(list){
    var anyVisible = Array.prototype.some.call(list.querySelectorAll(".pearl"), function(p){ return p.style.display !== "none"; });
    var sl = list.previousElementSibling;
    if (sl && sl.classList.contains("sl")) sl.style.display = anyVisible ? "" : "none";
  });
}

function chipify(text){
  if(!text) return text;
  // B1. Explicit token: [stat:VALUE] or [stat:VALUE|label]
  text = text.replace(/\[stat:([^\]\|]+)(?:\|([^\]]+))?\]/g, function(_, val, label){
    var v = val.trim();
    var l = label ? label.trim() : "";
    return '<span class="stat-chip"' + (l ? ' title="'+l.replace(/"/g,'&quot;')+'"' : '') + '>' + v + '</span>';
  });
  // B2. Auto-detect parenthesised stat-like numbers inside parens. Handles:
  //     （~85%）（85%）（80-90%）（>90%）（≥7.0%）（0.5-1%）, half & full-width parens.
  text = text.replace(/[（(]\s*([~<>≤≥]?\s?\d+(?:\.\d+)?(?:\s?[-–~]\s?\d+(?:\.\d+)?)?%)\s*[）)]/g, function(_, num){
    return '<span class="stat-chip">' + num.replace(/\s+/g,"") + '</span>';
  });
  // B3. Standalone fold-change / ratio like "10-20 倍" stays prose (not chipped) to avoid noise.
  return text;
}

function fmt(text){
  if(!text)return "";
  text = chipify(text);
  return text
    .replace(/==(.+?)==/g,'<mark class="hl">$1</mark>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/__(.+?)__/g,'<u>$1</u>');
}

function renderRichText(text){
  if(!text)return "";
  // Normalize literal "\n" (backslash+n stored by Postgres single-quoted strings) into real newlines
  text = text.replace(/\\n/g, "\n");
  var lines=text.split("\n");
  var html="",inList=false,inTable=false;
  lines.forEach(function(line){
    var trimmed=line.trim();
    if(!trimmed){
      if(inList){html+="</ul>";inList=false}
      if(inTable){html+="</tbody></table>";inTable=false}
      return;
    }
    // Inline image reference: a line that is one or more [img:N] tokens (space-separated) → image row
    if(/^(\[img:\d+\]\s*)+$/.test(trimmed)){
      if(inList){html+="</ul>";inList=false}
      if(inTable){html+="</tbody></table>";inTable=false}
      var refs = trimmed.match(/\[img:\d+\]/g) || [];
      if(refs.length === 1){
        // single image — full-width figure (unchanged behaviour)
        var idx0 = parseInt(refs[0].match(/\d+/)[0],10) - 1;
        var im0 = _sectionInlineImages[idx0];
        if(im0 && im0.url){ html += renderInlineImage(im0); }
        else { html += '<div class="inline-img-missing">[img:' + (idx0+1) + ' 找不到圖片]</div>'; }
      } else {
        // multiple images — horizontal row
        html += '<div class="inline-img-row">';
        refs.forEach(function(r){
          var idx = parseInt(r.match(/\d+/)[0],10) - 1;
          var im = _sectionInlineImages[idx];
          if(im && im.url){ html += renderInlineImage(im, true); }
          else { html += '<div class="inline-img-missing">[img:' + (idx+1) + ' 找不到圖片]</div>'; }
        });
        html += '</div>';
      }
      return;
    }
    // Table row
    if(trimmed.indexOf("|")===0){
      if(trimmed.match(/^\|[\s\-|:]+\|?$/))return; // skip separator row
      // Parse cells; closing | is optional
      var parts=trimmed.split("|");
      parts.shift(); // drop leading empty (from starting |)
      if(parts.length>0&&parts[parts.length-1].trim()==="")parts.pop(); // drop trailing empty if closing | present
      var cells=parts;
      if(inList){html+="</ul>";inList=false}
      if(!inTable){
        html+='<table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:15px">';
        html+='<tbody>';
        html+='<tr>';
        cells.forEach(function(c){html+='<th style="padding:8px 10px;text-align:left;border:0.5px solid var(--border);background:var(--bg);color:var(--blue);font-weight:500;font-size:14px;vertical-align:top">'+fmt(c.trim())+'</th>'});
        html+='</tr>';
        inTable=true;
        return;
      }
      html+='<tr>';
      cells.forEach(function(c){html+='<td style="padding:8px 10px;border:0.5px solid var(--border);font-size:15px;vertical-align:top">'+fmt(c.trim())+'</td>'});
      html+='</tr>';
      return;
    }
    // Inside table, a non-pipe line continues the LAST cell of the last row with a <br>
    if(inTable){
      var tdIdx=html.lastIndexOf("</td>");
      var thIdx=html.lastIndexOf("</th>");
      var idx=tdIdx>thIdx?tdIdx:thIdx;
      if(idx>-1){
        html=html.substring(0,idx)+"<br>"+fmt(trimmed)+html.substring(idx);
      }
      return;
    }
    // A. Key fact: "!! text" → emphasized takeaway block
    if(trimmed.match(/^!!\s+/)){
      if(inList){html+="</ul>";inList=false}
      html+='<div class="rt-key">'+linkifyEntities(fmt(trimmed.replace(/^!!\s+/,"")))+'</div>';
      return;
    }
    // C. Group header: ">> Label" → subordinating bold label
    if(trimmed.match(/^>>\s+/)){
      if(inList){html+="</ul>";inList=false}
      html+='<div class="rt-group">'+linkifyEntities(fmt(trimmed.replace(/^>>\s+/,"")))+'</div>';
      return;
    }
    // Heading L1-L3 (#, ##, ###)
    var hm = trimmed.match(/^(#{1,3})\s+(.+)$/);
    if(hm){
      if(inList){html+="</ul>";inList=false}
      var level = hm[1].length;
      if (level === 1){
        html+='<div style="font-size:17px;font-weight:600;color:var(--blue);margin:18px 0 6px;line-height:1.4">'+fmt(hm[2])+'</div>';
      } else if (level === 2){
        html+='<div style="font-size:14px;font-weight:600;color:var(--blue);margin:14px 0 4px;line-height:1.4">'+fmt(hm[2])+'</div>';
      } else {
        html+='<div style="font-size:11px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:0.1em;margin:12px 0 3px;line-height:1.4">'+fmt(hm[2])+'</div>';
      }
      return;
    }
    // Bullet L3 (4+ spaces) — filled square
    if(line.match(/^    +- /)){
      if(!inList){html+='<ul style="list-style:none;padding:0;margin:4px 0">';inList=true}
      html+='<li style="display:flex;align-items:flex-start;gap:12px;padding:2px 0;padding-left:55px;font-size:var(--fs-sm)"><span style="width:5px;height:5px;border-radius:1px;background:var(--border2);margin-top:9px;flex-shrink:0"></span><span style="flex:1;min-width:0">'+linkifyEntities(fmt(line.replace(/^\s+-\s*/,"")))+'</span></li>';
      return;
    }
    // Bullet L2 — open circle
    if(line.match(/^  +- /)){
      if(!inList){html+='<ul style="list-style:none;padding:0;margin:4px 0">';inList=true}
      html+='<li style="display:flex;align-items:flex-start;gap:12px;padding:2px 0;padding-left:31px;font-size:var(--fs-body)"><span style="width:6px;height:6px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;margin-top:8px;flex-shrink:0;box-sizing:border-box"></span><span style="flex:1;min-width:0">'+linkifyEntities(fmt(line.replace(/^\s+-\s*/,"")))+'</span></li>';
      return;
    }
    // Bullet L1 — filled circle
    if(trimmed.match(/^- /)){
      if(!inList){html+='<ul style="list-style:none;padding:0;margin:4px 0">';inList=true}
      html+='<li style="display:flex;align-items:flex-start;gap:12px;padding:2px 0;padding-left:8px;font-size:var(--fs-body)"><span style="width:7px;height:7px;border-radius:50%;background:var(--border2);margin-top:8px;flex-shrink:0"></span><span style="flex:1;min-width:0">'+linkifyEntities(fmt(trimmed.substring(2)))+'</span></li>';
      return;
    }
    // Regular paragraph
    if(inList){html+="</ul>";inList=false}
    html+='<p style="margin:0 0 6px;font-size:var(--fs-body);line-height:var(--lh-normal)">'+linkifyEntities(fmt(trimmed))+'</p>';
  });
  if(inList)html+="</ul>";
  if(inTable)html+="</tbody></table>";
  return html;
}

function getLevel(item){
  if(item.match(/^    /)||item.match(/^\t\t/))return 3;
  if(item.match(/^  /)||item.match(/^\t/))return 2;
  return 1;
}

/* ===== Imaging Viewer (DICOM-style, with zoom/pan/thumbnail switching) ===== */
var ivState = { images: [], idx: 0, zoom: 1, panX: 0, panY: 0, dragging: false, dragStart: null, showAnnot: false, terms: {} };

function renderImagingViewer(images, terms){
  ivState.images = images;
  ivState.terms = terms || {};
  ivState.idx = 0;
  ivState.zoom = 1;
  ivState.panX = 0;
  ivState.panY = 0;
  return '<div id="iv-container">' + buildIvHtml() + '</div>';
}

function buildIvHtml(){
  var images = ivState.images;
  if (!images || !images.length) return "";
  var img = images[ivState.idx];
  var mod = (img.modality || "other").toLowerCase();
  var modLabel = {xr:"X-Ray",ct:"CT",mri:"MRI",usg:"Ultrasound"}[mod] || img.modality || "Other";

  var h = '<div class="iv-wrap"><div class="iv-row">';

  // Main viewer
  h += '<div class="iv-main">';
  var hasAnnot = !!(img.annotations && img.annotations.length);
  var canvasCls = "iv-canvas" + (hasAnnot && !ivState.showAnnot ? " no-annot" : "");
  h += '<div class="' + canvasCls + '" id="iv-canvas" onmousedown="ivStartDrag(event)" onmousemove="ivDrag(event)" onmouseup="ivEndDrag()" onmouseleave="ivEndDrag()" onwheel="ivWheel(event)" ondblclick="ivFit()">';
  if (img.url){
    h += '<div class="iv-img-wrap wm-frame" id="iv-img-wrap">';
    h += '<img class="iv-img" id="iv-img" src="' + escAttr(img.url) + '" alt="' + escAttr(img.title || "") + '" draggable="false" oncontextmenu="return false" onerror="imgErr(this)">';
    if (hasAnnot){
      h += renderAnnotSvg(img.annotations);
    }
    h += '</div>';
  } else {
    h += '<div style="color:rgba(255,255,255,0.4);font-size:13px">無影像</div>';
  }
  h += '<div class="iv-ctrls">';
  h += '<button onclick="ivZoom(0.2)" title="放大">+</button>';
  h += '<button onclick="ivZoom(-0.2)" title="縮小">−</button>';
  h += '<button onclick="ivFit()" title="重設 (雙擊影像也可)">⛶</button>';
  if (hasAnnot){
    var offCls = ivState.showAnnot ? "" : " off";
    h += '<button id="iv-annot-btn" class="' + offCls + '" onclick="ivToggleAnnot()" title="切換標注顯示 (A)">👁</button>';
  }
  h += '</div>';
  h += '<div class="iv-zoom-pct" id="iv-zoom-pct">100%</div>';
  if (hasAnnot){
    h += '<div class="iv-annot-hint">🟡 此影像含標注 · 點 <span class="iv-annot-hint-eye">👁</span> 或按 <kbd>A</kbd> 顯示</div>';
  }
  if (img.title || modLabel){
    h += '<div class="iv-label">' + escHtml(img.title || modLabel) + '</div>';
  }
  h += '</div>';
  h += '</div>';

  // Side panel
  h += '<div class="iv-panel">';
  h += '<div><span class="img-modality img-modality-' + mod + '">' + escHtml(modLabel) + '</span></div>';
  if (img.title) h += '<div class="iv-panel-title">' + fmtTerms(img.title) + '</div>';
  if (img.description) h += '<div class="iv-panel-desc">' + fmtTermsParas(img.description) + '</div>';
  if (img.findings && img.findings.length){
    h += '<div class="iv-findings">';
    img.findings.forEach(function(f){
      h += '<div class="iv-finding">' + fmtTerms(f) + '</div>';
    });
    h += '</div>';
  }
  if (!img.title && !img.description && (!img.findings || !img.findings.length)){
    h += '<div style="color:var(--text3);font-size:13px;font-style:italic;margin-top:4px">此影像尚未提供描述</div>';
  }
  h += '</div>';

  h += '</div>'; // iv-row

  // Thumbnail strip
  if (images.length > 1){
    h += '<div class="iv-thumbs">';
    images.forEach(function(im, i){
      var active = i === ivState.idx ? ' active' : '';
      h += '<div class="iv-thumb' + active + '" onclick="ivSwitch(' + i + ')">';
      if (im.url){
        h += '<img src="' + escAttr(im.url) + '" alt="" draggable="false" loading="lazy" onerror="imgErr(this)">';
      } else {
        h += '<div style="height:78px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.3);font-size:11px">無圖</div>';
      }
      h += '<div class="iv-thumb-label">Slice ' + (i + 1) + '</div>';
      h += '</div>';
    });
    h += '</div>';
    h += '<div class="iv-hint"><kbd>←</kbd> <kbd>→</kbd> 切換 slice　·　<kbd>+</kbd> <kbd>−</kbd> 縮放　·　<kbd>0</kbd> 重設　·　<kbd>A</kbd> 切換標注　·　滾輪 / 雙擊　·　拖曳平移</div>';
  }

  h += '</div>';
  return h;
}

function ivSwitch(idx){
  if (idx < 0 || idx >= ivState.images.length) return;
  ivState.idx = idx;
  ivState.zoom = 1;
  ivState.panX = 0;
  ivState.panY = 0;
  var c = document.getElementById("iv-container");
  if (c) c.innerHTML = buildIvHtml();
}

function ivZoom(delta){
  var newZoom = Math.round((ivState.zoom + delta) * 10) / 10;
  ivState.zoom = Math.max(0.5, Math.min(5, newZoom));
  if (ivState.zoom === 1){ ivState.panX = 0; ivState.panY = 0; }
  applyIvTransform();
}

function ivFit(){
  ivState.zoom = 1;
  ivState.panX = 0;
  ivState.panY = 0;
  applyIvTransform();
}

function applyIvTransform(){
  var wrap = document.getElementById("iv-img-wrap");
  if (wrap) wrap.style.transform = "translate(" + ivState.panX + "px, " + ivState.panY + "px) scale(" + ivState.zoom + ")";
  var pct = document.getElementById("iv-zoom-pct");
  if (pct) pct.textContent = Math.round(ivState.zoom * 100) + "%";
}

function ivStartDrag(e){
  if (ivState.zoom <= 1) return;
  ivState.dragging = true;
  ivState.dragStart = { x: e.clientX - ivState.panX, y: e.clientY - ivState.panY };
  var c = document.getElementById("iv-canvas");
  if (c) c.classList.add("dragging");
  e.preventDefault();
}

function ivDrag(e){
  if (!ivState.dragging) return;
  ivState.panX = e.clientX - ivState.dragStart.x;
  ivState.panY = e.clientY - ivState.dragStart.y;
  applyIvTransform();
}

function ivEndDrag(){
  ivState.dragging = false;
  var c = document.getElementById("iv-canvas");
  if (c) c.classList.remove("dragging");
}

function ivWheel(e){
  e.preventDefault();
  ivZoom(e.deltaY > 0 ? -0.15 : 0.15);
}

/* Render annotation overlay (circles / arrows / labels) as SVG
   Coordinates stored normalized 0-1 relative to image rect.
   viewBox 0-1 stretched to fill via preserveAspectRatio="none"; strokes use
   non-scaling-stroke so widths are in display pixels regardless of aspect. */
function renderAnnotSvg(annotations){
  var s = '<svg class="iv-annot" viewBox="0 0 1 1" preserveAspectRatio="none">';
  annotations.forEach(function(a){
    var color = a.color || "#ff5050";
    if (a.type === "circle"){
      var r = a.r || 0.06;
      s += '<circle cx="' + a.x + '" cy="' + a.y + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="3" vector-effect="non-scaling-stroke"/>';
    } else if (a.type === "arrow"){
      var dx = a.x2 - a.x1, dy = a.y2 - a.y1;
      var len = Math.sqrt(dx*dx + dy*dy);
      if (len < 0.001) return;
      var ahSize = 0.028;
      var ux = dx/len, uy = dy/len;
      var bx = a.x2 - ahSize*ux, by = a.y2 - ahSize*uy;
      var px = -uy, py = ux;
      var b1x = bx + 0.55*ahSize*px, b1y = by + 0.55*ahSize*py;
      var b2x = bx - 0.55*ahSize*px, b2y = by - 0.55*ahSize*py;
      s += '<line x1="' + a.x1 + '" y1="' + a.y1 + '" x2="' + bx + '" y2="' + by + '" stroke="' + color + '" stroke-width="3" vector-effect="non-scaling-stroke" stroke-linecap="round"/>';
      s += '<polygon points="' + a.x2 + ',' + a.y2 + ' ' + b1x + ',' + b1y + ' ' + b2x + ',' + b2y + '" fill="' + color + '"/>';
    } else if (a.type === "label"){
      s += '<text x="' + a.x + '" y="' + a.y + '" fill="' + color + '" stroke="rgba(0,0,0,0.85)" stroke-width="4" paint-order="stroke" font-size="0.055" font-weight="700" text-anchor="middle" dominant-baseline="middle" vector-effect="non-scaling-stroke">' + escHtml(a.text || "") + '</text>';
    }
  });
  s += '</svg>';
  return s;
}

function ivToggleAnnot(){
  ivState.showAnnot = !ivState.showAnnot;
  var c = document.getElementById("iv-canvas");
  if (c) c.classList.toggle("no-annot", !ivState.showAnnot);
  var btn = document.getElementById("iv-annot-btn");
  if (btn) btn.classList.toggle("off", !ivState.showAnnot);
}

/* Format text + replace {{key}} with clickable term chips */
function fmtTerms(text){
  if (!text) return "";
  var html = fmt(text);
  var terms = ivState.terms || {};
  if (!Object.keys(terms).length) return html;
  return html.replace(/\{\{([^}]+?)\}\}/g, function(match, key){
    var k = key.trim();
    if (terms[k]){
      return '<span class="iv-term" onclick="event.stopPropagation();showTerm(this,\'' + escAttr(k) + '\')">' + escHtml(k) + '</span>';
    }
    return match;
  });
}

// Like fmtTerms but converts newlines into paragraphs/line breaks.
// Normalises literal backslash-n (Postgres single-quoted) first.
function fmtTermsParas(text){
  if (!text) return "";
  var norm = String(text).replace(/\\n/g, "\n");
  // Split on blank lines → paragraphs; single newlines within a paragraph → <br>
  var paras = norm.split(/\n\s*\n+/).map(function(p){ return p.trim(); }).filter(Boolean);
  if (paras.length <= 1){
    // single paragraph: still honour single newlines as line breaks
    return fmtTerms(norm.trim()).replace(/\n/g, "<br>");
  }
  return paras.map(function(p){
    return '<p class="iv-desc-p">' + fmtTerms(p).replace(/\n/g, "<br>") + '</p>';
  }).join("");
}

function showTerm(el, key){
  hideTerm();
  var term = (ivState.terms || {})[key];
  if (!term) return;
  var h = '<div class="iv-term-popover" id="iv-term-popover" onclick="event.stopPropagation()">';
  h += '<button class="iv-term-close" onclick="hideTerm()" title="關閉 (Esc)">✕</button>';
  h += '<div class="iv-term-popover-head">';
  h += '<span class="iv-term-name">' + escHtml(term.name || key) + '</span>';
  if (term.name && term.name !== key) h += '<span class="iv-term-key">' + escHtml(key) + '</span>';
  h += '</div>';
  if (term.description) h += '<div class="iv-term-desc">' + fmt(term.description) + '</div>';
  if (term.mechanisms && term.mechanisms.length){
    h += '<div class="iv-term-mech-label">機轉 · Mechanisms</div>';
    h += '<ul class="iv-term-mech-list">';
    term.mechanisms.forEach(function(m){
      h += '<li>' + escHtml(m) + '</li>';
    });
    h += '</ul>';
  }
  h += '</div>';
  document.body.insertAdjacentHTML("beforeend", h);

  // Position popover near the clicked chip
  var pop = document.getElementById("iv-term-popover");
  var rect = el.getBoundingClientRect();
  var pr = pop.getBoundingClientRect();
  var top = rect.bottom + 8;
  var left = rect.left;
  if (left + pr.width > window.innerWidth - 10) left = window.innerWidth - pr.width - 10;
  if (left < 10) left = 10;
  if (top + pr.height > window.innerHeight - 10) top = rect.top - pr.height - 8;
  if (top < 10) top = 10;
  pop.style.top = top + "px";
  pop.style.left = left + "px";
}

function hideTerm(){
  var p = document.getElementById("iv-term-popover");
  if (p) p.remove();
}

// Close popover on outside click or Esc
document.addEventListener("click", function(e){
  var p = document.getElementById("iv-term-popover");
  if (!p) return;
  if (p.contains(e.target)) return;
  if (e.target.closest && e.target.closest(".iv-term")) return;
  hideTerm();
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape"){
    if (document.getElementById("iv-term-popover")) hideTerm();
  }
});

// Keyboard shortcuts: ← → switch slice, +/- zoom, 0 fit, A toggle annotations
document.addEventListener("keydown", function(e){
  // Skip if typing in inputs
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.isContentEditable)) return;
  // Skip if modifier keys (browser shortcuts)
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  // Only act when imaging viewer is visible
  if (!document.getElementById("iv-canvas") || !ivState.images.length) return;

  switch (e.key){
    case "ArrowLeft":
      if (ivState.idx > 0){ e.preventDefault(); ivSwitch(ivState.idx - 1); }
      break;
    case "ArrowRight":
      if (ivState.idx < ivState.images.length - 1){ e.preventDefault(); ivSwitch(ivState.idx + 1); }
      break;
    case "+":
    case "=":
      e.preventDefault(); ivZoom(0.2); break;
    case "-":
    case "_":
      e.preventDefault(); ivZoom(-0.2); break;
    case "0":
      e.preventDefault(); ivFit(); break;
    case "a":
    case "A":
      var cur = ivState.images[ivState.idx];
      if (cur && cur.annotations && cur.annotations.length){
        e.preventDefault(); ivToggleAnnot();
      }
      break;
  }
});

// Browser back/forward navigation
window.addEventListener("popstate", function(){
  var hash = location.hash.replace("#","");
  if (hash === "graph") {
    showGraph();
  } else if (hash === "symptoms") {
    showSymptoms();
  } else if (hash === "topics") {
    showTopics();
  } else if (hash === "bookmarks") {
    showBookmarks();
  } else if (hash === "compare") {
    showCompare();
  } else if (hash === "mymarks") {
    showMyMarks();
  } else if (hash === "review") {
    if(currentView !== "review") showHome();
  } else if (hash.indexOf("sx:") === 0) {
    var sxId = hash.slice(3);
    if (symptoms.find(function(s){ return s.id === sxId; })){
      showSymptomDetail(sxId);
    } else {
      showSymptoms();
    }
  } else if (hash.indexOf("topic:") === 0) {
    var topicId = hash.slice(6);
    if (topics.find(function(t){ return t.id === topicId; })){
      selectTopic(topicId, true);
    } else {
      showTopics();
    }
  } else if (hash && diseases.find(function(d){ return d.id === hash; })) {
    selectDisease(hash, null, true);
  } else if (hash.indexOf(":") > 0 && diseases.find(function(d){ return d.id === hash.split(":")[0]; })) {
    selectDisease(hash.split(":")[0], hash.split(":")[1], true);
  } else if (hash === "home" || !hash) {
    showHome();
  } else if (diseases.length > 0) {
    showHome();
  }
});

// Detect whether any text field in a section places images inline via [img:N]
function sectionUsesInlineImages(content){
  if(!content) return false;
  var re = /\[img:\d+\]/;
  if(content.paragraphs && content.paragraphs.some(function(p){ return re.test(p); })) return true;
  if(content.steps && content.steps.some(function(s){ return re.test(s.content||"") || re.test(s.title||""); })) return true;
  if(content.lists && content.lists.some(function(l){ return (l.items||[]).some(function(it){ return re.test(it); }); })) return true;
  return false;
}

function renderSection(data, drugs, comps, raw) {
  var content = data;
  if (typeof content === "string") try { content = JSON.parse(content); } catch(e) {}
  if (!content && !drugs && !comps) return '<p style="color:var(--text3)">此區段尚無內容</p>';

  // Custom renderers for high-yield & pattern-recognition tabs
  if (currentTab === "pearls") return renderPearls(content);
  if (currentTab === "pattern") return renderPatterns(content);

  var html = "";

  // Make this section's images available for inline [img:N] references in paragraphs/steps/lists
  _sectionInlineImages = (content && content.images) ? content.images : [];

  if (content) {
    if (currentTab === "prog") html += '<div class="prog-content">';
    if (content.images && content.images.length) {
      if (currentTab === "img") {
        html += renderImagingViewer(content.images, content.terms);
      } else if (!sectionUsesInlineImages(content)) {
        // Only auto-dump image cards when the text doesn't place them inline via [img:N]
        content.images.forEach(function(img) {
          var mod = (img.modality || "other").toLowerCase();
          var modLabel = {xr:"X-Ray",ct:"CT",mri:"MRI",usg:"Ultrasound"}[mod] || img.modality || "Other";
          html += '<div class="img-card">';
          if (img.url) html += '<img src="' + img.url + '" alt="' + (img.title || "") + '" loading="lazy" onerror="imgErr(this)">';
          html += '<div class="img-body">';
          html += '<span class="img-modality img-modality-' + mod + '">' + modLabel + '</span>';
          if (img.title) html += '<div class="img-title">' + fmt(img.title) + '</div>';
          if (img.description) html += '<div class="img-desc">' + fmt(img.description) + '</div>';
          if (img.findings && img.findings.length) {
            html += '<div style="margin-top:6px">';
            img.findings.forEach(function(f) { html += '<div class="img-finding">' + fmt(f) + '</div>'; });
            html += '</div>';
          }
          html += '</div></div>';
        });
      }
    }
    if (content.paragraphs) {
      content.paragraphs.forEach(function(p) { html += renderRichText(p); });
    }
    if (content.steps) {
      var isChain = (currentTab === "patho"); // 病生理 steps form a causal chain → timeline thread
      // Self-test toggle (病生理 only)
      if (isChain && content.steps.length) {
        html += '<div class="quiz-bar">';
        html += '<span class="quiz-bar-label"><i class="ti ti-bulb"></i> 學習模式</span>';
        html += '<div class="quiz-toggle">';
        html += '<button class="quiz-opt' + (!quizMode ? ' on' : '') + '" onclick="setQuizMode(false)">閱讀</button>';
        html += '<button class="quiz-opt' + (quizMode ? ' on' : '') + '" onclick="setQuizMode(true)">自我測驗</button>';
        html += '</div>';
        if (quizMode) html += '<button class="quiz-reveal-all" onclick="revealAllSteps()">全部展開</button>';
        html += '</div>';
      }
      html += '<div class="step-seq' + (isChain ? " step-chain" : "") + (isChain && quizMode ? " step-quiz" : "") + '">';
      content.steps.forEach(function(s, si) {
        var lastCls = (si === content.steps.length - 1) ? " step-last" : "";
        if (isChain && quizMode) {
          // Quiz: hide content behind a prompt; reveal on click
          var prompt = s.prompt ? s.prompt : ("為什麼？想想看「" + (s.title || ("第 " + s.step + " 步")) + "」的機轉");
          html += '<div class="step' + lastCls + ' step-q" id="stepq-' + si + '" onclick="revealStep(' + si + ')">';
          html += '<div class="step-num">' + s.step + '</div>';
          html += '<div class="step-body" style="flex:1"><div class="step-title">' + fmt(s.title) + '</div>';
          html += '<div class="step-q-prompt"><i class="ti ti-help-circle"></i> ' + escHtml(prompt) + '　<span class="step-q-hint">點擊揭曉</span></div>';
          html += '<div class="step-content step-q-answer">' + renderRichText(s.content) + '</div>';
          html += '</div></div>';
        } else {
          html += '<div class="step' + lastCls + '"><div class="step-num">' + s.step + '</div><div class="step-body" style="flex:1"><div class="step-title">' + fmt(s.title) + '</div><div class="step-content">' + renderRichText(s.content) + '</div></div></div>';
        }
      });
      html += '</div>';
    }
    if (content.lists) {
      content.lists.forEach(function(l) {
        html += '<div class="sl">' + fmt(l.title) + '</div><ul class="cl">';
        (l.items || []).forEach(function(item) {
          var lv = getLevel(item);
          var text = item.replace(/^\s+/, "").replace(/^[-*]\s+/, "");
          // C. Group header: ">> Label" → bold subordinating label, children indent under it
          var gm = text.match(/^>>\s+(.+)$/);
          if (gm){
            html += '<li class="l' + lv + ' cl-group">' + linkifyEntities(fmt(gm[1])) + '</li>';
            return;
          }
          // A. Key fact: "!! text" → emphasized takeaway with left accent bar
          var km = text.match(/^!!\s+(.+)$/);
          if (km){
            html += '<li class="l' + lv + ' cl-key">' + linkifyEntities(fmt(km[1])) + '</li>';
            return;
          }
          html += '<li class="l' + lv + '">' + linkifyEntities(fmt(text)) + '</li>';
        });
        html += '</ul>';
      });
    }
    if (content.pills) {
      html += '<div style="margin-top:8px">';
      content.pills.forEach(function(p) { html += '<span class="pill">' + p + '</span>'; });
      html += '</div>';
    }
    if (content.stats) {
      html += '<div class="stat-row" style="margin-top:12px">';
      content.stats.forEach(function(s) {
        html += '<div class="stat"><div class="stat-val">' + s.value + '</div><div class="stat-lbl">' + s.label + '</div></div>';
      });
      html += '</div>';
    }
    if (currentTab === "prog") html += '</div>';
  }

  if (drugs && drugs.length > 0) {
    // Group by treatment_line (1, 2, 3, ..., null=未分線)
    var groups = {};
    drugs.forEach(function(dr){
      var k = (dr.treatment_line == null) ? "null" : String(dr.treatment_line);
      if (!groups[k]) groups[k] = [];
      groups[k].push(dr);
    });
    var lineKeys = Object.keys(groups).sort(function(a, b){
      if (a === "null") return 1;
      if (b === "null") return -1;
      return parseInt(a, 10) - parseInt(b, 10);
    });
    var LINE_LABELS = { "1": ["第一線", "First-line"], "2": ["第二線", "Second-line"], "3": ["第三線", "Third-line"], "4": ["第四線", "Fourth-line"], "5": ["第五線", "Fifth-line"] };

    html += '<div class="drug-list">';
    lineKeys.forEach(function(lk){
      var arr = groups[lk];
      arr.sort(function(a, b){ return (a.sort_order||0) - (b.sort_order||0); });
      var lbl = LINE_LABELS[lk] || ["其他", "Other"];
      if (lk === "null") lbl = ["未分線", "Unclassified"];
      html += '<div class="drug-group">';
      html += '<div class="drug-group-header"><span>' + escHtml(lbl[0]) + ' <span class="drug-group-header-en">· ' + escHtml(lbl[1]) + '</span></span><span class="drug-group-count">' + arr.length + '</span></div>';
      arr.forEach(function(dr){
        html += '<div class="drug-entry">';
        // Header bar — name + subtitle (class) on left, badge on right
        html += '<div class="drug-head">';
        html += '<div class="drug-head-main">';
        html += '<div class="drug-name">' + linkifyEntities(escHtml(dr.name || "")) + '</div>';
        if (dr.drug_class) html += '<div class="drug-subtitle">' + escHtml(dr.drug_class) + '</div>';
        html += '</div>';
        if (dr.badge_label){
          var bc = BADGE_COLORS[dr.badge_color] || BADGE_COLORS.blue;
          html += '<span class="drug-badge" style="background:' + bc.bg + ';color:' + bc.fg + '">' + escHtml(dr.badge_label) + '</span>';
        }
        html += '</div>';

        // Body — dosage gets a prominent banner (clinical quick-reference); rest are labeled rows
        if (dr.dosage){
          html += '<div class="drug-dose"><span class="drug-dose-lbl">劑量</span><span class="drug-dose-val">' + renderRichText(dr.dosage) + '</span></div>';
        }
        var rows = [];
        if (dr.mechanism)  rows.push({ label: "機轉", en: "MECHANISM", value: dr.mechanism });
        if (dr.indication) rows.push({ label: "適應症", en: "INDICATION", value: dr.indication });
        if (dr.notes)      rows.push({ label: "注意", en: "CAUTION", value: dr.notes, caution: true });

        if (rows.length){
          html += '<div class="drug-body">';
          rows.forEach(function(r){
            html += '<div class="drug-field' + (r.caution ? " is-caution" : "") + '">';
            html += '<div class="drug-field-label"><span>' + (r.caution ? '⚠ ' : '') + escHtml(r.label) + '</span></div>';
            html += '<div class="drug-field-value">' + renderRichText(r.value) + '</div>';
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  if (comps && comps.length > 0) {
    comps.sort(function(a, b){ return (a.sort_order||0) - (b.sort_order||0); });
    html += '<div class="comp-list">';
    html += '<div class="comp-list-header"><span>併發症 <span class="comp-list-header-en">· COMPLICATIONS</span></span><span class="comp-list-count">' + comps.length + '</span></div>';
    comps.forEach(function(c){
      html += '<div class="comp-entry">';
      // Header: name + en + meta badges
      html += '<div class="comp-head">';
      html += '<div class="comp-title-wrap">';
      html += '<span class="comp-name">' + escHtml(c.name || "") + '</span>';
      if (c.name_en) html += '<span class="comp-name-en">' + escHtml(c.name_en) + '</span>';
      html += '</div>';
      html += '<div class="comp-meta">';
      if (c.incidence) html += '<span class="comp-meta-badge"><i class="ti ti-percentage"></i> ' + escHtml(c.incidence) + '</span>';
      if (c.timing)    html += '<span class="comp-meta-badge"><i class="ti ti-clock"></i> ' + escHtml(c.timing) + '</span>';
      if (c.severity === "high")   html += '<span class="comp-meta-badge comp-sev-high"><i class="ti ti-alert-triangle-filled"></i> 高危</span>';
      if (c.severity === "medium") html += '<span class="comp-meta-badge comp-sev-med"><i class="ti ti-alert-circle"></i> 中</span>';
      html += '</div>';
      html += '</div>';

      // Sections — pathophys + clues use timeline; others use richText
      function compSection(zh, en, value, useTimeline){
        if (!value || !value.trim()) return "";
        var s = '<div class="comp-section">';
        s += '<div class="comp-section-label"><span>' + escHtml(zh) + '</span><span class="comp-section-label-en">· ' + escHtml(en) + '</span></div>';
        s += '<div class="comp-section-content">' + (useTimeline ? renderPathway(value) : renderRichText(value)) + '</div>';
        s += '</div>';
        return s;
      }
      html += compSection("病生理",   "PATHOPHYSIOLOGY",  c.pathophysiology, true);
      html += compSection("臨床線索", "CLINICAL CLUES",   c.clinical_clues,  false);
      html += compSection("預防",     "PREVENTION",       c.prevention,      false);
      html += compSection("監測",     "MONITORING",       c.monitoring,      false);
      html += compSection("處理",     "MANAGEMENT",       c.management,      false);

      // Link to full disease page (if linked)
      if (c.has_link && c.linked_disease_id){
        html += '<div class="comp-link-row"><a class="comp-link" onclick="selectDisease(\'' + c.linked_disease_id + '\')">完整疾病頁 <i class="ti ti-arrow-narrow-right"></i></a></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (content && content.complications) {
    // Legacy: complications embedded in old prog content (rare)
    html += '<div class="sl">常見併發症</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    content.complications.forEach(function(c) {
      html += '<span class="cb cb-unlinked">' + c.name + (c.name_en ? "（" + c.name_en + "）" : "") + '</span>';
    });
    html += '</div>';
  }

  return html || '<p style="color:var(--text3)">此區段尚無內容</p>';
}

function showGraph() {
  currentView = "graph";
  clearBreadcrumb();
  try{history.pushState(null,null,"#graph")}catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent = "疾病關係圖";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  if (diseases.length === 0) {
    document.getElementById("mainContent").innerHTML = '<div class="card"><div class="empty">尚無疾病資料</div></div>';
    return;
  }

  // Build edges from complications using ALL diseases
  var edges = [];
  diseases.forEach(function(d) {
    var comps = compMap[d.id] || [];
    comps.forEach(function(c) {
      if (c.has_link && c.linked_disease_id) {
        var target = diseases.find(function(x) { return x.id === c.linked_disease_id; });
        if (target) edges.push({ from: d.id, to: target.id, label: c.name });
      }
    });
  });

  // Filter to display set: optionally only connected diseases
  var displayDiseases = diseases;
  if (graphState.onlyConnected){
    var hasEdge = {};
    edges.forEach(function(e){ hasEdge[e.from] = true; hasEdge[e.to] = true; });
    displayDiseases = diseases.filter(function(d){ return hasEdge[d.id]; });
  }
  if (!displayDiseases.length){
    document.getElementById("mainContent").innerHTML = '<div class="card"><div class="empty">「只看有關係」開啟，但目前沒有疾病有併發症連結</div></div>';
    return;
  }
  // Filter edges to those whose both ends are visible
  var visibleSet = {};
  displayDiseases.forEach(function(d){ visibleSet[d.id] = true; });
  edges = edges.filter(function(e){ return visibleSet[e.from] && visibleSet[e.to]; });

  // If focused disease no longer visible, clear focus
  if (graphState.focusedId && !visibleSet[graphState.focusedId]) graphState.focusedId = null;

  // Layout: circular/spherical arrangement on a square canvas
  var nodeCount = displayDiseases.length;
  // Square canvas sized to fit all nodes in a disc (area scales with node count)
  var side = Math.max(900, Math.ceil(Math.sqrt(nodeCount) * 130));
  var W = side, H = side;
  var cx = W / 2, cy = H / 2;
  var boundR = Math.min(W, H) / 2 - 70; // disc radius nodes must stay within
  var radius = boundR * 0.92;
  var nodes = {};
  displayDiseases.forEach(function(d, i) {
    // Seed on concentric rings (sunflower-ish) so the start is already disc-shaped
    var t = (i + 0.5) / nodeCount;
    var rr = radius * Math.sqrt(t);
    var angle = i * 2.399963; // golden angle → even disc fill
    nodes[d.id] = { x: cx + rr * Math.cos(angle), y: cy + rr * Math.sin(angle), d: d };
  });

  // Simple force to spread nodes
  for (var iter = 0; iter < 80; iter++) {
    displayDiseases.forEach(function(a) {
      displayDiseases.forEach(function(b) {
        if (a.id === b.id) return;
        var na = nodes[a.id], nb = nodes[b.id];
        var dx = nb.x - na.x, dy = nb.y - na.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 160) {
          var force = (160 - dist) * 0.04;
          na.x -= (dx / dist) * force;
          na.y -= (dy / dist) * force;
          nb.x += (dx / dist) * force;
          nb.y += (dy / dist) * force;
        }
      });
    });
    // Pull connected nodes closer
    edges.forEach(function(e) {
      var a = nodes[e.from], b = nodes[e.to];
      if (!a || !b) return;
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist > 200) {
        var force = (dist - 200) * 0.01;
        a.x += (dx / dist) * force;
        a.y += (dy / dist) * force;
        b.x -= (dx / dist) * force;
        b.y -= (dy / dist) * force;
      }
    });
    // Circular containment: keep every node inside the disc (instead of a rectangle)
    displayDiseases.forEach(function(d) {
      var nn = nodes[d.id];
      var dx = nn.x - cx, dy = nn.y - cy;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist > boundR) {
        nn.x = cx + (dx / dist) * boundR;
        nn.y = cy + (dy / dist) * boundR;
      }
    });
  }

  var svg = '<svg width="' + W + '" height="' + H + '" style="display:block;margin:0 auto">';

  // Arrow marker definition (used by all edges)
  svg += '<defs>';
  svg += '<marker id="arr" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">';
  svg += '<path d="M 0 0 L 10 5 L 0 10 z" class="graph-arrow"/>';
  svg += '</marker>';
  svg += '</defs>';

  // Draw edges
  var nodeR = 34;
  edges.forEach(function(e) {
    var a = nodes[e.from], b = nodes[e.to];
    if (!a || !b) return;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / dist, uy = dy / dist;
    // Trim line to start/end outside the node circles
    var sx = a.x + ux * nodeR;
    var sy = a.y + uy * nodeR;
    var ex = b.x - ux * nodeR;
    var ey = b.y - uy * nodeR;
    // Perpendicular offset for curve bow
    var mx = (sx + ex) / 2, my = (sy + ey) / 2;
    var tdx = ex - sx, tdy = ey - sy;
    var tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
    var ox = -tdy / tlen * 18, oy = tdx / tlen * 18;
    var d = 'M' + sx + ',' + sy + ' Q' + (mx + ox) + ',' + (my + oy) + ' ' + ex + ',' + ey;
    svg += '<path class="graph-edge" data-from="' + e.from + '" data-to="' + e.to + '" d="' + d + '" fill="none" stroke="#B5D4F4" stroke-width="1.5" marker-end="url(#arr)"><title>' + (e.label || '') + '</title></path>';
  });

  // Draw nodes
  displayDiseases.forEach(function(d) {
    var n = nodes[d.id];
    var color = CAT_COLORS[d.category] || "#7ab3d9";
    var fill = CAT_FILLS[d.category] || "#f0f5fb";
    var r = 32;
    svg += '<g class="graph-node" data-id="' + d.id + '" onclick="gNodeClick(\'' + d.id + '\')">';
    svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" fill="' + fill + '" stroke="' + color + '" stroke-width="2"/>';
    svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (r + 4) + '" fill="transparent" stroke="transparent" stroke-width="8"><title>' + (d.name_en || d.name) + '</title></circle>';
    var name = d.name.length > 6 ? d.name.substring(0, 6) + '…' : d.name;
    svg += '<text x="' + n.x + '" y="' + (n.y + 1) + '" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="500" fill="' + color + '">' + name + '</text>';
    svg += '<text x="' + n.x + '" y="' + (n.y + r + 15) + '" text-anchor="middle" font-size="11" fill="#4a7fa5">' + d.name + '</text>';
    svg += '</g>';
  });

  svg += '</svg>';

  // Legend
  var usedCats = {};
  displayDiseases.forEach(function(d) { if (d.category) usedCats[d.category] = CAT_COLORS[d.category] || "#7ab3d9"; });
  var legend = '<div class="legend" style="margin-top:14px">';
  Object.keys(usedCats).forEach(function(cat) {
    legend += '<div class="legend-item"><span class="legend-dot" style="background:' + usedCats[cat] + '"></span>' + cat + '</div>';
  });
  legend += '</div>';

  // Stats
  var edgeCount = edges.length;
  var hasEdgeCount = 0;
  var allEdges = [];
  diseases.forEach(function(d) {
    var comps = compMap[d.id] || [];
    comps.forEach(function(c) {
      if (c.has_link && c.linked_disease_id) allEdges.push({from: d.id, to: c.linked_disease_id});
    });
  });
  var allConnected = {};
  allEdges.forEach(function(e){ allConnected[e.from]=true; allConnected[e.to]=true; });
  hasEdgeCount = Object.keys(allConnected).length;

  var controls = '<div class="graph-toolbar">';
  controls += '<div class="graph-toolbar-group">';
  controls += '<button class="graph-pill" onclick="gZoom(1.25)">＋</button>';
  controls += '<button class="graph-pill" onclick="gZoom(0.8)">－</button>';
  controls += '<button class="graph-pill" onclick="gReset()">全圖</button>';
  controls += '<button class="graph-pill' + (graphState.onlyConnected ? ' on' : '') + '" onclick="gToggleConnected()">' +
    '<i class="ti ti-filter" style="vertical-align:-1px"></i> 只看有關係 ' +
    '<span style="opacity:0.6">(' + hasEdgeCount + '/' + diseases.length + ')</span></button>';
  controls += '</div>';
  controls += '<span class="graph-toolbar-hint">點節點高亮關係 · 再點一次開啟 · 點空白還原</span></div>';

  var info = '<div style="font-size:12px;color:var(--text3);text-align:center;margin-top:8px">連線 = 併發症關係（箭頭方向為併發症指向） · 共 ' + edgeCount + ' 條連結</div>';

  document.getElementById("mainContent").innerHTML = '<div class="card" style="padding:16px">' + controls + '<div id="graphWrap" style="overflow:hidden;border:0.5px solid var(--border);border-radius:8px;height:calc(100vh - 180px);position:relative;cursor:grab;touch-action:none"><div id="graphInner" style="transform-origin:0 0">' + svg + '</div><div id="minimap"></div></div>' + legend + info + '</div>';

  // Init pan/zoom
  var gx=0,gy=0,gs=1,dragging=false,sx=0,sy=0;
  var wrap=document.getElementById("graphWrap");
  var inner=document.getElementById("graphInner");
  function applyTransform(){inner.style.transform="translate("+gx+"px,"+gy+"px) scale("+gs+")"}

  // Auto-fit graph to viewport based on node bbox
  function autoFit(){
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      if (n.x - nodeR < minX) minX = n.x - nodeR;
      if (n.x + nodeR > maxX) maxX = n.x + nodeR;
      if (n.y - nodeR < minY) minY = n.y - nodeR;
      if (n.y + nodeR + 24 > maxY) maxY = n.y + nodeR + 24;
    });
    if (!isFinite(minX) || !isFinite(minY)) { gx=0; gy=0; gs=1; applyTransform(); return; }
    var bw = maxX - minX, bh = maxY - minY;
    var pad = 40;
    var scaleX = (rect.width - pad*2) / Math.max(bw, 1);
    var scaleY = (rect.height - pad*2) / Math.max(bh, 1);
    gs = Math.max(0.2, Math.min(scaleX, scaleY, 1));
    gx = rect.width/2 - (minX + bw/2) * gs;
    gy = rect.height/2 - (minY + bh/2) * gs;
    applyTransform();
    updateMinimap();
  }

  // === Minimap ===
  var mmW = 180, mmH = 120, mmPad = 6;
  var mmScale = 0, mmDx = 0, mmDy = 0;
  function buildMinimap(){
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      if (n.x < minX) minX = n.x;
      if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y;
      if (n.y > maxY) maxY = n.y;
    });
    if (!isFinite(minX)) return;
    var bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
    mmScale = Math.min((mmW - mmPad*2) / bw, (mmH - mmPad*2) / bh);
    mmDx = mmPad - minX * mmScale;
    mmDy = mmPad - minY * mmScale;
    var s = '<svg width="' + mmW + '" height="' + mmH + '">';
    edges.forEach(function(e){
      var a = nodes[e.from], b = nodes[e.to]; if (!a || !b) return;
      s += '<line x1="' + (a.x*mmScale+mmDx) + '" y1="' + (a.y*mmScale+mmDy) + '" x2="' + (b.x*mmScale+mmDx) + '" y2="' + (b.y*mmScale+mmDy) + '" stroke="#B5D4F4" stroke-width="0.4" opacity="0.6"/>';
    });
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      var color = CAT_COLORS[d.category] || "#7ab3d9";
      s += '<circle cx="' + (n.x*mmScale+mmDx) + '" cy="' + (n.y*mmScale+mmDy) + '" r="1.8" fill="' + color + '"/>';
    });
    s += '<rect class="mm-viewport" x="0" y="0" width="0" height="0"/>';
    s += '</svg>';
    var el = document.getElementById("minimap");
    if (el) el.innerHTML = s;
  }
  function updateMinimap(){
    if (!mmScale) return;
    var rect = wrap.getBoundingClientRect();
    var svgMinX = -gx / gs, svgMinY = -gy / gs;
    var svgW = rect.width / gs, svgH = rect.height / gs;
    var vp = document.querySelector("#minimap .mm-viewport");
    if (!vp) return;
    vp.setAttribute("x", svgMinX*mmScale + mmDx);
    vp.setAttribute("y", svgMinY*mmScale + mmDy);
    vp.setAttribute("width", Math.max(svgW*mmScale, 4));
    vp.setAttribute("height", Math.max(svgH*mmScale, 4));
  }
  buildMinimap();

  // Wrap applyTransform to also update minimap
  var _origApply = applyTransform;
  applyTransform = function(){ _origApply(); updateMinimap(); };

  // Click minimap → pan main view to that spot (centered)
  var mmEl = document.getElementById("minimap");
  if (mmEl){
    mmEl.addEventListener("click", function(e){
      if (!mmScale) return;
      var r = mmEl.getBoundingClientRect();
      var mx = e.clientX - r.left - 4, my = e.clientY - r.top - 4;
      var svgX = (mx - mmDx) / mmScale, svgY = (my - mmDy) / mmScale;
      var vr = wrap.getBoundingClientRect();
      gx = vr.width/2 - svgX*gs;
      gy = vr.height/2 - svgY*gs;
      applyTransform();
    });
  }

  // === Focus logic ===
  function applyGraphFocus(){
    var fid = graphState.focusedId;
    var connected = {};
    if (fid){
      connected[fid] = true;
      edges.forEach(function(e){
        if (e.from === fid) connected[e.to] = true;
        if (e.to === fid) connected[e.from] = true;
      });
    }
    document.querySelectorAll(".graph-node").forEach(function(g){
      var id = g.getAttribute("data-id");
      g.classList.toggle("faded", !!fid && !connected[id]);
      g.classList.toggle("focused", id === fid);
    });
    document.querySelectorAll(".graph-edge").forEach(function(pe){
      var from = pe.getAttribute("data-from"), to = pe.getAttribute("data-to");
      var isAdj = fid && (from === fid || to === fid);
      pe.classList.toggle("faded", !!fid && !isAdj);
      pe.classList.toggle("highlighted", !!isAdj);
    });
  }

  window.gNodeClick = function(id){
    if (graphState.focusedId === id){
      // Second click on same node → drill into disease
      graphState.focusedId = null;
      selectDisease(id);
    } else {
      graphState.focusedId = id;
      applyGraphFocus();
    }
  };

  // Empty-area click → clear focus (won't fire after drag)
  wrap.addEventListener("click", function(e){
    if (e.target.closest("g.graph-node")) return;
    if (e.target.closest("#minimap")) return;
    if (graphState.focusedId){
      graphState.focusedId = null;
      applyGraphFocus();
    }
  });

  // Restore focus state on render (e.g. after toggling onlyConnected)
  if (graphState.focusedId) applyGraphFocus();

  // Defer one tick so wrap dimensions are real
  setTimeout(autoFit, 0);

  wrap.addEventListener("mousedown",function(e){if(e.target.closest("g.graph-node"))return;if(e.target.closest("#minimap"))return;dragging=true;sx=e.clientX-gx;sy=e.clientY-gy;wrap.style.cursor="grabbing"});
  window.addEventListener("mousemove",function(e){if(!dragging)return;gx=e.clientX-sx;gy=e.clientY-sy;applyTransform()});
  window.addEventListener("mouseup",function(){dragging=false;if(wrap)wrap.style.cursor="grab"});
  wrap.addEventListener("wheel",function(e){e.preventDefault();var rect=wrap.getBoundingClientRect();var mx=e.clientX-rect.left,my=e.clientY-rect.top;var dz=e.deltaY<0?1.15:0.87;var ns=Math.max(0.2,Math.min(5,gs*dz));gx=mx-(mx-gx)*(ns/gs);gy=my-(my-gy)*(ns/gs);gs=ns;applyTransform()},{passive:false});
  wrap.addEventListener("touchstart",function(e){
    if(e.touches.length===1){
      dragging=true;sx=e.touches[0].clientX-gx;sy=e.touches[0].clientY-gy;
      wrap._lastTouchLen=1;
    } else if(e.touches.length===2){
      dragging=false;
      var t0=e.touches[0],t1=e.touches[1];
      wrap._pinchDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
      wrap._pinchScale=gs;
      wrap._pinchMid={x:(t0.clientX+t1.clientX)/2,y:(t0.clientY+t1.clientY)/2};
      wrap._pinchGx=gx;wrap._pinchGy=gy;
      wrap._lastTouchLen=2;
    }
  },{passive:true});
  wrap.addEventListener("touchmove",function(e){
    if(e.touches.length===2&&wrap._pinchDist){
      e.preventDefault();
      var t0=e.touches[0],t1=e.touches[1];
      var dist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);
      var ratio=dist/wrap._pinchDist;
      var ns=Math.max(0.2,Math.min(5,wrap._pinchScale*ratio));
      var rect=wrap.getBoundingClientRect();
      var mx=wrap._pinchMid.x-rect.left,my=wrap._pinchMid.y-rect.top;
      gx=mx-(mx-wrap._pinchGx)*(ns/wrap._pinchScale);
      gy=my-(my-wrap._pinchGy)*(ns/wrap._pinchScale);
      gs=ns;applyTransform();
    } else if(e.touches.length===1&&dragging){
      gx=e.touches[0].clientX-sx;gy=e.touches[0].clientY-sy;applyTransform();
    }
  },{passive:false});
  wrap.addEventListener("touchend",function(e){
    dragging=false;wrap._pinchDist=0;
  });
  window.gZoom=function(f){var rect=wrap.getBoundingClientRect();var mx=rect.width/2,my=rect.height/2;var ns=Math.max(0.2,Math.min(5,gs*f));gx=mx-(mx-gx)*(ns/gs);gy=my-(my-gy)*(ns/gs);gs=ns;applyTransform()};
  window.gReset=autoFit;
  window.gToggleConnected=function(){
    graphState.onlyConnected = !graphState.onlyConnected;
    showGraph();
  };
}

var MECH_PALETTE = ["#D85A30","#A3366B","#6B3FA0","#0F6E56","#854F0B","#185FA5","#8B4513","#2E8B57"];

function mechColor(m, idx){
  return m.color || MECH_PALETTE[idx % MECH_PALETTE.length];
}

function getMechs(sxId){
  return (mechBySxId[sxId] || []).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); });
}
function getAnatomies(mechId){
  return (anatomyByMechId[mechId] || []).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); });
}
function getDiseases(anatId){
  return (anatomyDxMap[anatId] || []).slice().sort(function(a,b){
    if (a.is_classic !== b.is_classic) return a.is_classic ? -1 : 1;
    return (a.sort_order||0)-(b.sort_order||0);
  });
}
function countSxStats(sxId){
  var mechs = getMechs(sxId);
  var anatN = 0, dxN = 0;
  mechs.forEach(function(m){
    var anats = getAnatomies(m.id);
    anatN += anats.length;
    anats.forEach(function(a){ dxN += getDiseases(a.id).length; });
  });
  return { mech: mechs.length, anat: anatN, dx: dxN };
}

function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
// Highlight a query term inside text (HTML-escaped first, then wrap matches in <mark>)
function hlMatch(text, q){
  var safe = escHtml(text);
  if (!q) return safe;
  try{
    var esc = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); // escape regex metachars
    return safe.replace(new RegExp("(" + esc + ")", "ig"), '<mark class="si-mark">$1</mark>');
  }catch(e){ return safe; }
}

/* Render the ASCII breadcrumb tree:
     Abdominal Pain
     └── Inflammation
         └── Appendix    (last item bolded)
*/
function buildTreeBox(labels){
  if (!labels || !labels.length) return "";
  var copyText = labels.join(" › ");
  var parts = labels.map(function(l, i){
    var isLast = i === labels.length - 1;
    return '<span class="tree-crumb' + (isLast ? ' tree-crumb-last' : '') + '">' + escHtml(l) + '</span>';
  });
  var sep = '<i class="tree-sep">›</i>';
  var attr = encodeURIComponent(copyText);
  return '<div class="tree-box">' +
    parts.join(sep) +
    '<button class="tree-copy" data-text="' + attr + '" onclick="copyTreeText(this)" title="複製"><i class="ti ti-copy"></i></button>' +
    '</div>';
}

function copyTreeText(btn){
  var text = decodeURIComponent(btn.getAttribute("data-text") || "");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      btn.innerHTML = '<i class="ti ti-check"></i>';
      setTimeout(function(){ btn.innerHTML = '<i class="ti ti-copy"></i>'; }, 1200);
    });
  }
}

function parseTopicBody(body, images){
  if (!body) return { blocks: [], used: {} };
  var blocks = [];
  var used = {};
  // First, collapse runs of consecutive [img:N] (separated only by whitespace) into a single token group.
  // Split on those whole groups so "[img:1] [img:2]" becomes one row block.
  var parts = body.split(/(\[img:\d+\](?:\s*\[img:\d+\])*)/g);
  parts.forEach(function(part){
    if (!part) return;
    if (/^\[img:\d+\](?:\s*\[img:\d+\])*$/.test(part)){
      var refs = part.match(/\[img:(\d+)\]/g) || [];
      var imgsInGroup = [];
      refs.forEach(function(r){
        var idx = parseInt(r.match(/\d+/)[0], 10) - 1;
        if (images[idx]){ used[idx] = true; imgsInGroup.push({ image: images[idx], idx: idx }); }
      });
      if (imgsInGroup.length === 0){
        blocks.push({ type: 'text', text: part });
      } else if (imgsInGroup.length === 1){
        blocks.push({ type: 'img', image: imgsInGroup[0].image, idx: imgsInGroup[0].idx });
      } else {
        blocks.push({ type: 'imgrow', images: imgsInGroup });
      }
    } else {
      blocks.push({ type: 'text', text: part });
    }
  });
  return { blocks: blocks, used: used };
}

function renderTopicList(query){
  var q = (query||"").toLowerCase().trim();
  var filtered = topics.filter(function(t){
    if (!q) return true;
    return (t.name||"").toLowerCase().indexOf(q)>=0 ||
           (t.name_en||"").toLowerCase().indexOf(q)>=0 ||
           (t.summary||"").toLowerCase().indexOf(q)>=0 ||
           (t.specialty||"").toLowerCase().indexOf(q)>=0;
  });

  // Group by topic_type, in TOPIC_TYPES order
  var groups = {};
  filtered.forEach(function(t){
    var k = t.topic_type || "concept";
    if (!groups[k]) groups[k] = [];
    groups[k].push(t);
  });
  var typeKeys = Object.keys(groups).sort(function(a,b){
    var oa = Object.keys(TOPIC_TYPES).indexOf(a), ob = Object.keys(TOPIC_TYPES).indexOf(b);
    if (oa<0) oa=999; if (ob<0) ob=999;
    return oa-ob;
  });

  var h = '<div class="card" style="padding:18px 22px">';
  h += '<div class="sxm-search" style="margin-bottom:18px"><input placeholder="搜尋專題（中／英／摘要／專科）..." value="' + escHtml(query||"") + '" oninput="renderTopicList(this.value)"></div>';

  if (!filtered.length){
    h += '<div class="sxm-empty"><div class="sxm-empty-text">找不到符合的專題</div></div>';
  } else {
    typeKeys.forEach(function(tk){
      var meta = TOPIC_TYPES[tk] || { zh: tk, icon: "ti-circle" };

      h += '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border);margin-bottom:8px">';

      h += '</div>';
      h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:0">';
      arr.forEach(function(t){
        h += '<div style="padding:12px 14px;border-bottom:0.5px solid var(--border);cursor:pointer;transition:background 0.12s" onmouseover="this.style.background=\'var(--hover)\'" onmouseout="this.style.background=\'transparent\'" onclick="selectTopic(\'' + t.id + '\')">';

  document.getElementById("topStatus").innerHTML = '<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="showTopics()"><i class="ti ti-arrow-left"></i> 返回專題列表</button>';
  syncTopbarRow2();

  var h = '<div class="card" style="padding:22px 26px">';

  // Header
  h += '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px">';
  h += '<span style="font-size:24px;font-weight:500;color:var(--text)">' + escHtml(t.name) + '</span>';
  if (t.name_en) h += '<span style="font-size:15px;color:var(--text2);font-weight:400">' + escHtml(t.name_en) + '</span>';
  h += '</div>';
  h += '<div style="height:2px;width:32px;background:var(--blue);margin:0 0 18px"></div>';

  if (t.summary){
    h += '<p style="font-size:14px;line-height:1.7;color:var(--text2);margin:0 0 22px">' + escHtml(t.summary) + '</p>';
  }

  // Sections — in type's default order, then any extras
  var secMap = topicSecMap[t.id] || {};
  var typeDefaults = (TOPIC_TYPES[t.topic_type] && TOPIC_TYPES[t.topic_type].sections) || [];
  var allKeys = [];
  typeDefaults.forEach(function(k){ if (secMap[k]) allKeys.push(k); });
  Object.keys(secMap).forEach(function(k){
    if (allKeys.indexOf(k) < 0) allKeys.push(k);
  });

  if (!allKeys.length){
    h += '<div class="sxm-empty" style="padding:30px 0"><div class="sxm-empty-text" style="color:var(--text3)">此專題尚無章節內容</div></div>';
  } else {
    allKeys.forEach(function(k){
      var s = secMap[k];
      var imgs = Array.isArray(s.images) ? s.images : [];
      var hasBody = s.body && s.body.trim();
      if (!hasBody && !imgs.length) return;
      var label = SECTION_LABELS[k] || k;
      h += '<div style="margin-bottom:26px">';
      h += '<div style="font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.12em;font-weight:500;margin-bottom:8px">' + escHtml(label) + '</div>';

      var used = {};
      if (hasBody){
        var parsed = parseTopicBody(s.body, imgs);
        used = parsed.used;
        parsed.blocks.forEach(function(b){
          if (b.type === 'text'){
            if (b.text.trim()){
              h += '<div style="color:var(--text)">' + renderRichText(b.text) + '</div>';
            }
          } else if (b.type === 'img'){
            h += renderTopicInlineImage(b.image);
          } else if (b.type === 'imgrow'){
            h += '<div class="topic-img-row">';
            b.images.forEach(function(g){ h += renderTopicInlineImage(g.image, true); });
            h += '</div>';
          }
        });
      }

      // Remaining (unreferenced) images → bottom gallery
      var leftover = imgs.filter(function(_, i){ return !used[i]; });
      if (leftover.length){
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:' + (hasBody ? '14' : '0') + 'px">';
        leftover.forEach(function(im){
          h += '<figure style="margin:0;border:0.5px solid var(--border);border-radius:8px;overflow:hidden;background:var(--bg2)">';
          h += '<div style="background:var(--img-bg);cursor:zoom-in" onclick="openTopicImage(\'' + escAttr(im.url) + '\',\'' + escAttr(im.caption||"") + '\')"><img src="' + escHtml(im.url) + '" loading="lazy" onerror="imgErr(this)" style="display:block;width:100%;max-height:220px;object-fit:contain"></div>';
          if (im.caption) h += '<figcaption style="padding:8px 12px;font-size:12px;color:var(--text2);line-height:1.5">' + escHtml(im.caption) + '</figcaption>';
          h += '</figure>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
  }

  h += '</div>';
  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
}

function renderSymptomList(query){
  var q = (query||"").toLowerCase();
  var filtered = symptoms.filter(function(s){
    if (!q) return true;
    return (s.name||"").toLowerCase().indexOf(q)>=0 ||
           (s.name_en||"").toLowerCase().indexOf(q)>=0 ||
           (s.description||"").toLowerCase().indexOf(q)>=0;
  });

  var h = '<div class="card" style="padding:16px">';
  h += '<div class="sxm-search"><input id="sxmSearch" placeholder="搜尋症狀（中／英）..." value="' + escHtml(query||"") + '" oninput="renderSymptomList(this.value)"></div>';

  if (!filtered.length){
    h += '<div class="sxm-empty"><div class="sxm-empty-icon">🔍</div><div class="sxm-empty-text">找不到符合「' + escHtml(query||"") + '」的症狀</div></div>';
  } else {
    h += '<div class="sxm-grid">';
    filtered.forEach(function(s){
      var stats = countSxStats(s.id);
      var rf = s.red_flags;
      if (typeof rf === "string") try{ rf = JSON.parse(rf); }catch(e){ rf = null; }
      var rfCount = (rf && rf.length) || 0;

      h += '<div class="sxm-card" onclick="showSymptomDetail(\'' + s.id + '\')">';
      h += '<div class="sxm-card-name">' + escHtml(s.name) + '</div>';
      if (s.name_en) h += '<div class="sxm-card-en">' + escHtml(s.name_en) + '</div>';
      if (s.description) h += '<div class="sxm-card-desc">' + escHtml(s.description) + '</div>';
      h += '<div class="sxm-card-foot">';
      h += '<span class="sxm-pill">🧠 ' + stats.mech + ' 機轉</span>';
      h += '<span class="sxm-pill" style="background:var(--green-bg);color:var(--green)">🫀 ' + stats.anat + ' 解剖</span>';
      h += '<span class="sxm-pill" style="background:var(--amber-bg);color:var(--amber)">🔬 ' + stats.dx + ' 疾病</span>';
      if (rfCount) h += '<span class="sxm-pill" style="background:rgba(226,75,74,0.1);color:var(--red)">🚩 ' + rfCount + '</span>';
      h += '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();

  if (inp && query){ inp.focus(); inp.setSelectionRange(query.length, query.length); }
