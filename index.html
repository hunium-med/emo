  }
});

function renderSection(data, drugs, comps, raw) {
  var content = data;
  if (typeof content === "string") try { content = JSON.parse(content); } catch(e) {}
  if (!content && !drugs && !comps) return '<p style="color:#7ab3d9">此區段尚無內容</p>';

  var html = "";

  if (content) {
    if (content.images && content.images.length) {
      if (currentTab === "img") {
        html += renderImagingViewer(content.images, content.terms);
      } else {
        content.images.forEach(function(img) {
          var mod = (img.modality || "other").toLowerCase();
          var modLabel = {xr:"X-Ray",ct:"CT",mri:"MRI",usg:"Ultrasound"}[mod] || img.modality || "Other";
          html += '<div class="img-card">';
          if (img.url) html += '<img src="' + img.url + '" alt="' + (img.title || "") + '">';
          html += '<div class="img-body">';
          html += '<span class="img-modality img-modality-' + mod + '">' + modLabel + '</span>';
          if (img.title) html += '<div class="img-title">' + fmt(img.title) + '</div>';
          if (img.description) html += '<div class="img-desc">' + fmt(img.description) + '</div>';
          if (img.findings && img.findings.length) {
            html += '<div style="margin-top:6px">';
            img.findings.forEach(function(f) { html += '<div class="img-finding">' + fmt(f) + '</div>'; });
            html += '</div>';
          }
          html += '</div></div>';
        });
      }
    }
    if (content.paragraphs) {
      content.paragraphs.forEach(function(p) { html += renderRichText(p); });
    }
    if (content.steps) {
      content.steps.forEach(function(s) {
        html += '<div class="step"><div class="step-num">' + s.step + '</div><div style="flex:1"><div class="step-title">' + fmt(s.title) + '</div><div class="step-content">' + renderRichText(s.content) + '</div></div></div>';
      });
    }
    if (content.lists) {
      content.lists.forEach(function(l) {
        html += '<div class="sl">' + fmt(l.title) + '</div><ul class="cl">';
        (l.items || []).forEach(function(item) {
          var lv = getLevel(item);
          var text = item.replace(/^\s+/, "");
          html += '<li class="l' + lv + '">' + fmt(text) + '</li>';
        });
        html += '</ul>';
      });
    }
    if (content.pills) {
      html += '<div style="margin-top:8px">';
      content.pills.forEach(function(p) { html += '<span class="pill">' + p + '</span>'; });
      html += '</div>';
    }
    if (content.stats) {
      html += '<div class="stat-row" style="margin-top:12px">';
      content.stats.forEach(function(s) {
        html += '<div class="stat"><div class="stat-val">' + s.value + '</div><div class="stat-lbl">' + s.label + '</div></div>';
      });
      html += '</div>';
    }
  }

  if (drugs && drugs.length > 0) {
    // Group by treatment_line (1, 2, 3, ..., null=未分線)
    var groups = {};
    drugs.forEach(function(dr){
      var k = (dr.treatment_line == null) ? "null" : String(dr.treatment_line);
      if (!groups[k]) groups[k] = [];
      groups[k].push(dr);
    });
    var lineKeys = Object.keys(groups).sort(function(a, b){
      if (a === "null") return 1;
      if (b === "null") return -1;
      return parseInt(a, 10) - parseInt(b, 10);
    });
    var LINE_LABELS = { "1": ["第一線", "First-line"], "2": ["第二線", "Second-line"], "3": ["第三線", "Third-line"], "4": ["第四線", "Fourth-line"], "5": ["第五線", "Fifth-line"] };

    html += '<div class="drug-list">';
    lineKeys.forEach(function(lk){
      var arr = groups[lk];
      arr.sort(function(a, b){ return (a.sort_order||0) - (b.sort_order||0); });
      var lbl = LINE_LABELS[lk] || ["其他", "Other"];
      if (lk === "null") lbl = ["未分線", "Unclassified"];
      html += '<div class="drug-group">';
      html += '<div class="drug-group-header"><span>' + escHtml(lbl[0]) + ' <span class="drug-group-header-en">· ' + escHtml(lbl[1]) + '</span></span><span class="drug-group-count">' + arr.length + '</span></div>';
      arr.forEach(function(dr){
        html += '<div class="drug-entry">';
        html += '<div class="drug-head">';
        html += '<span class="drug-name">' + escHtml(dr.name || "") + '</span>';
        // Optional badge_label (acute, special situation, etc.)
        if (dr.badge_label){
          var bc = BADGE_COLORS[dr.badge_color] || BADGE_COLORS.blue;
          html += '<span class="drug-badge" style="background:' + bc.bg + ';color:' + bc.fg + '">' + escHtml(dr.badge_label) + '</span>';
        }
        if (dr.drug_class) html += '<span class="drug-class">' + escHtml(dr.drug_class) + '</span>';
        html += '</div>';

        // Build fields grid only with filled fields
        var rows = [];
        if (dr.mechanism)  rows.push({ label: "機轉", value: dr.mechanism });
        if (dr.dosage)     rows.push({ label: "劑量", value: dr.dosage });
        if (dr.indication) rows.push({ label: "適應症", value: dr.indication });
        if (dr.notes)      rows.push({ label: "注意", value: dr.notes });

        if (rows.length){
          html += '<div class="drug-fields">';
          rows.forEach(function(r){
            html += '<div class="drug-field-label">' + escHtml(r.label) + '</div>';
            html += '<div class="drug-field-value">' + renderRichText(r.value) + '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
    });
    html += '</div>';
  }

  if (comps && comps.length > 0) {
    comps.sort(function(a, b){ return (a.sort_order||0) - (b.sort_order||0); });
    html += '<div class="comp-list">';
    html += '<div class="comp-list-header"><span>併發症 <span class="comp-list-header-en">· COMPLICATIONS</span></span><span class="comp-list-count">' + comps.length + '</span></div>';
    comps.forEach(function(c){
      html += '<div class="comp-entry">';
      // Header: name + en + meta badges
      html += '<div class="comp-head">';
      html += '<div class="comp-title-wrap">';
      html += '<span class="comp-name">' + escHtml(c.name || "") + '</span>';
      if (c.name_en) html += '<span class="comp-name-en">' + escHtml(c.name_en) + '</span>';
      html += '</div>';
      html += '<div class="comp-meta">';
      if (c.incidence) html += '<span class="comp-meta-badge"><i class="ti ti-percentage"></i> ' + escHtml(c.incidence) + '</span>';
      if (c.timing)    html += '<span class="comp-meta-badge"><i class="ti ti-clock"></i> ' + escHtml(c.timing) + '</span>';
      if (c.severity === "high")   html += '<span class="comp-meta-badge comp-sev-high"><i class="ti ti-alert-triangle-filled"></i> 高危</span>';
      if (c.severity === "medium") html += '<span class="comp-meta-badge comp-sev-med"><i class="ti ti-alert-circle"></i> 中</span>';
      html += '</div>';
      html += '</div>';

      // Sections — pathophys + clues use timeline; others use richText
      function compSection(zh, en, value, useTimeline){
        if (!value || !value.trim()) return "";
        var s = '<div class="comp-section">';
        s += '<div class="comp-section-label"><span>' + escHtml(zh) + '</span><span class="comp-section-label-en">· ' + escHtml(en) + '</span></div>';
        s += '<div class="comp-section-content">' + (useTimeline ? renderPathway(value) : renderRichText(value)) + '</div>';
        s += '</div>';
        return s;
      }
      html += compSection("病生理",   "PATHOPHYSIOLOGY",  c.pathophysiology, true);
      html += compSection("臨床線索", "CLINICAL CLUES",   c.clinical_clues,  false);
      html += compSection("預防",     "PREVENTION",       c.prevention,      false);
      html += compSection("監測",     "MONITORING",       c.monitoring,      false);
      html += compSection("處理",     "MANAGEMENT",       c.management,      false);

      // Link to full disease page (if linked)
      if (c.has_link && c.linked_disease_id){
        html += '<div class="comp-link-row"><a class="comp-link" onclick="selectDisease(\'' + c.linked_disease_id + '\')">完整疾病頁 <i class="ti ti-arrow-narrow-right"></i></a></div>';
      }
      html += '</div>';
    });
    html += '</div>';
  } else if (content && content.complications) {
    // Legacy: complications embedded in old prog content (rare)
    html += '<div class="sl">常見併發症</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    content.complications.forEach(function(c) {
      html += '<span class="cb cb-unlinked">' + c.name + (c.name_en ? "（" + c.name_en + "）" : "") + '</span>';
    });
    html += '</div>';
  }

  return html || '<p style="color:#7ab3d9">此區段尚無內容</p>';
}

function showGraph() {
  currentView = "graph";
  try{history.pushState(null,null,"#graph")}catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent = "疾病關係圖";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  if (diseases.length === 0) {
    document.getElementById("mainContent").innerHTML = '<div class="card"><div class="empty">尚無疾病資料</div></div>';
    return;
  }

  // Build edges from complications using ALL diseases
  var edges = [];
  diseases.forEach(function(d) {
    var comps = compMap[d.id] || [];
    comps.forEach(function(c) {
      if (c.has_link && c.linked_disease_id) {
        var target = diseases.find(function(x) { return x.id === c.linked_disease_id; });
        if (target) edges.push({ from: d.id, to: target.id, label: c.name });
      }
    });
  });

  // Filter to display set: optionally only connected diseases
  var displayDiseases = diseases;
  if (graphState.onlyConnected){
    var hasEdge = {};
    edges.forEach(function(e){ hasEdge[e.from] = true; hasEdge[e.to] = true; });
    displayDiseases = diseases.filter(function(d){ return hasEdge[d.id]; });
  }
  if (!displayDiseases.length){
    document.getElementById("mainContent").innerHTML = '<div class="card"><div class="empty">「只看有關係」開啟，但目前沒有疾病有併發症連結</div></div>';
    return;
  }
  // Filter edges to those whose both ends are visible
  var visibleSet = {};
  displayDiseases.forEach(function(d){ visibleSet[d.id] = true; });
  edges = edges.filter(function(e){ return visibleSet[e.from] && visibleSet[e.to]; });

  // If focused disease no longer visible, clear focus
  if (graphState.focusedId && !visibleSet[graphState.focusedId]) graphState.focusedId = null;

  // Layout: use full space
  var W = 1200, H = Math.max(800, displayDiseases.length * 40);
  var cx = W / 2, cy = H / 2;
  var radius = Math.min(W, H) / 2 - 100;
  var nodes = {};
  displayDiseases.forEach(function(d, i) {
    var angle = (2 * Math.PI * i) / displayDiseases.length - Math.PI / 2;
    nodes[d.id] = { x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle), d: d };
  });

  // Simple force to spread nodes
  for (var iter = 0; iter < 80; iter++) {
    displayDiseases.forEach(function(a) {
      displayDiseases.forEach(function(b) {
        if (a.id === b.id) return;
        var na = nodes[a.id], nb = nodes[b.id];
        var dx = nb.x - na.x, dy = nb.y - na.y;
        var dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 160) {
          var force = (160 - dist) * 0.04;
          na.x -= (dx / dist) * force;
          na.y -= (dy / dist) * force;
          nb.x += (dx / dist) * force;
          nb.y += (dy / dist) * force;
        }
      });
    });
    // Pull connected nodes closer
    edges.forEach(function(e) {
      var a = nodes[e.from], b = nodes[e.to];
      if (!a || !b) return;
      var dx = b.x - a.x, dy = b.y - a.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist > 200) {
        var force = (dist - 200) * 0.01;
        a.x += (dx / dist) * force;
        a.y += (dy / dist) * force;
        b.x -= (dx / dist) * force;
        b.y -= (dy / dist) * force;
      }
    });
    displayDiseases.forEach(function(d) {
      var n = nodes[d.id];
      n.x = Math.max(60, Math.min(W - 60, n.x));
      n.y = Math.max(60, Math.min(H - 60, n.y));
    });
  }

  var svg = '<svg width="' + W + '" height="' + H + '" style="display:block;margin:0 auto">';

  // Arrow marker definition (used by all edges)
  svg += '<defs>';
  svg += '<marker id="arr" viewBox="0 0 10 10" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">';
  svg += '<path d="M 0 0 L 10 5 L 0 10 z" class="graph-arrow"/>';
  svg += '</marker>';
  svg += '</defs>';

  // Draw edges
  var nodeR = 34;
  edges.forEach(function(e) {
    var a = nodes[e.from], b = nodes[e.to];
    if (!a || !b) return;
    var dx = b.x - a.x, dy = b.y - a.y;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / dist, uy = dy / dist;
    // Trim line to start/end outside the node circles
    var sx = a.x + ux * nodeR;
    var sy = a.y + uy * nodeR;
    var ex = b.x - ux * nodeR;
    var ey = b.y - uy * nodeR;
    // Perpendicular offset for curve bow
    var mx = (sx + ex) / 2, my = (sy + ey) / 2;
    var tdx = ex - sx, tdy = ey - sy;
    var tlen = Math.sqrt(tdx*tdx + tdy*tdy) || 1;
    var ox = -tdy / tlen * 18, oy = tdx / tlen * 18;
    var d = 'M' + sx + ',' + sy + ' Q' + (mx + ox) + ',' + (my + oy) + ' ' + ex + ',' + ey;
    svg += '<path class="graph-edge" data-from="' + e.from + '" data-to="' + e.to + '" d="' + d + '" fill="none" stroke="#B5D4F4" stroke-width="1.5" marker-end="url(#arr)"><title>' + (e.label || '') + '</title></path>';
  });

  // Draw nodes
  displayDiseases.forEach(function(d) {
    var n = nodes[d.id];
    var color = CAT_COLORS[d.category] || "#7ab3d9";
    var fill = CAT_FILLS[d.category] || "#f0f5fb";
    var r = 32;
    svg += '<g class="graph-node" data-id="' + d.id + '" onclick="gNodeClick(\'' + d.id + '\')">';
    svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + r + '" fill="' + fill + '" stroke="' + color + '" stroke-width="2"/>';
    svg += '<circle cx="' + n.x + '" cy="' + n.y + '" r="' + (r + 4) + '" fill="transparent" stroke="transparent" stroke-width="8"><title>' + (d.name_en || d.name) + '</title></circle>';
    var name = d.name.length > 6 ? d.name.substring(0, 6) + '…' : d.name;
    svg += '<text x="' + n.x + '" y="' + (n.y + 1) + '" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="500" fill="' + color + '">' + name + '</text>';
    svg += '<text x="' + n.x + '" y="' + (n.y + r + 15) + '" text-anchor="middle" font-size="11" fill="#4a7fa5">' + d.name + '</text>';
    svg += '</g>';
  });

  svg += '</svg>';

  // Legend
  var usedCats = {};
  displayDiseases.forEach(function(d) { if (d.category) usedCats[d.category] = CAT_COLORS[d.category] || "#7ab3d9"; });
  var legend = '<div class="legend" style="margin-top:14px">';
  Object.keys(usedCats).forEach(function(cat) {
    legend += '<div class="legend-item"><span class="legend-dot" style="background:' + usedCats[cat] + '"></span>' + cat + '</div>';
  });
  legend += '</div>';

  // Stats
  var edgeCount = edges.length;
  var hasEdgeCount = 0;
  var allEdges = [];
  diseases.forEach(function(d) {
    var comps = compMap[d.id] || [];
    comps.forEach(function(c) {
      if (c.has_link && c.linked_disease_id) allEdges.push({from: d.id, to: c.linked_disease_id});
    });
  });
  var allConnected = {};
  allEdges.forEach(function(e){ allConnected[e.from]=true; allConnected[e.to]=true; });
  hasEdgeCount = Object.keys(allConnected).length;

  var controls = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;flex-wrap:wrap">';
  controls += '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
  controls += '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="gZoom(1.25)">＋</button>';
  controls += '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="gZoom(0.8)">－</button>';
  controls += '<button class="btn btn-ghost" style="padding:6px 12px;font-size:12px" onclick="gReset()">全圖</button>';
  controls += '<button class="graph-toggle' + (graphState.onlyConnected ? ' on' : '') + '" onclick="gToggleConnected()" title="只顯示有併發症連結的疾病">' +
    '<i class="ti ti-filter" style="vertical-align:-1px"></i> 只看有關係 ' +
    '<span style="opacity:0.7">(' + hasEdgeCount + '/' + diseases.length + ')</span></button>';
  controls += '</div>';
  controls += '<span style="font-size:11px;color:#7ab3d9">點節點高亮關係 · 再點一次開啟 · 點空白還原</span></div>';

  var info = '<div style="font-size:12px;color:#7ab3d9;text-align:center;margin-top:8px">連線 = 併發症關係（箭頭方向為併發症指向） · 共 ' + edgeCount + ' 條連結</div>';

  document.getElementById("mainContent").innerHTML = '<div class="card" style="padding:16px">' + controls + '<div id="graphWrap" style="overflow:hidden;border:0.5px solid #B5D4F4;border-radius:8px;height:calc(100vh - 180px);position:relative;cursor:grab"><div id="graphInner" style="transform-origin:0 0">' + svg + '</div><div id="minimap"></div></div>' + legend + info + '</div>';

  // Init pan/zoom
  var gx=0,gy=0,gs=1,dragging=false,sx=0,sy=0;
  var wrap=document.getElementById("graphWrap");
  var inner=document.getElementById("graphInner");
  function applyTransform(){inner.style.transform="translate("+gx+"px,"+gy+"px) scale("+gs+")"}

  // Auto-fit graph to viewport based on node bbox
  function autoFit(){
    if (!wrap) return;
    var rect = wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      if (n.x - nodeR < minX) minX = n.x - nodeR;
      if (n.x + nodeR > maxX) maxX = n.x + nodeR;
      if (n.y - nodeR < minY) minY = n.y - nodeR;
      if (n.y + nodeR + 24 > maxY) maxY = n.y + nodeR + 24;
    });
    if (!isFinite(minX) || !isFinite(minY)) { gx=0; gy=0; gs=1; applyTransform(); return; }
    var bw = maxX - minX, bh = maxY - minY;
    var pad = 40;
    var scaleX = (rect.width - pad*2) / Math.max(bw, 1);
    var scaleY = (rect.height - pad*2) / Math.max(bh, 1);
    gs = Math.max(0.2, Math.min(scaleX, scaleY, 1));
    gx = rect.width/2 - (minX + bw/2) * gs;
    gy = rect.height/2 - (minY + bh/2) * gs;
    applyTransform();
    updateMinimap();
  }

  // === Minimap ===
  var mmW = 180, mmH = 120, mmPad = 6;
  var mmScale = 0, mmDx = 0, mmDy = 0;
  function buildMinimap(){
    var minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      if (n.x < minX) minX = n.x;
      if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y;
      if (n.y > maxY) maxY = n.y;
    });
    if (!isFinite(minX)) return;
    var bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);
    mmScale = Math.min((mmW - mmPad*2) / bw, (mmH - mmPad*2) / bh);
    mmDx = mmPad - minX * mmScale;
    mmDy = mmPad - minY * mmScale;
    var s = '<svg width="' + mmW + '" height="' + mmH + '">';
    edges.forEach(function(e){
      var a = nodes[e.from], b = nodes[e.to]; if (!a || !b) return;
      s += '<line x1="' + (a.x*mmScale+mmDx) + '" y1="' + (a.y*mmScale+mmDy) + '" x2="' + (b.x*mmScale+mmDx) + '" y2="' + (b.y*mmScale+mmDy) + '" stroke="#B5D4F4" stroke-width="0.4" opacity="0.6"/>';
    });
    displayDiseases.forEach(function(d){
      var n = nodes[d.id]; if (!n) return;
      var color = CAT_COLORS[d.category] || "#7ab3d9";
      s += '<circle cx="' + (n.x*mmScale+mmDx) + '" cy="' + (n.y*mmScale+mmDy) + '" r="1.8" fill="' + color + '"/>';
    });
    s += '<rect class="mm-viewport" x="0" y="0" width="0" height="0"/>';
    s += '</svg>';
    var el = document.getElementById("minimap");
    if (el) el.innerHTML = s;
  }
  function updateMinimap(){
    if (!mmScale) return;
    var rect = wrap.getBoundingClientRect();
    var svgMinX = -gx / gs, svgMinY = -gy / gs;
    var svgW = rect.width / gs, svgH = rect.height / gs;
    var vp = document.querySelector("#minimap .mm-viewport");
    if (!vp) return;
    vp.setAttribute("x", svgMinX*mmScale + mmDx);
    vp.setAttribute("y", svgMinY*mmScale + mmDy);
    vp.setAttribute("width", Math.max(svgW*mmScale, 4));
    vp.setAttribute("height", Math.max(svgH*mmScale, 4));
  }
  buildMinimap();

  // Wrap applyTransform to also update minimap
  var _origApply = applyTransform;
  applyTransform = function(){ _origApply(); updateMinimap(); };

  // Click minimap → pan main view to that spot (centered)
  var mmEl = document.getElementById("minimap");
  if (mmEl){
    mmEl.addEventListener("click", function(e){
      if (!mmScale) return;
      var r = mmEl.getBoundingClientRect();
      var mx = e.clientX - r.left - 4, my = e.clientY - r.top - 4;
      var svgX = (mx - mmDx) / mmScale, svgY = (my - mmDy) / mmScale;
      var vr = wrap.getBoundingClientRect();
      gx = vr.width/2 - svgX*gs;
      gy = vr.height/2 - svgY*gs;
      applyTransform();
    });
  }

  // === Focus logic ===
  function applyGraphFocus(){
    var fid = graphState.focusedId;
    var connected = {};
    if (fid){
      connected[fid] = true;
      edges.forEach(function(e){
        if (e.from === fid) connected[e.to] = true;
        if (e.to === fid) connected[e.from] = true;
      });
    }
    document.querySelectorAll(".graph-node").forEach(function(g){
      var id = g.getAttribute("data-id");
      g.classList.toggle("faded", !!fid && !connected[id]);
      g.classList.toggle("focused", id === fid);
    });
    document.querySelectorAll(".graph-edge").forEach(function(pe){
      var from = pe.getAttribute("data-from"), to = pe.getAttribute("data-to");
      var isAdj = fid && (from === fid || to === fid);
      pe.classList.toggle("faded", !!fid && !isAdj);
      pe.classList.toggle("highlighted", !!isAdj);
    });
  }

  window.gNodeClick = function(id){
    if (graphState.focusedId === id){
      // Second click on same node → drill into disease
      graphState.focusedId = null;
      selectDisease(id);
    } else {
      graphState.focusedId = id;
      applyGraphFocus();
    }
  };

  // Empty-area click → clear focus (won't fire after drag)
  wrap.addEventListener("click", function(e){
    if (e.target.closest("g.graph-node")) return;
    if (e.target.closest("#minimap")) return;
    if (graphState.focusedId){
      graphState.focusedId = null;
      applyGraphFocus();
    }
  });

  // Restore focus state on render (e.g. after toggling onlyConnected)
  if (graphState.focusedId) applyGraphFocus();

  // Defer one tick so wrap dimensions are real
  setTimeout(autoFit, 0);

  wrap.addEventListener("mousedown",function(e){if(e.target.closest("g.graph-node"))return;if(e.target.closest("#minimap"))return;dragging=true;sx=e.clientX-gx;sy=e.clientY-gy;wrap.style.cursor="grabbing"});
  window.addEventListener("mousemove",function(e){if(!dragging)return;gx=e.clientX-sx;gy=e.clientY-sy;applyTransform()});
  window.addEventListener("mouseup",function(){dragging=false;if(wrap)wrap.style.cursor="grab"});
  wrap.addEventListener("wheel",function(e){e.preventDefault();var rect=wrap.getBoundingClientRect();var mx=e.clientX-rect.left,my=e.clientY-rect.top;var dz=e.deltaY<0?1.15:0.87;var ns=Math.max(0.2,Math.min(5,gs*dz));gx=mx-(mx-gx)*(ns/gs);gy=my-(my-gy)*(ns/gs);gs=ns;applyTransform()},{passive:false});
  wrap.addEventListener("touchstart",function(e){if(e.touches.length===1){dragging=true;sx=e.touches[0].clientX-gx;sy=e.touches[0].clientY-gy}},{passive:true});
  wrap.addEventListener("touchmove",function(e){if(!dragging||e.touches.length!==1)return;gx=e.touches[0].clientX-sx;gy=e.touches[0].clientY-sy;applyTransform()},{passive:true});
  wrap.addEventListener("touchend",function(){dragging=false});
  window.gZoom=function(f){var rect=wrap.getBoundingClientRect();var mx=rect.width/2,my=rect.height/2;var ns=Math.max(0.2,Math.min(5,gs*f));gx=mx-(mx-gx)*(ns/gs);gy=my-(my-gy)*(ns/gs);gs=ns;applyTransform()};
  window.gReset=autoFit;
  window.gToggleConnected=function(){
    graphState.onlyConnected = !graphState.onlyConnected;
    showGraph();
  };
}

/* ===== Symptom Learning: Symptom → Mechanism → Anatomy → Disease ===== */

var MECH_PALETTE = ["#D85A30","#A3366B","#6B3FA0","#0F6E56","#854F0B","#185FA5","#8B4513","#2E8B57"];

function mechColor(m, idx){
  return m.color || MECH_PALETTE[idx % MECH_PALETTE.length];
}

function getMechs(sxId){
  return (mechBySxId[sxId] || []).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); });
}
function getAnatomies(mechId){
  return (anatomyByMechId[mechId] || []).slice().sort(function(a,b){ return (a.sort_order||0)-(b.sort_order||0); });
}
function getDiseases(anatId){
  return (anatomyDxMap[anatId] || []).slice().sort(function(a,b){
    if (a.is_classic !== b.is_classic) return a.is_classic ? -1 : 1;
    return (a.sort_order||0)-(b.sort_order||0);
  });
}
function countSxStats(sxId){
  var mechs = getMechs(sxId);
  var anatN = 0, dxN = 0;
  mechs.forEach(function(m){
    var anats = getAnatomies(m.id);
    anatN += anats.length;
    anats.forEach(function(a){ dxN += getDiseases(a.id).length; });
  });
  return { mech: mechs.length, anat: anatN, dx: dxN };
}

function escHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* Render the ASCII breadcrumb tree:
     Abdominal Pain
     └── Inflammation
         └── Appendix    (last item bolded)
*/
function buildTreeBox(labels){
  if (!labels || !labels.length) return "";
  var copyText = labels.join(" › ");
  var parts = labels.map(function(l, i){
    var isLast = i === labels.length - 1;
    return '<span class="tree-crumb' + (isLast ? ' tree-crumb-last' : '') + '">' + escHtml(l) + '</span>';
  });
  var sep = '<i class="tree-sep">›</i>';
  var attr = encodeURIComponent(copyText);
  return '<div class="tree-box">' +
    parts.join(sep) +
    '<button class="tree-copy" data-text="' + attr + '" onclick="copyTreeText(this)" title="複製"><i class="ti ti-copy"></i></button>' +
    '</div>';
}

function copyTreeText(btn){
  var text = decodeURIComponent(btn.getAttribute("data-text") || "");
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      btn.innerHTML = '<i class="ti ti-check"></i>';
      setTimeout(function(){ btn.innerHTML = '<i class="ti ti-copy"></i>'; }, 1200);
    });
  }
}

/* ============ Knowledge Topics ============ */
function parseTopicBody(body, images){
  if (!body) return { blocks: [], used: {} };
  var blocks = [];
  var used = {};
  var parts = body.split(/(\[img:\d+\])/g);
  parts.forEach(function(part){
    if (!part) return;
    var m = part.match(/^\[img:(\d+)\]$/);
    if (m){
      var idx = parseInt(m[1], 10) - 1;
      if (images[idx]){
        used[idx] = true;
        blocks.push({ type: 'img', image: images[idx], idx: idx });
      } else {
        blocks.push({ type: 'text', text: '[img:' + (idx+1) + ' 找不到]' });
      }
    } else {
      blocks.push({ type: 'text', text: part });
    }
  });
  return { blocks: blocks, used: used };
}

  // Group by topic_type, in TOPIC_TYPES order

  }

  // Sections — in type's default order, then any extras
  var secMap = topicSecMap[t.id] || {};

  var allKeys = [];
  typeDefaults.forEach(function(k){ if (secMap[k]) allKeys.push(k); });

      var leftover = imgs.filter(function(_, i){ return !used[i]; });
      if (leftover.length){
        h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:' + (hasBody ? '14' : '0') + 'px">';

          h += '</figure>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
  }

  h += '</div>';
  document.getElementById("mainContent").innerHTML = h;
}

function renderModeSelector(){

function setSymMode(mode){
  currentSymMode = mode;
  // Re-render only mode area + selector buttons
  var sx = symptoms.find(function(s){ return s.id === currentSxId; });
  if (!sx) return;
  var mechs = getMechs(currentSxId);
  var sxLabel = sx.name + (sx.name_en ? " (" + sx.name_en + ")" : "");
  // Re-render mode buttons (to update active state)
  var modeWrap = document.querySelector(".sxm-mode");
  if (modeWrap) modeWrap.outerHTML = renderModeSelector();
  // Re-render content
  var content = document.getElementById("sxm-mode-content");
  if (content) content.innerHTML = renderCurrentMode(sx, mechs, sxLabel);
}

function renderCurrentMode(sx, mechs, sxLabel){
  if (currentSymMode === "localize") return renderLocalizeMode(mechs, sxLabel);
  if (currentSymMode === "detective") return renderDetectiveMode(sx, mechs);
  if (currentSymMode === "compare") return renderCompareMode(sx, mechs);
  return renderExploreMode(mechs, sxLabel);
}

function renderExploreMode(mechs, sxLabel){
  // Auto-select first mech + anatomy if not set or invalid
  var mech = mechs.find(function(m){ return m.id === exploreState.mechId; });
  if (!mech){
    mech = mechs[0];
    exploreState.mechId = mech ? mech.id : null;
  }
  if (!mech) return '<div class="exp-empty">此症狀尚無機轉</div>';

  var anats = getAnatomies(mech.id);
  var anat = anats.find(function(a){ return a.id === exploreState.anatId; });
  if (!anat && anats.length){
    anat = anats[0];
    exploreState.anatId = anat.id;
  } else if (!anats.length){
    exploreState.anatId = null;
  }

  var mechIdx = mechs.indexOf(mech);
  var color = mechColor(mech, mechIdx);

  var h = '<div class="exp-wrap">';

  // === Left column: mechanism list ===
  h += '<div class="exp-left">';
  h += '<div class="exp-section-label">Mechanisms · 機轉</div>';
  mechs.forEach(function(m, idx){
    var mAnats = getAnatomies(m.id);
    var active = m.id === exploreState.mechId ? " active" : "";
    var mColor = mechColor(m, idx);
    h += '<div class="exp-mech-item' + active + '" style="--mech-color:' + mColor + '" onclick="expSelectMech(\'' + m.id + '\')">';
    h += '<div class="exp-mech-name">' + escHtml(m.name) + '</div>';
    var metaParts = [];
    if (m.name_zh) metaParts.push(escHtml(m.name_zh));
    metaParts.push(mAnats.length + ' 部位');
    h += '<div class="exp-mech-meta">' + metaParts.join(' · ') + '</div>';

  if (hasAnyRegion(mechs)){
    h += '<button class="exp-anat-map-btn" id="expAnatMapBtn" onclick="toggleExpAnatMap()"><i class="ti ti-map"></i> 解剖地圖 <i class="ti ti-chevron-right" style="margin-left:auto"></i></button>';
    h += '<div class="exp-anat-map-inline" id="expAnatMapInline" style="display:none">' + renderExpAnatMap(mechs) + '</div>';
  }
  h += '</div>';

  // === Center column: mechanism detail ===
  h += '<div class="exp-center">';
  h += '<div class="exp-mech-header">';
  h += '<span class="exp-mech-title">' + escHtml(mech.name) + '</span>';
  if (mech.name_zh) h += '<span class="exp-mech-title-zh">' + escHtml(mech.name_zh) + '</span>';
  h += '</div>';
  h += '<div class="exp-mech-underline" style="background:' + color + '"></div>';

  if (mech.pathophysiology){
    h += '<div class="exp-patho-label">病理生理 · Pathophysiology</div>';
    h += '<div class="exp-patho">' + renderPathophysiology(mech.pathophysiology) + '</div>';
  }

  h += '<div class="exp-anat-label-row"><span>影響部位 · Anatomies</span><span style="text-transform:none;letter-spacing:0;font-size:11px">' + anats.length + '</span></div>';
  if (!anats.length){
    h += '<div class="exp-empty">此機轉尚無 anatomy</div>';
  } else {
    h += '<div class="exp-anat-list">';
    anats.forEach(function(a){
      var active = a.id === exploreState.anatId ? " active" : "";
      // Sum clues across all diseases under this anatomy (+ legacy anatomy clues)
      var clueCount = getClues(a).length;
      (anatomyDxMap[a.id] || []).forEach(function(ad){
        clueCount += getDiseaseClues(ad).length;
      });
      var dxCount = (anatomyDxMap[a.id] || []).length;
      h += '<div class="exp-anat-card' + active + '" onclick="expSelectAnat(\'' + a.id + '\')">';
      h += '<div class="exp-anat-card-main">';
      h += '<div class="exp-anat-card-head">';
      h += '<span class="exp-anat-name">' + escHtml(a.name) + '</span>';
      if (a.name_zh) h += '<span class="exp-anat-zh">' + escHtml(a.name_zh) + '</span>';
      if (a.body_region) h += '<span class="exp-anat-region">' + escHtml(a.body_region) + '</span>';
      h += '</div>';
      h += '<div class="exp-anat-stats">' + dxCount + ' 個鑑別 · ' + clueCount + ' 條 clues</div>';
      h += '</div>';
      h += '<i class="ti ti-chevron-right exp-anat-chev"></i>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // === Right column: full anatomy detail ===
  h += '<div class="exp-right">';

    h += renderAnatomySection(anat, color, sxLabel, mech.name);
  } else {
    h += '<div class="exp-empty">請從中欄選擇 anatomy</div>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

function expSelectAnat(anatId){

function refreshExplore(){

function renderExpAnatMap(mechs){
  // Compact version inside explore left col
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechIdx: mi });
    });
  });
  var regions = Object.keys(groups).sort(function(a, b){

}

/* ===== COMPARE MODE — multi-select DDx → distinguishing matrix ===== */
function renderCompareMode(sx, mechs){
  var diseaseMap = getSymptomDiseaseMap(mechs);
  var allDiseases = Object.keys(diseaseMap).map(function(k){ return diseaseMap[k]; });

  if (!allDiseases.length){
    return '<div class="cmp-wrap"><div class="det-no-results">此症狀尚未連結任何疾病</div></div>';
  }

  // Group by mechanism (in mech sort order); within each group: classic first, then by name
  var mechGroups = {};
  allDiseases.forEach(function(item){
    var mid = item.mechanism.id;
    if (!mechGroups[mid]){
      mechGroups[mid] = { mechanism: item.mechanism, mechIdx: item.mechIdx, items: [] };
    }
    mechGroups[mid].items.push(item);
  });
  Object.keys(mechGroups).forEach(function(mid){
    mechGroups[mid].items.sort(function(a, b){
      var ac = a.is_classic ? 1 : 0, bc = b.is_classic ? 1 : 0;
      if (bc !== ac) return bc - ac;
      return (a.disease.name || "").localeCompare(b.disease.name || "", "zh-Hant");
    });
  });

  var h = '<div class="cmp-wrap">';

  // Picker
  h += '<div class="cmp-picker">';
  h += '<div class="cmp-picker-label">';
  h += '<span>選擇要比較的疾病</span>';
  h += '<span class="cmp-picker-count">' + compareState.selected.length + ' / 4 已選</span>';
  if (compareState.selected.length){
    h += '<button class="cmp-clear-btn" onclick="cmpClear()">清空</button>';
  }
  h += '</div>';

  mechs.forEach(function(m, i){
    var grp = mechGroups[m.id];
    if (!grp || !grp.items.length) return;
    var mColor = mechColor(m, i);
    h += '<div class="cmp-mech-section">';
    h += '<div class="cmp-mech-header" style="--mech-color:' + mColor + '">';
    h += '<span class="cmp-mech-title">' + escHtml(m.name) + '</span>';
    if (m.name_zh) h += '<span class="cmp-mech-title-zh">' + escHtml(m.name_zh) + '</span>';
    h += '<span class="cmp-mech-count">' + grp.items.length + '</span>';
    h += '</div>';
    h += '<div class="cmp-dx-grid">';
    grp.items.forEach(function(item){
      var d = item.disease;
      var checked = compareState.selected.indexOf(d.id) !== -1;
      var disabled = !checked && compareState.selected.length >= 4;
      var cls = "cmp-dx-row" + (checked ? " checked" : "") + (disabled ? " disabled" : "");
      h += '<label class="' + cls + '">';
      h += '<input type="checkbox" class="cmp-dx-check"' + (checked ? " checked" : "") + (disabled ? " disabled" : "") + ' onchange="cmpToggle(\'' + d.id + '\')">';
      h += '<span class="cmp-dx-name">' + escHtml(d.name) + '</span>';
      if (item.is_classic) h += '<i class="ti ti-star-filled cmp-dx-classic" title="經典"></i>';
      h += '</label>';
    });
    h += '</div>';
    h += '</div>';
  });

  h += '</div>'; // cmp-picker

  // Matrix
  if (compareState.selected.length < 2){
    h += '<div class="cmp-prompt"><i class="ti ti-arrow-up" style="vertical-align:-2px"></i> 至少選 2 個疾病以產生比較矩陣（可選 2-4 個）</div>';
  } else {
    h += renderCompareMatrix(diseaseMap);
  }

  h += '</div>';
  return h;
}

function renderCompareMatrix(diseaseMap){
  var items = compareState.selected
    .map(function(id){ return diseaseMap[id]; })
    .filter(Boolean);

  // Union of all clues across selected diseases
  var seen = {};
  var allClues = [];
  items.forEach(function(item){
    item.clues.forEach(function(c){
      var k = c.toLowerCase().trim();
      if (!seen[k]){
        seen[k] = c;
        allClues.push(c);
      }
    });
  });

  // Sort: distinguishing (only 1 disease has it) first, then by match count, then alpha
  allClues.sort(function(a, b){
    var aCount = items.filter(function(it){ return cmpClueIn(a, it.clues); }).length;
    var bCount = items.filter(function(it){ return cmpClueIn(b, it.clues); }).length;
    if (aCount !== bCount) return aCount - bCount;
    return a.localeCompare(b, "zh-Hant");
  });

  if (!allClues.length){
    return '<div class="cmp-prompt">選中疾病沒有 clinical clues 可比較</div>';
  }

  var h = '<div class="cmp-matrix-wrap"><table class="cmp-matrix">';

  // Header row
  h += '<thead><tr><th></th>';
  items.forEach(function(item){
    var color = mechColor(item.mechanism, item.mechIdx);
    h += '<th style="border-top:3px solid ' + color + '">';
    h += '<div class="cmp-dx-name">' + escHtml(item.disease.name) + '</div>';
    if (item.disease.name_en) h += '<div class="cmp-dx-en">' + escHtml(item.disease.name_en) + '</div>';
    h += '<div class="cmp-dx-meta">';
    h += '<span style="color:' + color + ';font-weight:600">' + escHtml(item.mechanism.name) + '</span>';
    h += '<span>📍 ' + escHtml(item.anatomy.name) + (item.anatomy.body_region ? ' [' + escHtml(item.anatomy.body_region) + ']' : '') + '</span>';
    if (item.is_classic) h += '<span style="font-size:11px;color:#854F0B">⭐ 經典</span>';
    h += '</div>';
    h += '</th>';
  });
  h += '</tr></thead>';

  // Body
  h += '<tbody>';
  allClues.forEach(function(clue){
    var countWith = items.filter(function(it){ return cmpClueIn(clue, it.clues); }).length;
    var isDistinguishing = countWith === 1;
    var rowCls = isDistinguishing ? "cmp-row-distinguishing" : "";
    h += '<tr class="' + rowCls + '">';
    h += '<td class="cmp-clue-cell">' + escHtml(clue);
    if (isDistinguishing) h += '<span class="cmp-key-badge">key</span>';
    h += '</td>';
    items.forEach(function(item){
      if (cmpClueIn(clue, item.clues)){
        h += '<td class="cmp-cell-yes">✓</td>';
      } else {
        h += '<td class="cmp-cell-no">—</td>';
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // Legend
  h += '<div class="cmp-hint">';
  h += '<span class="cmp-hint-item"><span style="color:#3B6D11;font-weight:700">✓</span> 此疾病有此 clue</span>';
  h += '<span class="cmp-hint-item"><span style="color:var(--text3)">—</span> 此疾病無此 clue</span>';
  h += '<span class="cmp-hint-item"><span class="cmp-hint-key">key</span> 只有一個疾病有 = 區分要點</span>';
  h += '</div>';

  return h;
}

function cmpClueIn(needle, haystack){
  var n = needle.toLowerCase().trim();
  return haystack.some(function(c){ return c.toLowerCase().trim() === n; });
}

function cmpToggle(diseaseId){
  var idx = compareState.selected.indexOf(diseaseId);
  if (idx === -1){
    if (compareState.selected.length < 4){
      compareState.selected.push(diseaseId);
    }
  } else {
    compareState.selected.splice(idx, 1);
  }
  refreshCompare();
}

function cmpClear(){

function hasAnyRegion(mechs){
  for (var i = 0; i < mechs.length; i++){
    var anats = getAnatomies(mechs[i].id);
    for (var j = 0; j < anats.length; j++){
      if (anats[j].body_region && anats[j].body_region.trim()) return true;
    }
  }
  return false;
}

// Region ordering: known regions first (anatomical order), then alphabetical, then "Generalized/Referred/Other" at end
var REGION_ORDER = [
  "RUQ","Epigastric","LUQ",
  "Periumbilical","Flank",
  "RLQ","Suprapubic","LLQ",
  "Substernal","Left chest","Right chest","Pleuritic",
  "Frontal","Temporal","Occipital",
  "Generalized","Referred","Other","未分類"
];

function regionRank(r){
  var i = REGION_ORDER.indexOf(r);
  return i >= 0 ? i : (REGION_ORDER.length - 4); // unknown regions go before Generalized
}

/* ===== LOCALIZE MODE — region-driven view ===== */
var localizeSelectedRegion = null;

function renderLocalizeMode(mechs, sxLabel){
  if (!hasAnyRegion(mechs)){
    return '<div class="loc-wrap"><div class="loc-empty">此症狀的 anatomy 尚未標記 body_region。<br><span style="font-size:12px">在 CMS 編輯 anatomy 並加入「部位」欄位（如 RUQ / RLQ / Epigastric...）後再使用此模式。</span></div></div>';
  }

  // Group anatomies by region
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechIdx: mi, mechColor: mechColor(m, mi) });
    });
  });

  var regions = Object.keys(groups).sort(function(a, b){
    var ra = regionRank(a), rb = regionRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, "zh-Hant");
  });

  // Restore previous selection if still valid, else first region
  if (!localizeSelectedRegion || regions.indexOf(localizeSelectedRegion) === -1){

  }

  var h = '<div class="loc-wrap">';

    h += '</span>';
  });

  // Selected region content
  var items = groups[localizeSelectedRegion] || [];
  h += '<div class="loc-content">';
  items.forEach(function(item){
    h += renderAnatomySection(item.anatomy, item.mechColor, sxLabel, item.mechanism.name);
  });
  h += '</div>';

  h += '</div>';
  return h;
}

function setLocRegion(r){
  localizeSelectedRegion = r;
  var sx = symptoms.find(function(s){ return s.id === currentSxId; });
  if (!sx) return;

/* ===== DETECTIVE MODE — interactive clue → DDx filter ===== */
function getSymptomDiseaseMap(mechs){
  // disease.id → { disease, mechanism, anatomy, clues, is_classic, key_features }
  var map = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var ddxList = anatomyDxMap[a.id] || [];
      ddxList.forEach(function(ad){
        if (!ad.disease_id) return;
        var disease = diseases.find(function(d){ return d.id === ad.disease_id; });
        if (!disease) return;
        // Prefer disease-level clues. Fall back to anatomy-level if empty (legacy).
        var clues = getDiseaseClues(ad).map(function(c){ return c.label; }).filter(Boolean);
        if (!clues.length){
          clues = getClues(a).map(function(c){ return c.label; }).filter(Boolean);
        }
        if (!map[disease.id]){
          map[disease.id] = {
            disease: disease,
            mechanism: m,
            mechIdx: mi,
            anatomy: a,
            clues: clues.slice(),
            is_classic: !!ad.is_classic,
            key_features: ad.key_features || ""
          };
        } else {
          // Same disease across multiple anatomies — union clues
          clues.forEach(function(c){
            if (map[disease.id].clues.indexOf(c) === -1) map[disease.id].clues.push(c);
          });
        }
      });
    });
  });
  return map;
}

function getAllSymptomClues(mechs){
  var seen = {};
  var clues = [];
  function add(label){
    if (!label) return;
    var key = label.toLowerCase().trim();
    if (!seen[key]){
      seen[key] = true;
      clues.push(label);
    }
  }
  mechs.forEach(function(m){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      // Disease-level clues (preferred)
      var ddxList = anatomyDxMap[a.id] || [];
      ddxList.forEach(function(ad){
        getDiseaseClues(ad).forEach(function(c){ add(c.label); });
      });
      // Anatomy-level clues (legacy fallback)
      getClues(a).forEach(function(c){ add(c.label); });
    });
  });
  return clues.sort(function(a, b){ return a.localeCompare(b, "zh-Hant"); });
}

function renderDetectiveMode(sx, mechs){
  var allClues = getAllSymptomClues(mechs);
  var diseaseMap = getSymptomDiseaseMap(mechs);

  if (!allClues.length){
    return '<div class="det-wrap"><div class="det-no-results">此症狀尚未建立 clinical clues。請在 CMS 為每個疾病新增 clues 後再使用此模式。</div></div>';
  }

  var h = '<div class="det-wrap">';

  // Patient clue chip box
  h += '<div class="det-clues-box">';
  h += '<div class="det-clues-label">🩺 病人有以下表現（勾選 clue 即時推斷 DDx）</div>';
  h += '<div class="det-clues-chips" id="det-chips">';
  if (!detectiveState.selected.length){
    h += '<span class="det-empty-chip-hint">尚未加入任何 clue — 從下方 catalog 點選</span>';
  } else {
    detectiveState.selected.forEach(function(c){
      h += '<span class="det-chip">' + escHtml(c) + '<button class="det-chip-rm" onclick="detRemove(\'' + escAttr(c) + '\')" title="移除">✕</button></span>';
    });
  }
  h += '</div>';
  h += '<div class="det-actions">';
  h += '<button class="det-action-btn primary" onclick="document.getElementById(\'det-search\').focus()">＋ 從 catalog 加 clue</button>';
  if (detectiveState.selected.length){
    h += '<button class="det-action-btn" onclick="detClearAll()">清空</button>';
  }
  h += '</div>';

  // Catalog
  h += '<div class="det-catalog">';
  h += '<div class="det-catalog-title">📋 此症狀可用的 clue（' + allClues.length + '）</div>';
  h += '<input type="text" id="det-search" class="det-catalog-search" placeholder="搜尋 clue（中文或英文）..." oninput="detFilterCatalog(this.value)">';
  h += '<div class="det-catalog-list" id="det-catalog-list">';

  h += '</div>';
  h += '</div>';
  h += '</div>';

  // Results
  h += '<div class="det-results-label" id="det-results-label">';
  if (detectiveState.selected.length){
    h += '🎯 可能的疾病（依與 ' + detectiveState.selected.length + ' 個 clue 的匹配度排序）';
  } else {
    h += '🎯 全部疾病（' + Object.keys(diseaseMap).length + ' 個）';
  }
  h += '</div>';
  h += '<div class="det-dx-list" id="det-dx-list">';
  h += renderDxList(diseaseMap);
  h += '</div>';

  h += '</div>';
  return h;
}

function renderCatalogItems(allClues, filter, diseaseMap){
  var f = (filter || "").toLowerCase().trim();
  // Build clue → dx count map
  var clueCount = {};
  Object.keys(diseaseMap).forEach(function(did){
    var item = diseaseMap[did];
    (item.clues || []).forEach(function(c){
      var k = c.toLowerCase().trim();
      clueCount[k] = (clueCount[k] || 0) + 1;
    });
  });

  // Filter available
  var avail = allClues.filter(function(c){
    if (detectiveState.selected.indexOf(c) !== -1) return false;
    if (f && c.toLowerCase().indexOf(f) === -1) return false;
    return true;
  });
  if (!avail.length){
    return '<div class="det-catalog-empty">' + (f ? '無符合「' + escHtml(filter) + '」的線索' : '已加入所有線索') + '</div>';
  }

  // Bucket into 3 tiers by diagnostic value
  var tier1 = [], tier2 = [], tier3 = []; // 1 / 2-4 / 5+
  avail.forEach(function(c){
    var n = clueCount[c.toLowerCase().trim()] || 0;
    if (n <= 1) tier1.push({label:c, count:n});
    else if (n <= 4) tier2.push({label:c, count:n});
    else tier3.push({label:c, count:n});
  });
  // Sort within each: by count asc, then by name
  function sortFn(a, b){
    if (a.count !== b.count) return a.count - b.count;
    return a.label.localeCompare(b.label, "zh-Hant");
  }
  tier1.sort(sortFn); tier2.sort(sortFn); tier3.sort(sortFn);

  function renderRow(item){
    return '<div class="det-clue-row" onclick="detAdd(\'' + escAttr(item.label) + '\')">' +
      '<span class="det-clue-plus">+</span>' +
      '<span class="det-clue-name">' + escHtml(item.label) + '</span>' +
      (item.count <= 1
        ? '<span class="det-clue-badge det-clue-badge-pathognomonic"><i class="ti ti-star-filled"></i></span>'
        : '<span class="det-clue-badge">' + item.count + ' dx</span>') +
      '</div>';
  }

  var h = '';
  if (tier1.length){
    h += '<div class="det-tier det-tier-pathognomonic"><div class="det-tier-label"><span>高鑑別力 · pathognomonic</span><span class="det-tier-count">' + tier1.length + '</span></div>';
    tier1.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  if (tier2.length){
    h += '<div class="det-tier"><div class="det-tier-label"><span>中等鑑別 · 2-4 個疾病</span><span class="det-tier-count">' + tier2.length + '</span></div>';
    tier2.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  if (tier3.length){
    h += '<div class="det-tier"><div class="det-tier-label"><span>普遍症狀 · 5+ 個疾病</span><span class="det-tier-count">' + tier3.length + '</span></div>';
    tier3.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  return h;
}

function renderDxList(diseaseMap){
  var selected = detectiveState.selected;
  var sel = selected.map(function(c){ return c.toLowerCase().trim(); });

  var ranked = Object.keys(diseaseMap).map(function(id){
    var item = diseaseMap[id];
    var lowerClues = item.clues.map(function(c){ return c.toLowerCase().trim(); });
    var matched = item.clues.filter(function(c){
      return sel.indexOf(c.toLowerCase().trim()) !== -1;
    });
    var missing = item.clues.filter(function(c){
      return sel.indexOf(c.toLowerCase().trim()) === -1;
    });
    var score = sel.length > 0 ? matched.length / sel.length : 0;
    return Object.assign({}, item, {
      matched: matched, missing: missing,
      matchCount: matched.length, score: score
    });
  });

  // Sort: more matches first, then higher score, then classic first
  ranked.sort(function(a, b){
    if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
    if (b.score !== a.score) return b.score - a.score;
    return (b.is_classic ? 1 : 0) - (a.is_classic ? 1 : 0);
  });

  if (!ranked.length){
    return '<div class="det-no-results">此症狀尚未連結任何疾病</div>';
  }

  return ranked.map(function(item, idx){
    var isTop = (idx === 0) && (item.matchCount > 0);
    var cls = "det-dx-card" + (isTop ? " top" : "");
    var d = item.disease;
    var color = mechColor(item.mechanism, item.mechIdx);

    var matchClass = "det-dx-match-none";
    var matchText = sel.length ? "0 / " + sel.length : "無 clue";
    if (item.matchCount > 0){
      matchText = item.matchCount + " / " + sel.length + " 符合";
      matchClass = item.matchCount === sel.length ? "det-dx-match-good" : "det-dx-match-partial";
    } else if (sel.length === 0){
      matchClass = "det-dx-match-none";
      matchText = item.clues.length + " 個 clue";
    }

    var h = '<div class="' + cls + '" onclick="selectDisease(\'' + d.id + '\')">';
    h += '<div class="det-dx-head">';
    h += '<div><span class="det-dx-name">' + escHtml(d.name) + '</span>';
    if (d.name_en) h += '<span class="det-dx-zh">' + escHtml(d.name_en) + '</span>';
    if (isTop) h += '<span class="det-dx-top-badge">最符合</span>';
    if (item.is_classic) h += '<span class="det-dx-classic">⭐ 經典</span>';
    h += '</div>';
    h += '<span class="det-dx-match ' + matchClass + '">' + matchText + '</span>';
    h += '</div>';
    h += '<div class="det-dx-meta">';
    h += '<span style="color:' + color + ';font-weight:600">' + escHtml(item.mechanism.name) + '</span>';
    h += '<span>📍 ' + escHtml(item.anatomy.name) + (item.anatomy.body_region ? ' [' + escHtml(item.anatomy.body_region) + ']' : '') + '</span>';
    h += '</div>';

    if (sel.length > 0 && item.matched.length > 0){
      h += '<div class="det-dx-clues"><div class="det-dx-clue-row"><span class="det-dx-clue-label">符合</span><div>';
      item.matched.forEach(function(c){
        h += '<span class="det-dx-matched-clue">✓ ' + escHtml(c) + '</span>';
      });
      h += '</div></div></div>';
    }
    if (sel.length > 0 && item.missing.length > 0){
      h += '<div class="det-dx-clues"><div class="det-dx-clue-row"><span class="det-dx-clue-label">可再查</span><div>';
      item.missing.slice(0, 6).forEach(function(c){
        h += '<span class="det-dx-missing-clue">· ' + escHtml(c) + '</span>';
      });
      if (item.missing.length > 6){
        h += '<span class="det-dx-missing-clue" style="font-style:italic">+' + (item.missing.length - 6) + ' 更多</span>';
      }
      h += '</div></div></div>';
    }
    if (item.key_features){
      h += '<div style="margin-top:6px;font-size:12px;color:var(--text2);font-style:italic">💡 ' + escHtml(item.key_features) + '</div>';
    }
    h += '</div>';
    return h;
  }).join("");
}

function detAdd(clue){
  if (detectiveState.selected.indexOf(clue) === -1){
    detectiveState.selected.push(clue);
    refreshDetective();
    // Clear search
    var s = document.getElementById("det-search");
    if (s) s.value = "";
  }
}

function detRemove(clue){
  detectiveState.selected = detectiveState.selected.filter(function(c){ return c !== clue; });
  refreshDetective();
}

function detClearAll(){
  detectiveState.selected = [];
  refreshDetective();
}

function refreshDetective(){

  var mechs = getMechs(currentSxId);

function renderAnatMap(mechs){
  // Group anatomies by body_region
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechColor: mechColor(m, mi) });
    });
  });

  var regions = Object.keys(groups).sort(function(a, b){
    var ra = regionRank(a), rb = regionRank(b);

    return a.localeCompare(b, "zh-Hant");
  });

  var h = '<div class="anat-map" id="anatMapPanel">';

}

/* ===== Clinical clue helpers (with backward compat) ===== */
// Anatomy-level clues (legacy / general fallback)
function getClues(a){
  var c = a.clinical_clues;
  if (typeof c === "string") try{ c = JSON.parse(c); }catch(e){ c = null; }
  if (!Array.isArray(c)) return [];
  return c.map(function(x){
    if (typeof x === "string") return { label: x, why: "" };
    if (x && typeof x === "object") return { label: x.label || "", why: x.why || "" };
    return { label: "", why: "" };
  }).filter(function(x){ return x.label; });
}
// Disease-level clues (preferred — from anatomy_diseases.clinical_clues)
function getDiseaseClues(ad){
  var c = ad && ad.clinical_clues;
  if (typeof c === "string") try{ c = JSON.parse(c); }catch(e){ c = null; }
  if (!Array.isArray(c)) return [];
  return c.map(function(x){
    if (typeof x === "string") return { label: x, why: "" };
    if (x && typeof x === "object") return { label: x.label || "", why: x.why || "" };
    return { label: "", why: "" };
  }).filter(function(x){ return x.label; });
}

function renderClueItem(c, idx, scope, excludeKey){
  var id = "clue-" + scope + "-" + idx;
  var hasWhy = !!(c.why && c.why.trim());
  var xrefs = findCrossRefs(c.label, excludeKey);
  var hasXref = xrefs.length > 0;
  var hasContent = hasWhy || hasXref;
  var cls = "clue-item" + (hasContent ? " has-why" : " no-why");
  var h = '<div class="' + cls + '" id="' + id + '" data-clue-label="' + escAttr(c.label) + '">';
  h += '<div class="clue-head"' + (hasContent ? ' onclick="toggleClue(\'' + id + '\')"' : '') + '>';
  h += '<span class="clue-chevron">▸</span>';
  h += '<span class="clue-label">' + escHtml(c.label) + '</span>';
  if (hasWhy) h += '<span class="clue-info"><i class="ti ti-info-circle"></i>pathway</span>';
  if (hasXref) h += '<span class="clue-badge-xref"><i class="ti ti-link"></i>' + xrefs.length + '</span>';
  h += '</div>';
  if (hasContent){
    h += '<div class="clue-body">';
    if (hasWhy) h += renderPathway(c.why);
    if (hasXref) h += renderXrefSection(c.label, xrefs);
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function escAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

function buildClueIndex(){
  clueIndex = {};
  symptoms.forEach(function(sx){
    var mechs = getMechs(sx.id);
    mechs.forEach(function(m, mi){
      var anats = getAnatomies(m.id);
      anats.forEach(function(a){
        // Index disease-level clues (preferred)
        var ddxList = anatomyDxMap[a.id] || [];
        ddxList.forEach(function(ad){
          if (!ad.disease_id) return;
          var disease = diseases.find(function(d){ return d.id === ad.disease_id; });
          if (!disease) return;
          getDiseaseClues(ad).forEach(function(c){
            var key = c.label.toLowerCase().trim();
            if (!key) return;
            if (!clueIndex[key]) clueIndex[key] = [];
            clueIndex[key].push({
              symptom: sx, mechanism: m, mechIdx: mi,
              anatomy: a, disease: disease, ad: ad
            });
          });
        });
        // Anatomy-level clues (legacy fallback)
        getClues(a).forEach(function(c){
          var key = c.label.toLowerCase().trim();
          if (!key) return;
          if (!clueIndex[key]) clueIndex[key] = [];
          clueIndex[key].push({
            symptom: sx, mechanism: m, mechIdx: mi,
            anatomy: a, disease: null, ad: null
          });
        });
      });
    });
  });
}

function findCrossRefs(label, excludeKey){
  // excludeKey:  "dx:<diseaseId>"  excludes that specific disease
  //              "anat:<anatomyId>" excludes anatomy-level clues from that anatomy
  if (!label) return [];
  var key = label.toLowerCase().trim();
  var refs = clueIndex[key] || [];
  // Dedupe: same disease appearing twice should only appear once in xref
  var seen = {};
  return refs.filter(function(r){
    if (excludeKey && excludeKey.indexOf("dx:") === 0){
      var did = excludeKey.slice(3);
      if (r.disease && r.disease.id === did) return false;
    }
    if (excludeKey && excludeKey.indexOf("anat:") === 0){
      var aid = excludeKey.slice(5);
      if (!r.disease && r.anatomy.id === aid) return false;
    }
    // Dedupe by (symptom, disease) for disease entries, (symptom, anatomy) for anatomy fallback
    var dedupeKey = r.symptom.id + "|" + (r.disease ? "d:" + r.disease.id : "a:" + r.anatomy.id);
    if (seen[dedupeKey]) return false;
    seen[dedupeKey] = true;
    return true;
  });
}

function navXref(el){
  var sxId = el.getAttribute("data-sx");
  var anatId = el.getAttribute("data-anat");
  var clueLabel = el.getAttribute("data-clue") || "";
  navToAnat(sxId, anatId, clueLabel);
}

function navToAnat(symptomId, anatomyId, clueLabel){
  function focusAnatomy(){
    var anat = anatomyById[anatomyId];
    if (currentSymMode === "explore" && anat){
      exploreState.mechId = anat.mechanism_id;
      exploreState.anatId = anatomyId;
      refreshExplore();
      setTimeout(function(){ autoExpandClue(anatomyId, clueLabel); }, 30);
    } else if (currentSymMode === "localize" && anat && anat.body_region){
      localizeSelectedRegion = anat.body_region;
      setLocRegion(anat.body_region);
      setTimeout(function(){
        scrollToAnatomy(anatomyId);
        autoExpandClue(anatomyId, clueLabel);
      }, 30);
    } else {
      scrollToAnatomy(anatomyId);
      autoExpandClue(anatomyId, clueLabel);
    }
  }
  if (currentSxId === symptomId){
    focusAnatomy();
  } else {
    showSymptomDetail(symptomId);
    setTimeout(focusAnatomy, 80);
  }
}

function autoExpandClue(anatomyId, label){
  if (!label) return;
  var sec = document.getElementById("anat-" + anatomyId);
  if (!sec) return;
  var items = sec.querySelectorAll(".clue-item");
  var target = (label || "").toLowerCase().trim();
  for (var i = 0; i < items.length; i++){
    var lbl = items[i].getAttribute("data-clue-label") || "";
    if (lbl.toLowerCase().trim() === target){
      if (items[i].classList.contains("has-why") && !items[i].classList.contains("expanded")){
        items[i].classList.add("expanded");
      }
      // brief flash to draw attention
      items[i].style.transition = "box-shadow 0.4s";
      items[i].style.boxShadow = "0 0 0 3px rgba(24,95,165,0.25)";
      setTimeout(function(it){ return function(){ it.style.boxShadow = ""; }; }(items[i]), 1200);
      break;
    }
  }
}

function toggleClue(id){
  var el = document.getElementById(id);
  if (!el || el.classList.contains("no-why")) return;
  el.classList.toggle("expanded");
}

/* Pathway parser:
   - Line ending with ":" (short)  → section heading
   - Line containing only ↓/→/↑    → arrow visual
   - Empty line                    → gap between pathways
   - Other lines                   → step box (with **bold** inline)
*/
function renderPathophysiology(text){
  if (!text) return "";
  var lines = text.replace(/\r\n/g, "\n").split("\n");
  var html = "";
  var bulletGroup = [];
  function flushBullets(){
    if (!bulletGroup.length) return;
    html += '<div class="exp-patho-grid">';
    bulletGroup.forEach(function(b){
      html += '<span class="exp-patho-grid-key">' + escHtml(b.key) + '</span>';
      html += '<span class="exp-patho-grid-val">' + escHtml(b.val) + '</span>';
    });
    html += '</div>';
    bulletGroup = [];
  }
  lines.forEach(function(line){
    var t = line.trim();
    if (!t){ flushBullets(); return; }
    // "• Key：Value" / "- Key: Value" become grid rows
    var bm = t.match(/^[•\*\-]\s*(.+?)\s*[：:]\s*(.+)$/);
    if (bm){
      bulletGroup.push({ key: bm[1].trim(), val: bm[2].trim() });
      return;
    }
    // Regular line → its own paragraph
    flushBullets();
    html += '<p>' + escHtml(t) + '</p>';
  });
  flushBullets();
  return html;
}

function renderPathway(text){
  if (!text) return "";
  var lines = text.replace(/\r\n/g, "\n").split("\n");
  var html = '<div class="pathway">';
  var lastWasGap = false;
  var firstStep = true;
  lines.forEach(function(line){
    var trimmed = line.trim();
    if (!trimmed){
      if (!lastWasGap && !firstStep) html += '<div class="pathway-gap"></div>';
      lastWasGap = true;
      return;
    }
    lastWasGap = false;
    // Section header
    if (/.+:\s*$/.test(trimmed) && trimmed.length < 40){
      html += '<div class="pathway-section">' + renderInlineBold(trimmed.replace(/:\s*$/, "")) + '</div>';
      return;
    }
    // Skip arrow-only lines — the timeline thread is the connector
    if (/^[↓→↑⇒\s]+$/.test(trimmed)){
      return;
    }
    // Regular step
    html += '<div class="pathway-step">' + renderInlineBold(trimmed) + '</div>';
    firstStep = false;
  });
  html += '</div>';
  return html;
}

function renderInlineBold(s){
  return escHtml(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

  try{history.pushState(null,null,"#bookmarks")}catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent="⭐ 書籤列表";
  document.getElementById("topBadges").innerHTML="";
  document.getElementById("topStatus").innerHTML="";
  syncTopbarRow2();

  var bmList=diseases.filter(function(d){return bookmarks[d.id]}).sort(function(a,b){return(bookmarks[b.id]||0)-(bookmarks[a.id]||0)});
  var h='<div class="card">';
  h+='<div style="padding:12px 16px;background:#f0f5fb;border-bottom:0.5px solid #B5D4F4;display:flex;justify-content:space-between;align-items:center">';
  h+='<span style="font-size:14px;font-weight:500;color:#185FA5">⭐ 書籤（'+bmList.length+'）</span>';
  if(bmList.length)h+='<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="if(confirm(\'清除所有書籤？\')){bookmarks={};saveBookmarks();showBookmarks()}">清除全部</button>';
  h+='</div>';

  if(!bmList.length){
    h+='<div class="empty" style="padding:30px">尚無書籤，在疾病頁面點擊 ⭐ 加入</div>';
  } else {
    bmList.forEach(function(d){
      var st=dStatus[d.id];
      var stBadge="";
      if(st==="read")stBadge='<span style="font-size:11px;background:#EAF3DE;color:#3B6D11;padding:1px 8px;border-radius:10px">已讀完</span>';
      if(st==="review")stBadge='<span style="font-size:11px;background:#FAEEDA;color:#854F0B;padding:1px 8px;border-radius:10px">需複習</span>';
      var hasNote=notes[d.id]&&notes[d.id].trim();
      h+='<div class="bm-item" onclick="selectDisease(\''+d.id+'\')">';
      h+='<div><div class="bm-name">'+d.name+' <span style="font-weight:400;color:#4a7fa5;font-size:13px">'+(d.name_en||"")+'</span></div>';
      h+='<div class="bm-sub">'+(d.category||"")+(hasNote?' · 📝 有筆記':'')+'</div></div>';
      h+='<div style="display:flex;gap:6px;align-items:center">'+stBadge+'</div>';
      h+='</div>';
    });
  }

  // Review section
  var reviewList=diseases.filter(function(d){return dStatus[d.id]==="review"});
  if(reviewList.length){
    h+='<div style="padding:12px 16px;background:#FAEEDA;border-top:0.5px solid #FAC775">';
    h+='<div style="font-size:13px;font-weight:500;color:#854F0B;margin-bottom:6px">⟳ 需複習（'+reviewList.length+'）</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    reviewList.forEach(function(d){
      h+='<span style="padding:4px 12px;background:#fff;border:0.5px solid #FAC775;border-radius:16px;font-size:13px;color:#854F0B;cursor:pointer" onclick="selectDisease(\''+d.id+'\')">'+d.name+'</span>';
    });
    h+='</div></div>';
  }
  h+='</div>';

  document.getElementById("mainContent").innerHTML=h;
}
