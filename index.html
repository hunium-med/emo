function renderModeSelector(){
  var modes = [
    { id: "explore",   icon: "🧭", label: "探索" },
    { id: "localize",  icon: "📍", label: "定位" },
    { id: "detective", icon: "🔍", label: "偵探" },
    { id: "compare",   icon: "⚖️", label: "比較" }
  ];
  var h = '<div class="sxm-mode">';
  modes.forEach(function(m){
    var active = (m.id === currentSymMode) ? " active" : "";
    h += '<button class="sxm-mode-btn' + active + '" onclick="setSymMode(\'' + m.id + '\')">' + m.icon + ' ' + m.label + '</button>';
  });
  h += '</div>';
  return h;
}

function setSymMode(mode){
  currentSymMode = mode;
  // Re-render only mode area + selector buttons
  var sx = symptoms.find(function(s){ return s.id === currentSxId; });
  if (!sx) return;
  var mechs = getMechs(currentSxId);
  var sxLabel = sx.name + (sx.name_en ? " (" + sx.name_en + ")" : "");
  // Re-render mode buttons (to update active state)
  var modeWrap = document.querySelector(".sxm-mode");
  if (modeWrap) modeWrap.outerHTML = renderModeSelector();
  // Re-render content
  var content = document.getElementById("sxm-mode-content");
  if (content) content.innerHTML = renderCurrentMode(sx, mechs, sxLabel);
}

function renderCurrentMode(sx, mechs, sxLabel){
  if (currentSymMode === "localize") return renderLocalizeMode(mechs, sxLabel);
  if (currentSymMode === "detective") return renderDetectiveMode(sx, mechs);
  if (currentSymMode === "compare") return renderCompareMode(sx, mechs);
  return renderExploreMode(mechs, sxLabel);
}

function renderExploreMode(mechs, sxLabel){
  // Auto-select first mech + anatomy if not set or invalid
  var mech = mechs.find(function(m){ return m.id === exploreState.mechId; });
  if (!mech){
    mech = mechs[0];
    exploreState.mechId = mech ? mech.id : null;
  }
  if (!mech) return '<div class="exp-empty">此症狀尚無機轉</div>';

  var anats = getAnatomies(mech.id);
  var anat = anats.find(function(a){ return a.id === exploreState.anatId; });
  if (!anat && anats.length){
    anat = anats[0];
    exploreState.anatId = anat.id;
  } else if (!anats.length){
    exploreState.anatId = null;
  }

  var mechIdx = mechs.indexOf(mech);
  var color = mechColor(mech, mechIdx);

  var h = '<div class="exp-wrap">';

  // === Left column: mechanism list ===
  h += '<div class="exp-left">';
  h += '<div class="exp-section-label">Mechanisms · 機轉</div>';
  mechs.forEach(function(m, idx){
    var mAnats = getAnatomies(m.id);
    var active = m.id === exploreState.mechId ? " active" : "";
    var mColor = mechColor(m, idx);
    h += '<div class="exp-mech-item' + active + '" style="--mech-color:' + mColor + '" onclick="expSelectMech(\'' + m.id + '\')">';
    h += '<div class="exp-mech-name">' + escHtml(m.name) + '</div>';
    var metaParts = [];
    if (m.name_zh) metaParts.push(escHtml(m.name_zh));
    metaParts.push(mAnats.length + ' 部位');
    h += '<div class="exp-mech-meta">' + metaParts.join(' · ') + '</div>';
    h += '</div>';
  });
  if (hasAnyRegion(mechs)){
    h += '<button class="exp-anat-map-btn" id="expAnatMapBtn" onclick="toggleExpAnatMap()"><i class="ti ti-map"></i> 解剖地圖 <i class="ti ti-chevron-right" style="margin-left:auto"></i></button>';
    h += '<div class="exp-anat-map-inline" id="expAnatMapInline" style="display:none">' + renderExpAnatMap(mechs) + '</div>';
  }
  h += '</div>';

  // === Center column: mechanism detail ===
  h += '<div class="exp-center">';
  h += '<div class="exp-mech-header">';
  h += '<span class="exp-mech-title">' + escHtml(mech.name) + '</span>';
  if (mech.name_zh) h += '<span class="exp-mech-title-zh">' + escHtml(mech.name_zh) + '</span>';
  h += '</div>';
  h += '<div class="exp-mech-underline" style="background:' + color + '"></div>';

  if (mech.pathophysiology){
    h += '<div class="exp-patho-label">病理生理 · Pathophysiology</div>';
    h += '<div class="exp-patho">' + renderPathophysiology(mech.pathophysiology) + '</div>';
  }

  h += '<div class="exp-anat-label-row"><span>影響部位 · Anatomies</span><span style="text-transform:none;letter-spacing:0;font-size:11px">' + anats.length + '</span></div>';
  if (!anats.length){
    h += '<div class="exp-empty">此機轉尚無 anatomy</div>';
  } else {
    h += '<div class="exp-anat-list">';
    anats.forEach(function(a){
      var active = a.id === exploreState.anatId ? " active" : "";
      // Sum clues across all diseases under this anatomy (+ legacy anatomy clues)
      var clueCount = getClues(a).length;
      (anatomyDxMap[a.id] || []).forEach(function(ad){
        clueCount += getDiseaseClues(ad).length;
      });
      var dxCount = (anatomyDxMap[a.id] || []).length;
      h += '<div class="exp-anat-card' + active + '" onclick="expSelectAnat(\'' + a.id + '\')">';
      h += '<div class="exp-anat-card-main">';
      h += '<div class="exp-anat-card-head">';
      h += '<span class="exp-anat-name">' + escHtml(a.name) + '</span>';
      if (a.name_zh) h += '<span class="exp-anat-zh">' + escHtml(a.name_zh) + '</span>';
      if (a.body_region) h += '<span class="exp-anat-region">' + escHtml(a.body_region) + '</span>';
      h += '</div>';
      h += '<div class="exp-anat-stats">' + dxCount + ' 個鑑別 · ' + clueCount + ' 條 clues</div>';
      h += '</div>';
      h += '<i class="ti ti-chevron-right exp-anat-chev"></i>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  // === Right column: full anatomy detail ===
  h += '<div class="exp-right">';
  if (anat){
    h += renderAnatomySection(anat, color, sxLabel, mech.name);
  } else {
    h += '<div class="exp-empty">請從中欄選擇 anatomy</div>';
  }
  h += '</div>';

  h += '</div>';
  return h;

function expSelectMech(mechId){
  if (exploreState.mechId === mechId) return;
  exploreState.mechId = mechId;
  var anats = getAnatomies(mechId);
  exploreState.anatId = anats.length ? anats[0].id : null;
  refreshExplore();
}

function expSelectAnat(anatId){
  if (exploreState.anatId === anatId) return;
  exploreState.anatId = anatId;
  refreshExplore();
}

function refreshExplore(){
  var sx = symptoms.find(function(s){ return s.id === currentSxId; });
  if (!sx) return;
  var mechs = getMechs(currentSxId);
  var sxLabel = sx.name + (sx.name_en ? " (" + sx.name_en + ")" : "");
  var content = document.getElementById("sxm-mode-content");
  if (content) content.innerHTML = renderExploreMode(mechs, sxLabel);
}

function renderExpAnatMap(mechs){
  // Compact version inside explore left col
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechIdx: mi });
    });
  });
  var regions = Object.keys(groups).sort(function(a, b){
    var ra = regionRank(a), rb = regionRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, "zh-Hant");
  });
  var h = "";
  regions.forEach(function(r){
    h += '<div class="exp-anat-map-region">';
    h += '<div class="exp-anat-map-region-name">' + escHtml(r) + '</div>';
    groups[r].forEach(function(item){
      h += '<div class="exp-anat-map-item" onclick="expJumpToAnat(\'' + item.mechanism.id + '\',\'' + item.anatomy.id + '\')">';
      h += '<span>' + escHtml(item.anatomy.name) + '</span>';
      h += '<span style="font-size:10px;color:' + mechColor(item.mechanism, item.mechIdx) + '">●</span>';
      h += '</div>';
    });
    h += '</div>';
  });
  return h;
}

function toggleExpAnatMap(){
  var panel = document.getElementById("expAnatMapInline");
  var btn = document.getElementById("expAnatMapBtn");
  if (!panel) return;
  var isHidden = panel.style.display === "none";
  panel.style.display = isHidden ? "block" : "none";
  if (btn) btn.classList.toggle("open", isHidden);
}

function expJumpToAnat(mechId, anatId){
  exploreState.mechId = mechId;
  exploreState.anatId = anatId;
  refreshExplore();
}

/* ===== COMPARE MODE — multi-select DDx → distinguishing matrix ===== */
function renderCompareMode(sx, mechs){
  var diseaseMap = getSymptomDiseaseMap(mechs);
  var allDiseases = Object.keys(diseaseMap).map(function(k){ return diseaseMap[k]; });

  if (!allDiseases.length){
    return '<div class="cmp-wrap"><div class="det-no-results">此症狀尚未連結任何疾病</div></div>';
  }

  // Group by mechanism (in mech sort order); within each group: classic first, then by name
  var mechGroups = {};
  allDiseases.forEach(function(item){
    var mid = item.mechanism.id;
    if (!mechGroups[mid]){
      mechGroups[mid] = { mechanism: item.mechanism, mechIdx: item.mechIdx, items: [] };
    }
    mechGroups[mid].items.push(item);
  });
  Object.keys(mechGroups).forEach(function(mid){
    mechGroups[mid].items.sort(function(a, b){
      var ac = a.is_classic ? 1 : 0, bc = b.is_classic ? 1 : 0;
      if (bc !== ac) return bc - ac;
      return (a.disease.name || "").localeCompare(b.disease.name || "", "zh-Hant");
    });
  });

  var h = '<div class="cmp-wrap">';

  // Picker
  h += '<div class="cmp-picker">';
  h += '<div class="cmp-picker-label">';
  h += '<span>選擇要比較的疾病</span>';
  h += '<span class="cmp-picker-count">' + compareState.selected.length + ' / 4 已選</span>';
  if (compareState.selected.length){
    h += '<button class="cmp-clear-btn" onclick="cmpClear()">清空</button>';
  }
  h += '</div>';

  mechs.forEach(function(m, i){
    var grp = mechGroups[m.id];
    if (!grp || !grp.items.length) return;
    var mColor = mechColor(m, i);
    h += '<div class="cmp-mech-section">';
    h += '<div class="cmp-mech-header" style="--mech-color:' + mColor + '">';
    h += '<span class="cmp-mech-title">' + escHtml(m.name) + '</span>';
    if (m.name_zh) h += '<span class="cmp-mech-title-zh">' + escHtml(m.name_zh) + '</span>';
    h += '<span class="cmp-mech-count">' + grp.items.length + '</span>';
    h += '</div>';
    h += '<div class="cmp-dx-grid">';
    grp.items.forEach(function(item){
      var d = item.disease;
      var checked = compareState.selected.indexOf(d.id) !== -1;
      var disabled = !checked && compareState.selected.length >= 4;
      var cls = "cmp-dx-row" + (checked ? " checked" : "") + (disabled ? " disabled" : "");
      h += '<label class="' + cls + '">';
      h += '<input type="checkbox" class="cmp-dx-check"' + (checked ? " checked" : "") + (disabled ? " disabled" : "") + ' onchange="cmpToggle(\'' + d.id + '\')">';
      h += '<span class="cmp-dx-name">' + escHtml(d.name) + '</span>';
      if (item.is_classic) h += '<i class="ti ti-star-filled cmp-dx-classic" title="經典"></i>';
      h += '</label>';
    });
    h += '</div>';
    h += '</div>';
  });

  h += '</div>'; // cmp-picker

  // Matrix
  if (compareState.selected.length < 2){
    h += '<div class="cmp-prompt"><i class="ti ti-arrow-up" style="vertical-align:-2px"></i> 至少選 2 個疾病以產生比較矩陣（可選 2-4 個）</div>';
  } else {
    h += renderCompareMatrix(diseaseMap);
  }

  h += '</div>';
  return h;
}

function renderCompareMatrix(diseaseMap){
  var items = compareState.selected
    .map(function(id){ return diseaseMap[id]; })
    .filter(Boolean);

  // Union of all clues across selected diseases
  var seen = {};
  var allClues = [];
  items.forEach(function(item){
    item.clues.forEach(function(c){
      var k = c.toLowerCase().trim();
      if (!seen[k]){
        seen[k] = c;
        allClues.push(c);
      }
    });
  });

  // Sort: distinguishing (only 1 disease has it) first, then by match count, then alpha
  allClues.sort(function(a, b){
    var aCount = items.filter(function(it){ return cmpClueIn(a, it.clues); }).length;
    var bCount = items.filter(function(it){ return cmpClueIn(b, it.clues); }).length;
    if (aCount !== bCount) return aCount - bCount;
    return a.localeCompare(b, "zh-Hant");
  });

  if (!allClues.length){
    return '<div class="cmp-prompt">選中疾病沒有 clinical clues 可比較</div>';
  }

  var h = '<div class="cmp-matrix-wrap"><table class="cmp-matrix">';

  // Header row
  h += '<thead><tr><th></th>';
  items.forEach(function(item){
    var color = mechColor(item.mechanism, item.mechIdx);
    h += '<th style="border-top:3px solid ' + color + '">';
    h += '<div class="cmp-dx-name">' + escHtml(item.disease.name) + '</div>';
    if (item.disease.name_en) h += '<div class="cmp-dx-en">' + escHtml(item.disease.name_en) + '</div>';
    h += '<div class="cmp-dx-meta">';
    h += '<span style="color:' + color + ';font-weight:600">' + escHtml(item.mechanism.name) + '</span>';
    h += '<span>📍 ' + escHtml(item.anatomy.name) + (item.anatomy.body_region ? ' [' + escHtml(item.anatomy.body_region) + ']' : '') + '</span>';
    if (item.is_classic) h += '<span style="font-size:11px;color:var(--amber)">⭐ 經典</span>';
    h += '</div>';
    h += '</th>';
  });
  h += '</tr></thead>';

  // Body
  h += '<tbody>';
  allClues.forEach(function(clue){
    var countWith = items.filter(function(it){ return cmpClueIn(clue, it.clues); }).length;
    var isDistinguishing = countWith === 1;
    var rowCls = isDistinguishing ? "cmp-row-distinguishing" : "";
    h += '<tr class="' + rowCls + '">';
    h += '<td class="cmp-clue-cell">' + escHtml(clue);
    if (isDistinguishing) h += '<span class="cmp-key-badge">key</span>';
    h += '</td>';
    items.forEach(function(item){
      if (cmpClueIn(clue, item.clues)){
        h += '<td class="cmp-cell-yes">✓</td>';
      } else {
        h += '<td class="cmp-cell-no">—</td>';
      }
    });
    h += '</tr>';
  });
  h += '</tbody></table></div>';

  // Legend
  h += '<div class="cmp-hint">';
  h += '<span class="cmp-hint-item"><span style="color:var(--green);font-weight:700">✓</span> 此疾病有此 clue</span>';
  h += '<span class="cmp-hint-item"><span style="color:var(--text3)">—</span> 此疾病無此 clue</span>';
  h += '<span class="cmp-hint-item"><span class="cmp-hint-key">key</span> 只有一個疾病有 = 區分要點</span>';
  h += '</div>';

  return h;
}

function cmpClueIn(needle, haystack){
  var n = needle.toLowerCase().trim();
  return haystack.some(function(c){ return c.toLowerCase().trim() === n; });
}

function hasAnyRegion(mechs){
  for (var i = 0; i < mechs.length; i++){
    var anats = getAnatomies(mechs[i].id);
    for (var j = 0; j < anats.length; j++){
      if (anats[j].body_region && anats[j].body_region.trim()) return true;
    }
  }
  return false;
}

// Region ordering: known regions first (anatomical order), then alphabetical, then "Generalized/Referred/Other" at end
var REGION_ORDER = [
  "RUQ","Epigastric","LUQ",
  "Periumbilical","Flank",
  "RLQ","Suprapubic","LLQ",
  "Substernal","Left chest","Right chest","Pleuritic",
  "Frontal","Temporal","Occipital",
  "Generalized","Referred","Other","未分類"
];

function regionRank(r){
  var i = REGION_ORDER.indexOf(r);
  return i >= 0 ? i : (REGION_ORDER.length - 4); // unknown regions go before Generalized
}

/* ===== LOCALIZE MODE — region-driven view ===== */
var localizeSelectedRegion = null;

function renderLocalizeMode(mechs, sxLabel){
  if (!hasAnyRegion(mechs)){
    return '<div class="loc-wrap"><div class="loc-empty">此症狀的 anatomy 尚未標記 body_region。<br><span style="font-size:12px">在 CMS 編輯 anatomy 並加入「部位」欄位（如 RUQ / RLQ / Epigastric...）後再使用此模式。</span></div></div>';
  }

  // Group anatomies by region
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechIdx: mi, mechColor: mechColor(m, mi) });
    });
  });

  var regions = Object.keys(groups).sort(function(a, b){
    var ra = regionRank(a), rb = regionRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, "zh-Hant");
  });

  // Restore previous selection if still valid, else first region
  if (!localizeSelectedRegion || regions.indexOf(localizeSelectedRegion) === -1){
    localizeSelectedRegion = regions[0];
  }

  var h = '<div class="loc-wrap">';

  // Region selector chips
  h += '<div class="loc-regions">';
  regions.forEach(function(r){
    var active = r === localizeSelectedRegion ? " active" : "";
    var count = groups[r].length;
    h += '<span class="loc-region-chip' + active + '" onclick="setLocRegion(\'' + escAttr(r) + '\')">';
    h += '<span>📍 ' + escHtml(r) + '</span>';
    h += '<span class="loc-region-chip-count">' + count + '</span>';
    h += '</span>';
  });
  h += '</div>';

  // Selected region content
  var items = groups[localizeSelectedRegion] || [];
  h += '<div class="loc-content">';
  items.forEach(function(item){
    h += renderAnatomySection(item.anatomy, item.mechColor, sxLabel, item.mechanism.name);
  });
  h += '</div>';

  h += '</div>';
  return h;
}

function setLocRegion(r){

/* ===== DETECTIVE MODE — interactive clue → DDx filter ===== */
function getSymptomDiseaseMap(mechs){
  // disease.id → { disease, mechanism, anatomy, clues, is_classic, key_features }
  var map = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var ddxList = anatomyDxMap[a.id] || [];
      ddxList.forEach(function(ad){
        if (!ad.disease_id) return;
        var disease = diseases.find(function(d){ return d.id === ad.disease_id; });
        if (!disease) return;
        // Prefer disease-level clues. Fall back to anatomy-level if empty (legacy).
        var clues = getDiseaseClues(ad).map(function(c){ return c.label; }).filter(Boolean);
        if (!clues.length){
          clues = getClues(a).map(function(c){ return c.label; }).filter(Boolean);
        }
        if (!map[disease.id]){
          map[disease.id] = {
            disease: disease,
            mechanism: m,
            mechIdx: mi,
            anatomy: a,
            clues: clues.slice(),
            is_classic: !!ad.is_classic,
            key_features: ad.key_features || ""
          };
        } else {
          // Same disease across multiple anatomies — union clues
          clues.forEach(function(c){
            if (map[disease.id].clues.indexOf(c) === -1) map[disease.id].clues.push(c);
          });
        }
      });
    });
  });
  return map;
}

function getAllSymptomClues(mechs){
  var seen = {};
  var clues = [];
  function add(label){
    if (!label) return;
    var key = label.toLowerCase().trim();
    if (!seen[key]){
      seen[key] = true;
      clues.push(label);
    }
  }
  mechs.forEach(function(m){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      // Disease-level clues (preferred)
      var ddxList = anatomyDxMap[a.id] || [];
      ddxList.forEach(function(ad){
        getDiseaseClues(ad).forEach(function(c){ add(c.label); });
      });
      // Anatomy-level clues (legacy fallback)
      getClues(a).forEach(function(c){ add(c.label); });
    });
  });
  return clues.sort(function(a, b){ return a.localeCompare(b, "zh-Hant"); });
}

function renderCatalogItems(allClues, filter, diseaseMap){
  var f = (filter || "").toLowerCase().trim();
  // Build clue → dx count map
  var clueCount = {};
  Object.keys(diseaseMap).forEach(function(did){
    var item = diseaseMap[did];
    (item.clues || []).forEach(function(c){
      var k = c.toLowerCase().trim();
      clueCount[k] = (clueCount[k] || 0) + 1;
    });
  });

  // Filter available
  var avail = allClues.filter(function(c){
    if (detectiveState.selected.indexOf(c) !== -1) return false;
    if (f && c.toLowerCase().indexOf(f) === -1) return false;
    return true;
  });
  if (!avail.length){
    return '<div class="det-catalog-empty">' + (f ? '無符合「' + escHtml(filter) + '」的線索' : '已加入所有線索') + '</div>';
  }

  // Bucket into 3 tiers by diagnostic value
  var tier1 = [], tier2 = [], tier3 = []; // 1 / 2-4 / 5+
  avail.forEach(function(c){
    var n = clueCount[c.toLowerCase().trim()] || 0;
    if (n <= 1) tier1.push({label:c, count:n});
    else if (n <= 4) tier2.push({label:c, count:n});
    else tier3.push({label:c, count:n});
  });
  // Sort within each: by count asc, then by name
  function sortFn(a, b){
    if (a.count !== b.count) return a.count - b.count;
    return a.label.localeCompare(b.label, "zh-Hant");
  }
  tier1.sort(sortFn); tier2.sort(sortFn); tier3.sort(sortFn);

  function renderRow(item){
    return '<div class="det-clue-row" onclick="detAdd(\'' + escAttr(item.label) + '\')">' +
      '<span class="det-clue-plus">+</span>' +
      '<span class="det-clue-name">' + escHtml(item.label) + '</span>' +
      (item.count <= 1
        ? '<span class="det-clue-badge det-clue-badge-pathognomonic"><i class="ti ti-star-filled"></i></span>'
        : '<span class="det-clue-badge">' + item.count + ' dx</span>') +
      '</div>';
  }

  var h = '';
  if (tier1.length){
    h += '<div class="det-tier det-tier-pathognomonic"><div class="det-tier-label"><span>高鑑別力 · pathognomonic</span><span class="det-tier-count">' + tier1.length + '</span></div>';
    tier1.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  if (tier2.length){
    h += '<div class="det-tier"><div class="det-tier-label"><span>中等鑑別 · 2-4 個疾病</span><span class="det-tier-count">' + tier2.length + '</span></div>';
    tier2.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  if (tier3.length){
    h += '<div class="det-tier"><div class="det-tier-label"><span>普遍症狀 · 5+ 個疾病</span><span class="det-tier-count">' + tier3.length + '</span></div>';
    tier3.forEach(function(item){ h += renderRow(item); });
    h += '</div>';
  }
  return h;
}

function renderDxList(diseaseMap){
  var selected = detectiveState.selected;
  var sel = selected.map(function(c){ return c.toLowerCase().trim(); });

  var ranked = Object.keys(diseaseMap).map(function(id){
    var item = diseaseMap[id];
    var lowerClues = item.clues.map(function(c){ return c.toLowerCase().trim(); });
    var matched = item.clues.filter(function(c){
      return sel.indexOf(c.toLowerCase().trim()) !== -1;
    });
    var missing = item.clues.filter(function(c){
      return sel.indexOf(c.toLowerCase().trim()) === -1;
    });
    var score = sel.length > 0 ? matched.length / sel.length : 0;
    return Object.assign({}, item, {
      matched: matched, missing: missing,
      matchCount: matched.length, score: score
    });
  });

  // Sort: more matches first, then higher score, then classic first
  ranked.sort(function(a, b){
    if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
    if (b.score !== a.score) return b.score - a.score;
    return (b.is_classic ? 1 : 0) - (a.is_classic ? 1 : 0);
  });

  if (!ranked.length){
    return '<div class="det-no-results">此症狀尚未連結任何疾病</div>';
  }

  return ranked.map(function(item, idx){
    var isTop = (idx === 0) && (item.matchCount > 0);
    var cls = "det-dx-card" + (isTop ? " top" : "");
    var d = item.disease;
    var color = mechColor(item.mechanism, item.mechIdx);

    var matchClass = "det-dx-match-none";
    var matchText = sel.length ? "0 / " + sel.length : "無 clue";
    if (item.matchCount > 0){
      matchText = item.matchCount + " / " + sel.length + " 符合";
      matchClass = item.matchCount === sel.length ? "det-dx-match-good" : "det-dx-match-partial";
    } else if (sel.length === 0){
      matchClass = "det-dx-match-none";
      matchText = item.clues.length + " 個 clue";
    }

    var h = '<div class="' + cls + '" onclick="selectDisease(\'' + d.id + '\')">';
    h += '<div class="det-dx-head">';
    h += '<div><span class="det-dx-name">' + escHtml(d.name) + '</span>';
    if (d.name_en) h += '<span class="det-dx-zh">' + escHtml(d.name_en) + '</span>';
    if (isTop) h += '<span class="det-dx-top-badge">最符合</span>';
    if (item.is_classic) h += '<span class="det-dx-classic">⭐ 經典</span>';
    h += '</div>';
    h += '<span class="det-dx-match ' + matchClass + '">' + matchText + '</span>';
    h += '</div>';
    h += '<div class="det-dx-meta">';
    h += '<span style="color:' + color + ';font-weight:600">' + escHtml(item.mechanism.name) + '</span>';
    h += '<span>📍 ' + escHtml(item.anatomy.name) + (item.anatomy.body_region ? ' [' + escHtml(item.anatomy.body_region) + ']' : '') + '</span>';
    h += '</div>';

    if (sel.length > 0 && item.matched.length > 0){
      h += '<div class="det-dx-clues"><div class="det-dx-clue-row"><span class="det-dx-clue-label">符合</span><div>';
      item.matched.forEach(function(c){
        h += '<span class="det-dx-matched-clue">✓ ' + escHtml(c) + '</span>';
      });
      h += '</div></div></div>';
    }
    if (sel.length > 0 && item.missing.length > 0){
      h += '<div class="det-dx-clues"><div class="det-dx-clue-row"><span class="det-dx-clue-label">可再查</span><div>';
      item.missing.slice(0, 6).forEach(function(c){
        h += '<span class="det-dx-missing-clue">· ' + escHtml(c) + '</span>';
      });
      if (item.missing.length > 6){
        h += '<span class="det-dx-missing-clue" style="font-style:italic">+' + (item.missing.length - 6) + ' 更多</span>';
      }
      h += '</div></div></div>';
    }
    if (item.key_features){
      h += '<div style="margin-top:6px;font-size:12px;color:var(--text2);font-style:italic">💡 ' + escHtml(item.key_features) + '</div>';
    }
    h += '</div>';
    return h;
  }).join("");
}

function renderAnatMap(mechs){
  // Group anatomies by body_region
  var groups = {};
  mechs.forEach(function(m, mi){
    var anats = getAnatomies(m.id);
    anats.forEach(function(a){
      var region = (a.body_region && a.body_region.trim()) || "未分類";
      if (!groups[region]) groups[region] = [];
      groups[region].push({ anatomy: a, mechanism: m, mechColor: mechColor(m, mi) });
    });
  });

  var regions = Object.keys(groups).sort(function(a, b){
    var ra = regionRank(a), rb = regionRank(b);
    if (ra !== rb) return ra - rb;
    return a.localeCompare(b, "zh-Hant");
  });

  var h = '<div class="anat-map" id="anatMapPanel">';
  h += '<div class="anat-map-title">🗺️ Anatomy Map<span class="anat-map-hint">Location-based reasoning · 點任一項可跳到該 anatomy</span></div>';
  h += '<div class="anat-map-grid">';
  regions.forEach(function(r){
    h += '<div class="anat-map-region">';
    h += '<div class="anat-map-region-name">' + escHtml(r) + '</div>';
    groups[r].forEach(function(item){
      var a = item.anatomy, m = item.mechanism;
      h += '<div class="anat-map-item" onclick="scrollToAnatomy(\'' + a.id + '\')">';

function renderAnatomySection(a, color, sxLabel, mechLabel){

      h += '</div>';
      if (ad.key_features){
        h += '<div class="dx-feat">' + fmt(ad.key_features) + '</div>';
      }
      if (dxClues.length){
        h += '<div class="dx-clues-label">Key clinical clues</div>';
        h += '<div class="clue-list">';

          h += renderClueItem(c, ci, scope, "dx:" + (ad.disease_id || ""));
        });
        h += '</div>';
      }
      h += '</div>';
    });

  if (!anatClueList.length && !ddxList.length){
    h += '<div style="padding:10px;color:var(--text3);font-size:13px;background:var(--bg3);border-radius:6px;margin-top:6px">尚無 Clinical Clues 或 Disease</div>';
  }

}

/* ===== Clinical clue helpers (with backward compat) ===== */
// Anatomy-level clues (legacy / general fallback)
function getClues(a){
  var c = a.clinical_clues;
  if (typeof c === "string") try{ c = JSON.parse(c); }catch(e){ c = null; }
  if (!Array.isArray(c)) return [];
  return c.map(function(x){
    if (typeof x === "string") return { label: x, why: "" };
    if (x && typeof x === "object") return { label: x.label || "", why: x.why || "" };
    return { label: "", why: "" };
  }).filter(function(x){ return x.label; });
}
// Disease-level clues (preferred — from anatomy_diseases.clinical_clues)
function getDiseaseClues(ad){
  var c = ad && ad.clinical_clues;
  if (typeof c === "string") try{ c = JSON.parse(c); }catch(e){ c = null; }
  if (!Array.isArray(c)) return [];
  return c.map(function(x){
    if (typeof x === "string") return { label: x, why: "" };
    if (x && typeof x === "object") return { label: x.label || "", why: x.why || "" };
    return { label: "", why: "" };
  }).filter(function(x){ return x.label; });
}

function renderClueItem(c, idx, scope, excludeKey){
  var id = "clue-" + scope + "-" + idx;

  var hasXref = xrefs.length > 0;

  var cls = "clue-item" + (hasContent ? " has-why" : " no-why");
  var h = '<div class="' + cls + '" id="' + id + '" data-clue-label="' + escAttr(c.label) + '">';

  h += '<span class="clue-label">' + escHtml(c.label) + '</span>';
  if (hasWhy) h += '<span class="clue-info"><i class="ti ti-info-circle"></i>pathway</span>';

function escAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;"); }

function buildClueIndex(){
  clueIndex = {};
  symptoms.forEach(function(sx){
    var mechs = getMechs(sx.id);
    mechs.forEach(function(m, mi){
      var anats = getAnatomies(m.id);
      anats.forEach(function(a){
        // Index disease-level clues (preferred)
        var ddxList = anatomyDxMap[a.id] || [];
        ddxList.forEach(function(ad){
          if (!ad.disease_id) return;
          var disease = diseases.find(function(d){ return d.id === ad.disease_id; });
          if (!disease) return;
          getDiseaseClues(ad).forEach(function(c){
            var key = c.label.toLowerCase().trim();
            if (!key) return;
            if (!clueIndex[key]) clueIndex[key] = [];
            clueIndex[key].push({
              symptom: sx, mechanism: m, mechIdx: mi,
              anatomy: a, disease: disease, ad: ad
            });
          });
        });
        // Anatomy-level clues (legacy fallback)
        getClues(a).forEach(function(c){
          var key = c.label.toLowerCase().trim();
          if (!key) return;
          if (!clueIndex[key]) clueIndex[key] = [];
          clueIndex[key].push({
            symptom: sx, mechanism: m, mechIdx: mi,
            anatomy: a, disease: null, ad: null
          });
        });
      });
    });
  });
}

/* ===== Cross-linking: entity index + linkify + preview cards ===== */
var entityIndex = { byName: {}, names: [], regex: null };

function buildEntityIndex(){
  entityIndex = { byName: {}, names: [], regex: null };
  function add(name, type, id){
    if (!name) return;
    var key = name.toLowerCase().trim();
    if (!key || key.length < 2) return;
    if (!entityIndex.byName[key]) {
      entityIndex.byName[key] = { type: type, id: id, name: name };
      entityIndex.names.push(name);
    }
  }
  diseases.forEach(function(d){
    add(d.name, "disease", d.id);
    if (d.name_en) add(d.name_en, "disease", d.id);
  });
  var sorted = entityIndex.names.slice().sort(function(a,b){ return b.length - a.length; });
  var escaped = sorted.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); });
  if (escaped.length){
    try { entityIndex.regex = new RegExp("(" + escaped.join("|") + ")", "g"); } catch(e){ entityIndex.regex = null; }
  }
}

// Linkify a SAFE (already-escaped) HTML string. Skips content inside HTML tags.
// _linkedThisPass tracks which entity ids were already linked to avoid noise.
var _linkedThisPass = {};
function resetLinkPass(){ _linkedThisPass = {}; }
function linkifyEntities(safeHtml){
  if (!safeHtml) return safeHtml;
  // 1. Explicit tokens: [[dz:UUID|label]] or [[dz:UUID]]
  safeHtml = safeHtml.replace(/\[\[dz:([0-9a-f-]+)(?:\|([^\]]+))?\]\]/gi, function(_, id, label){
    var d = diseases.find(function(x){ return x.id === id; });
    var text = label || (d ? d.name : "連結");
    if (!d) return escHtml(text);
    return entityLink("disease", id, text);
  });
  // 2. Auto-link known disease names (only on disease entry view, avoid inside tags, first mention only)
  if (entityIndex.regex && currentView === "entry"){
    var parts = safeHtml.split(/(<[^>]+>)/);
    for (var i = 0; i < parts.length; i++){
      if (parts[i].charAt(0) === "<") continue;
      parts[i] = parts[i].replace(entityIndex.regex, function(match){
        var ent = entityIndex.byName[match.toLowerCase().trim()];
        if (!ent) return match;
        if (ent.type === "disease" && ent.id === currentId) return match;
        if (_linkedThisPass[ent.id]) return match; // already linked once this render
        _linkedThisPass[ent.id] = true;
        return entityLink(ent.type, ent.id, match);
      });
    }
    safeHtml = parts.join("");
  }
  return safeHtml;
}

function entityLink(type, id, text){
  return '<a class="ent-link" data-ent-type="' + type + '" data-ent-id="' + id +
    '" onclick="onEntityClick(event,\'' + type + '\',\'' + id + '\')" ' +
    'onmouseenter="showEntityPreview(event,\'' + type + '\',\'' + id + '\')" ' +
    'onmouseleave="scheduleHidePreview()">' + text + '</a>';
}

function onEntityClick(e, type, id){

  hideEntityPreview(true);
  if (type === "disease") selectDisease(id);
}

var _entPreviewTimer = null, _entHideTimer = null;

function showEntityPreview(e, type, id){
  if (isMobile()) return;
  clearTimeout(_entHideTimer);
  clearTimeout(_entPreviewTimer);
  var anchor = e.currentTarget;
  _entPreviewTimer = setTimeout(function(){
    var card = buildEntityPreview(type, id);
    if (!card) return;
    var pop = document.getElementById("entPreview") || (function(){
      var el = document.createElement("div");
      el.id = "entPreview";
      el.className = "ent-preview";
      el.onmouseenter = function(){ clearTimeout(_entHideTimer); };
      el.onmouseleave = scheduleHidePreview;
      document.body.appendChild(el);
      return el;
    })();
    pop.innerHTML = card;
    pop.style.display = "block";
    var r = anchor.getBoundingClientRect();
    var pw = 320, ph = pop.offsetHeight || 160;
    var left = r.left, top = r.bottom + 8;
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (top + ph > window.innerHeight - 12) top = r.top - ph - 8;
    pop.style.left = Math.max(12, left) + "px";
    pop.style.top = Math.max(12, top) + "px";
  }, 280);
}

function buildEntityPreview(type, id){

  if (!summary && secs.def){
    var defContent = secs.def;
    if (typeof defContent === "string") { try { defContent = JSON.parse(defContent); } catch(e){} }
    if (defContent && defContent.paragraphs && defContent.paragraphs.length){
      summary = defContent.paragraphs[0].replace(/\*\*/g,"").replace(/\\n/g," ");
    }
  }
  if (summary.length > 140) summary = summary.slice(0, 138) + "…";
  var drugCount = (drugMap[id] || []).length;
  var compCount = (compMap[id] || []).length;
  var badges = "";
  try { var bs = Array.isArray(d.badges) ? d.badges : JSON.parse(d.badges || "[]"); badges = bs.slice(0,3).map(function(b){ return '<span class="ent-preview-badge">' + escHtml(b) + '</span>'; }).join(""); } catch(e){}

  html += '<div class="ent-preview-cta">點擊查看完整疾病頁 <i class="ti ti-arrow-narrow-right"></i></div>';

}

function findCrossRefs(label, excludeKey){
  // excludeKey:  "dx:<diseaseId>"  excludes that specific disease
  //              "anat:<anatomyId>" excludes anatomy-level clues from that anatomy
  if (!label) return [];
  var key = label.toLowerCase().trim();
  var refs = clueIndex[key] || [];
  // Dedupe: same disease appearing twice should only appear once in xref
  var seen = {};
  return refs.filter(function(r){
    if (excludeKey && excludeKey.indexOf("dx:") === 0){
      var did = excludeKey.slice(3);
      if (r.disease && r.disease.id === did) return false;
    }
    if (excludeKey && excludeKey.indexOf("anat:") === 0){
      var aid = excludeKey.slice(5);
      if (!r.disease && r.anatomy.id === aid) return false;
    }
    // Dedupe by (symptom, disease) for disease entries, (symptom, anatomy) for anatomy fallback
    var dedupeKey = r.symptom.id + "|" + (r.disease ? "d:" + r.disease.id : "a:" + r.anatomy.id);
    if (seen[dedupeKey]) return false;
    seen[dedupeKey] = true;
    return true;
  });
}

/* Pathway parser:
   - Line ending with ":" (short)  → section heading
   - Line containing only ↓/→/↑    → arrow visual
   - Empty line                    → gap between pathways
   - Other lines                   → step box (with **bold** inline)
*/
function renderPathophysiology(text){
  if (!text) return "";
  var lines = text.replace(/\r\n/g, "\n").split("\n");
  var html = "";
  var bulletGroup = [];
  function flushBullets(){
    if (!bulletGroup.length) return;
    html += '<div class="exp-patho-grid">';
    bulletGroup.forEach(function(b){
      html += '<span class="exp-patho-grid-key">' + escHtml(b.key) + '</span>';
      html += '<span class="exp-patho-grid-val">' + escHtml(b.val) + '</span>';
    });
    html += '</div>';
    bulletGroup = [];
  }
  lines.forEach(function(line){
    var t = line.trim();
    if (!t){ flushBullets(); return; }
    // "• Key：Value" / "- Key: Value" become grid rows
    var bm = t.match(/^[•\*\-]\s*(.+?)\s*[：:]\s*(.+)$/);
    if (bm){
      bulletGroup.push({ key: bm[1].trim(), val: bm[2].trim() });
      return;
    }
    // Regular line → its own paragraph
    flushBullets();
    html += '<p>' + escHtml(t) + '</p>';
  });
  flushBullets();
  return html;
}

function renderPathway(text){
  if (!text) return "";
  var lines = text.replace(/\r\n/g, "\n").split("\n");
  var html = '<div class="pathway">';
  var lastWasGap = false;
  var firstStep = true;
  lines.forEach(function(line){
    var trimmed = line.trim();
    if (!trimmed){
      if (!lastWasGap && !firstStep) html += '<div class="pathway-gap"></div>';
      lastWasGap = true;
      return;
    }
    lastWasGap = false;
    // Section header
    if (/.+:\s*$/.test(trimmed) && trimmed.length < 40){
      html += '<div class="pathway-section">' + renderInlineBold(trimmed.replace(/:\s*$/, "")) + '</div>';
      return;
    }
    // Skip arrow-only lines — the timeline thread is the connector
    if (/^[↓→↑⇒\s]+$/.test(trimmed)){
      return;
    }
    // Regular step
    html += '<div class="pathway-step">' + renderInlineBold(trimmed) + '</div>';
    firstStep = false;
  });
  html += '</div>';
  return html;
}

function renderInlineBold(s){
  return escHtml(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
}

/* ===== Differential comparison mode (鑑別表) ===== */
function getQuickFacts(id){
  var secs = sectionMap[id] || {};
  var c = secs.quick_facts;
  if (typeof c === "string") try { c = JSON.parse(c); } catch(e){ c = null; }
  if (!c || !Array.isArray(c.facts)) return [];
  return c.facts;
}

function startCompare(id){
  compareIds = id ? [id] : [];
  showCompare();
}
function startCompareWith(idA, idB){
  compareIds = [idA, idB];
  showCompare();
}

function addToCompare(id){
  if (compareIds.indexOf(id) < 0 && compareIds.length < 4) compareIds.push(id);
  showCompare();
}

function removeFromCompare(id){
  compareIds = compareIds.filter(function(x){ return x !== id; });
  showCompare();
}

function clearCompare(){
  compareIds = [];
  showCompare();
}

function showCompare(){
  currentView = "compare";
  currentId = null;
  clearBreadcrumb();
  try{ history.pushState(null,null,"#compare"); }catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent = "鑑別比較";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  var byId = {};
  diseases.forEach(function(d){ byId[d.id] = d; });
  var picked = compareIds.map(function(id){ return byId[id]; }).filter(Boolean);

  var h = '<div class="cmp">';
  h += '<div class="cmp-head"><div class="cmp-title">鑑別比較表</div>';
  h += '<div class="cmp-sub">選 2–4 個疾病，逐列對照 quick facts</div></div>';

  // Picker row
  h += '<div class="cmp-picker">';
  picked.forEach(function(d){
    var col = CAT_COLORS[d.category] || "#7ab3d9";
    h += '<span class="cmp-chip"><span class="cmp-chip-dot" style="background:'+col+'"></span>'+escHtml(d.name)+
         '<span class="cmp-chip-x" onclick="removeFromCompare(\''+d.id+'\')" title="移除"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></span>';
  });
  if (picked.length < 4){
    h += '<div class="cmp-add-wrap"><input id="cmpAdd" class="cmp-add" type="text" placeholder="+ 加入疾病…" oninput="cmpAddInput(this.value)" onkeydown="cmpAddKey(event)" autocomplete="off"><div id="cmpAddResults" class="cmp-add-results"></div></div>';
  }
  if (picked.length > 0){
    h += '<button class="cmp-clear-btn" onclick="clearCompare()" title="清空全部">清空</button>';
  }
  h += '</div>';

  if (picked.length < 2){
    h += '<div class="cmp-empty"><i class="ti ti-columns-3"></i><div>再加入至少一個疾病即可開始比較</div>';
    // suggest diseases that have quick_facts, grouped by system (category)
    var withFacts = diseases.filter(function(d){ return getQuickFacts(d.id).length > 0; });
    if (withFacts.length >= 2){
      h += '<div class="cmp-suggest-label">有鑑別資料的疾病：</div>';
      // group by category, preserving the sidebar category order
      var byCat = {};
      var catOrder = [];
      withFacts.forEach(function(d){
        var cat = d.category || "未分類";
        if (!byCat[cat]){ byCat[cat] = []; catOrder.push(cat); }
        byCat[cat].push(d);
      });
      h += '<div class="cmp-suggest-groups">';
      catOrder.forEach(function(cat){
        var col = CAT_COLORS[cat] || "#7ab3d9";
        h += '<div class="cmp-suggest-group">';
        h += '<div class="cmp-suggest-cat"><span class="cmp-suggest-cat-dot" style="background:'+col+'"></span>'+escHtml(cat)+'</div>';
        h += '<div class="cmp-suggest">';
        byCat[cat].forEach(function(d){
          h += '<button class="cmp-suggest-btn" onclick="addToCompare(\''+d.id+'\')"><span class="cmp-suggest-btn-dot" style="background:'+col+'"></span>'+escHtml(d.name)+'</button>';
        });
        h += '</div></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    h += '</div>';
    document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
    return;
  }

  // Collect facts per disease, preserving key order & grouping from first disease that has each key
  var order = [];          // ordered list of {key, group}
  var seenKey = {};
  var valueMap = {};       // key -> {diseaseId -> {value, highlight}}
  picked.forEach(function(d){
    getQuickFacts(d.id).forEach(function(f){
      if (!f.key) return;
      if (!seenKey[f.key]){
        seenKey[f.key] = true;
        order.push({ key: f.key, group: f.group || "" });
      }
      if (!valueMap[f.key]) valueMap[f.key] = {};
      valueMap[f.key][d.id] = { value: f.value || "", highlight: !!f.highlight };
    });
  });

  if (!order.length){
    h += '<div class="cmp-empty"><i class="ti ti-info-circle"></i><div>所選疾病尚無 quick facts 鑑別資料</div></div></div>';
    document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
    return;
  }

  // Build table grouped by group — collect rows per group first to avoid duplicate group headers
  var groupOrder = [];
  var rowsByGroup = {};
  order.forEach(function(row){
    var g = row.group || "其他";
    if (!rowsByGroup[g]){ rowsByGroup[g] = []; groupOrder.push(g); }
    rowsByGroup[g].push(row);
  });

  h += '<div class="cmp-table-wrap"><table class="cmp-table">';
  h += '<thead><tr><th class="cmp-th-key"></th>';
  picked.forEach(function(d){
    var col = CAT_COLORS[d.category] || "#7ab3d9";
    h += '<th class="cmp-th"><a onclick="selectDisease(\''+d.id+'\')"><span class="cmp-th-dot" style="background:'+col+'"></span>'+escHtml(d.name)+'</a>'+
         (d.name_en?'<span class="cmp-th-en">'+escHtml(d.name_en)+'</span>':'')+'</th>';
  });
  h += '</tr></thead><tbody>';

  groupOrder.forEach(function(g){
    if (g && g !== "其他"){
      h += '<tr class="cmp-group-row"><td colspan="'+(picked.length+1)+'">'+escHtml(g)+'</td></tr>';
    }
    rowsByGroup[g].forEach(function(row){
      var anyHl = picked.some(function(d){ var c=valueMap[row.key][d.id]; return c && c.highlight; });
      h += '<tr class="'+(anyHl?'cmp-row-hl':'')+'">';
      h += '<td class="cmp-key">'+escHtml(row.key)+(anyHl?' <i class="ti ti-star-filled cmp-key-star"></i>':'')+'</td>';
      picked.forEach(function(d){
        var c = valueMap[row.key][d.id];
        if (c && c.value){
          h += '<td class="cmp-cell'+(c.highlight?' cmp-cell-hl':'')+'">'+linkifyEntities(fmt(c.value))+'</td>';
        } else {
          h += '<td class="cmp-cell cmp-cell-empty">—</td>';
        }
      });
      h += '</tr>';
    });
  });
  h += '</tbody></table></div>';
  h += '</div>';
  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
}

function cmpAddInput(q){
  var box = document.getElementById("cmpAddResults");
  if (!box) return;
  q = (q||"").trim().toLowerCase();
  if (q.length < 1){ box.innerHTML=""; box.classList.remove("show"); return; }
  var hits = diseases.filter(function(d){
    if (compareIds.indexOf(d.id) >= 0) return false;
    return (d.name && d.name.toLowerCase().indexOf(q)>=0) ||
           (d.name_en && d.name_en.toLowerCase().indexOf(q)>=0);
  }).slice(0, 6);
  if (!hits.length){ box.innerHTML='<div class="cmp-add-empty">無相符疾病</div>'; box.classList.add("show"); return; }
  box.innerHTML = hits.map(function(d){
    var col = CAT_COLORS[d.category] || "#7ab3d9";
    var hasFacts = getQuickFacts(d.id).length > 0;
    return '<a class="cmp-add-item" onclick="addToCompare(\''+d.id+'\')"><span class="cmp-add-dot" style="background:'+col+'"></span>'+
      escHtml(d.name)+
      (d.category?'<span class="cmp-add-cat">'+escHtml(d.category)+'</span>':'')+
      (hasFacts?'':' <span class="cmp-add-nofacts">無鑑別資料</span>')+'</a>';
  }).join("");
  box.classList.add("show");
}
function cmpAddKey(e){
  if (e.key === "Enter"){
    var first = document.querySelector("#cmpAddResults .cmp-add-item");
    if (first) first.click();
  }
}

/* ===== SRS review session ===== */
var reviewQueue = [];   // array of {disease_id, tab}
var reviewIdx = 0;
var reviewRevealed = false;
var reviewDone = 0;

function startReview(onlyDiseaseId){
  var due = getDueMarks();
  if(onlyDiseaseId) due = due.filter(function(m){ return m.disease_id === onlyDiseaseId; });
  if(!due.length){ toast("目前沒有到期的複習項目"); return; }
  // order: overdue first, then by due date
  due.sort(function(a,b){ return (a.srs.due||"").localeCompare(b.srs.due||""); });
  reviewQueue = due.map(function(m){ return { disease_id: m.disease_id, tab: m.tab }; });
  reviewIdx = 0;
  reviewRevealed = false;
  reviewDone = 0;
  currentView = "review";
  clearBreadcrumb();
  try{ history.pushState(null,null,"#review"); }catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  showReviewCard();
}

function showReviewCard(){
  document.getElementById("topTitle").textContent = "複習";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  if(reviewIdx >= reviewQueue.length){
    // Session complete
    var h0 = '<div class="rv"><div class="rv-done">'+
      '<i class="ti ti-circle-check"></i>'+
      '<div class="rv-done-title">複習完成！</div>'+
      '<div class="rv-done-sub">這輪複習了 '+reviewDone+' 個項目。下次到期時會再出現。</div>'+
      '<button class="rv-done-btn" onclick="showHome()">回首頁</button>'+
      '</div></div>';
    document.getElementById("mainContent").innerHTML = h0;
    scrollMainTop();
    return;
  }

  var item = reviewQueue[reviewIdx];
  var d = diseases.find(function(x){ return x.id === item.disease_id; });
  var mark = getMark(item.disease_id, item.tab);
  if(!d || !mark){ reviewIdx++; showReviewCard(); return; }

  var tabLabelText = tabLabel(item.tab);
  var col = CAT_COLORS[d.category] || "#7ab3d9";

  // Pull the actual tab content to show as the "answer".
  // The cross-app "qbank" dimension has no section content — link to the qbank instead.
  var answerHtml = "";
  if(item.tab === "qbank"){
    var qurl = QBANK_URL + "?disease=" + encodeURIComponent(d.id);
    answerHtml = '<p style="color:var(--text2);line-height:var(--lh-normal)">這是你在題庫答錯的疾病。建議重做相關考題來複習。</p>'+
      '<a class="relq-btn" href="'+qurl+'" target="_blank" rel="noopener" style="margin-top:10px">重做相關考題 <i class="ti ti-arrow-right"></i></a>';
  } else {
    var secs = sectionMap[d.id] || {};
    var drugs = drugMap[d.id] || [];
    var comps = compMap[d.id] || [];
    var prevTab = currentTab;
    currentTab = item.tab; // renderSection reads currentTab
    try{
      answerHtml = renderSection(secs[item.tab], item.tab === "drug" ? drugs : null, item.tab === "prog" ? comps : null, secs[item.tab]);
    }catch(e){ answerHtml = '<p style="color:var(--text3)">（此區段內容載入失敗）</p>'; }
    currentTab = prevTab;
  }

  var prev = srsPreview(mark);

  var h = '<div class="rv">';
  // progress
  h += '<div class="rv-progress"><div class="rv-progress-bar" style="width:'+Math.round(reviewIdx/reviewQueue.length*100)+'%"></div></div>';
  h += '<div class="rv-count">'+(reviewIdx+1)+' / '+reviewQueue.length+'</div>';

  // prompt card (always visible)
  h += '<div class="rv-card">';
  h += '<div class="rv-card-head"><span class="rv-dot" style="background:'+col+'"></span>'+
       '<span class="rv-dz">'+escHtml(d.name)+'</span>'+
       '<span class="rv-tab-badge">'+escHtml(tabLabelText)+'</span>';
  if(mark.flag==="weak") h += '<span class="rv-flag rv-flag-weak">易錯</span>';
  if(mark.flag==="important") h += '<span class="rv-flag rv-flag-important">重點</span>';
  h += '</div>';
  h += '<div class="rv-q">回想一下：<b>'+escHtml(d.name)+'</b> 的「'+escHtml(tabLabelText)+'」</div>';
  if(mark.note && mark.note.trim()){
    h += '<div class="rv-note"><span class="rv-note-label">你的筆記</span>'+escHtml(mark.note)+'</div>';
  }

  if(!reviewRevealed){
    h += '<button class="rv-reveal" onclick="revealReview()"><i class="ti ti-eye"></i> 顯示內容</button>';
  } else {
    h += '<div class="rv-answer">'+answerHtml+'</div>';
  }
  h += '</div>'; // rv-card

  // rating buttons (only after reveal)
  if(reviewRevealed){
    h += '<div class="rv-rate">';
    h += '<button class="rv-rate-btn rv-again" onclick="rateReview(0)">忘記<span>'+prev.again+'</span></button>';
    h += '<button class="rv-rate-btn rv-hard" onclick="rateReview(1)">困難<span>'+prev.hard+'</span></button>';
    h += '<button class="rv-rate-btn rv-good" onclick="rateReview(2)">普通<span>'+prev.good+'</span></button>';
    h += '<button class="rv-rate-btn rv-easy" onclick="rateReview(3)">簡單<span>'+prev.easy+'</span></button>';
    h += '</div>';
  }

  // open full disease link
  h += '<div class="rv-actions"><a onclick="openMark(\''+d.id+'\',\''+item.tab+'\')">開啟完整頁面 →</a>'+
       '<a onclick="showHome()" class="rv-exit">結束複習</a></div>';

  h += '</div>';
  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
}

function revealReview(){
  reviewRevealed = true;
  showReviewCard();
}
function rateReview(rating){
  var item = reviewQueue[reviewIdx];
  if(item){
    reviewSrs(item.disease_id, item.tab, rating);
    reviewDone++;
  }
  reviewIdx++;
  reviewRevealed = false;
  showReviewCard();
}

function showHome(){
  currentView = "home";
  currentId = null;
  clearBreadcrumb();
  try{history.pushState(null,null,"#home")}catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent = "MedBase TW";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  var byId = {};
  diseases.forEach(function(d){ byId[d.id] = d; });

  // ----- Continue reading (recent) -----
  var recent = recentIds.map(function(id){ return byId[id]; }).filter(Boolean).slice(0, 6);
  // ----- Today's review (SRS due) -----
  var dueMarks = getDueMarks();
  // group due marks by disease for display
  var dueByDisease = {};
  dueMarks.forEach(function(m){
    if(!dueByDisease[m.disease_id]) dueByDisease[m.disease_id] = [];
    dueByDisease[m.disease_id].push(m);
  });
  // ----- Progress by category -----
  var catAgg = {};
  diseases.forEach(function(d){
    var c = d.category || "其他";
    if(!catAgg[c]) catAgg[c] = { total:0, read:0 };
    catAgg[c].total++;
    if(dStatus[d.id] === "read") catAgg[c].read++;
  });
  var cats = Object.keys(catAgg).sort(function(a,b){ return catAgg[b].total - catAgg[a].total; });
  var totalRead = diseases.filter(function(d){return dStatus[d.id]==="read";}).length;

  function dzCard(d, sub, removable){
    var col = CAT_COLORS[d.category] || "#7ab3d9";
    return '<div class="hm-card" onclick="selectDisease(\''+d.id+'\')">'+
      '<span class="hm-card-dot" style="background:'+col+'"></span>'+
      '<span class="hm-card-body"><span class="hm-card-name">'+escHtml(d.name)+'</span>'+
      (d.name_en?'<span class="hm-card-en">'+escHtml(d.name_en)+'</span>':'')+
      (sub?'<span class="hm-card-sub">'+sub+'</span>':'')+'</span>'+
      (removable
        ? '<button class="hm-card-x" title="從繼續閱讀移除" aria-label="移除" onclick="event.stopPropagation();removeRecent(\''+d.id+'\')"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>'
        : '<i class="ti ti-chevron-right hm-card-chev"></i>')+
      '</div>';
  }

  var h = '<div class="home">';

  // Hero + search
  h += '<div class="hm-hero">';
  h += '<div class="hm-hero-title">MedBase <span>TW</span></div>';
  h += '<div class="hm-hero-sub">機轉導向的臨床醫學知識庫 · 共 '+diseases.length+' 個疾病</div>';
  h += '<div class="hm-disclaimer">⚕️ 這個網頁是給有醫學相關背景的人使用，一般民眾請諮詢你的醫生</div>';
  h += '<div class="hm-search"><i class="ti ti-search"></i>'+
       '<input id="hmSearch" type="text" placeholder="搜尋疾病、症狀或關鍵字…" '+
       'oninput="hmSearchInput(this.value)" onkeydown="hmSearchKey(event)" autocomplete="off">'+
       '</div>';
  h += '<div id="hmSearchResults" class="hm-search-results"></div>';
  h += '</div>';

  // Quick actions
  // Feature tools — descriptive cards so first-timers understand what each does
  h += '<div class="hm-tools-sect">';
  h += '<div class="hm-tools-head"><span class="hm-tools-zh">探索工具</span><span class="hm-tools-en">· TOOLS</span></div>';
  h += '<div class="hm-tools-grid">';
  h += '<button class="hm-tool hm-tool-star" onclick="showGraph()">'+
       '<span class="hm-tool-badge">亮點</span>'+
       '<span class="hm-tool-ico"><i class="ti ti-affiliate"></i></span>'+
       '<span class="hm-tool-name">疾病關係圖</span>'+
       '<span class="hm-tool-desc">互動式圖譜，看疾病如何互相連結 —— 致病、併發、同源一目了然</span></button>';
  h += '<button class="hm-tool hm-tool-star" onclick="showCompare()">'+
       '<span class="hm-tool-badge">亮點</span>'+
       '<span class="hm-tool-ico"><i class="ti ti-columns-3"></i></span>'+
       '<span class="hm-tool-name">鑑別比較</span>'+
       '<span class="hm-tool-desc">把相似疾病並排，逐項對照診斷、檢驗、治療的關鍵差異</span></button>';
  h += '<button class="hm-tool" onclick="showSymptoms()">'+
       '<span class="hm-tool-ico"><i class="ti ti-stethoscope"></i></span>'+
       '<span class="hm-tool-name">症狀導向學習</span>'+
       '<span class="hm-tool-desc">從症狀反推 —— 病人這樣表現，可能是哪些病？</span></button>';
  h += '<button class="hm-tool" onclick="showTopics()">'+
       '<span class="hm-tool-ico"><i class="ti ti-books"></i></span>'+
       '<span class="hm-tool-name">知識專題</span>'+
       '<span class="hm-tool-desc">跨疾病的機制與主題深入，補足單一疾病看不到的全貌</span></button>';
  h += '</div></div>';

  // Lightweight onboarding (shown until dismissed, remembered in localStorage)
  if (!_onboardDismissed()){
    h += '<div class="hm-onboard" id="hmOnboard">'+
      '<button class="hm-onboard-x" onclick="dismissOnboard()" title="不再顯示" aria-label="關閉">✕</button>'+
      '<div class="hm-onboard-title">👋 快速上手</div>'+
      '<div class="hm-onboard-grid">'+
        '<div class="hm-onboard-item"><span class="hm-onboard-num">1</span><div><b>搜尋什麼都行</b><span>不只病名 —— 連症狀、檢驗值（如 haptoglobin、JAK2）都搜得到，會告訴你命中在哪個分頁</span></div></div>'+
        '<div class="hm-onboard-item"><span class="hm-onboard-num">2</span><div><b>用學習路徑成套學</b><span>下方主題路徑（溶血鑑別、骨髓衰竭…）依機轉排序，一個接一個看、自動記進度</span></div></div>'+
        '<div class="hm-onboard-item"><span class="hm-onboard-num">3</span><div><b>並排比較鑑別</b><span>用「鑑別比較」把相似疾病並列，逐項對照診斷與治療差異</span></div></div>'+
      '</div>'+
      '</div>';
  }

  // Build the 學習路徑 (topic paths) block as a reusable string
  var pathsInner = '<div class="hm-sect-head"><span class="hm-sect-zh">學習路徑</span><span class="hm-sect-en">LEARNING PATHS</span>';
  pathsInner += '<span class="hm-sect-meta">已讀 '+totalRead+' / '+diseases.length+'</span></div>';
  pathsInner += '<div class="hm-paths">';
  if (learningPaths.length){
    learningPaths.forEach(function(p){
      var ids = (p.disease_ids||[]).filter(function(id){ return diseases.some(function(d){return d.id===id;}); });
      if(!ids.length) return;
      var read = ids.filter(function(id){ return dStatus[id]==="read"; }).length;
      var total = ids.length;
      var pct = total ? Math.round(read/total*100) : 0;
      var col = p.color || "#185FA5";
      var icon = p.icon ? (escHtml(p.icon)+" ") : "";
      pathsInner += '<button class="hm-path" onclick="goPath(\''+escAttr(p.id)+'\')">';
      pathsInner += '<span class="hm-path-top"><span class="hm-path-dot" style="background:'+col+'"></span>'+
           '<span class="hm-path-name">'+icon+escHtml(p.name)+'</span>'+
           '<span class="hm-path-count">'+read+'/'+total+'</span></span>';
      if(p.description) pathsInner += '<span class="hm-path-desc">'+escHtml(p.description)+'</span>';
      pathsInner += '<span class="hm-path-bar"><span class="hm-path-fill" style="width:'+pct+'%;background:'+col+'"></span></span>';
      pathsInner += '</button>';
    });
  } else {
    // fallback: 若尚未建立任何主題路徑，仍以分類顯示（避免空白）
    cats.forEach(function(c){
      var agg = catAgg[c];
      var col = CAT_COLORS[c] || "#7ab3d9";
      var pct = agg.total ? Math.round(agg.read/agg.total*100) : 0;
      pathsInner += '<button class="hm-path" onclick="goCategory(\''+encodeURIComponent(c)+'\')">';
      pathsInner += '<span class="hm-path-top"><span class="hm-path-dot" style="background:'+col+'"></span>'+
           '<span class="hm-path-name">'+escHtml(c)+'</span>'+
           '<span class="hm-path-count">'+agg.read+'/'+agg.total+'</span></span>';
      pathsInner += '<span class="hm-path-bar"><span class="hm-path-fill" style="width:'+pct+'%;background:'+col+'"></span></span>';
      pathsInner += '</button>';
    });
  }
  pathsInner += '</div>';

  // Build the 今日複習 (SRS due) block as a reusable string
  var dueInner = "";
  if (dueMarks.length){
    dueInner = '<div class="hm-sect-head"><span class="hm-sect-zh">今日複習</span><span class="hm-sect-en">DUE · '+dueMarks.length+'</span>'+
      '<button class="hm-review-start" onclick="startReview()"><i class="ti ti-player-play"></i> 開始複習</button></div>';
    dueInner += '<div class="hm-due-list">';
    Object.keys(dueByDisease).slice(0, 8).forEach(function(did){
      var d = byId[did];
      if(!d) return;
      var col = CAT_COLORS[d.category] || "#7ab3d9";
      var items = dueByDisease[did];
      var tabLabels = items.map(function(m){ return tabLabel(m.tab); }).join("、");
      dueInner += '<div class="hm-due-card" onclick="startReview(\''+did+'\')">'+
        '<span class="hm-card-dot" style="background:'+col+'"></span>'+
        '<span class="hm-card-body"><span class="hm-card-name">'+escHtml(d.name)+'</span>'+
        '<span class="hm-card-sub">'+escHtml(tabLabels)+' · '+items.length+' 項待複習</span></span>'+
        '<i class="ti ti-chevron-right hm-card-chev"></i></div>';
    });
    dueInner += '</div>';
  }

  // Build the 繼續閱讀 (continue) block as a reusable string
  var continueInner = "";
  if (recent.length){
    continueInner = '<div class="hm-sect-head"><span class="hm-sect-zh">繼續閱讀</span><span class="hm-sect-en">CONTINUE</span>'+
      '<a class="hm-sect-clear" onclick="clearAllRecent()">清空</a></div><div class="hm-list">';
    recent.forEach(function(d){
      var stSub = dStatus[d.id]==="read"?"已讀完":(dStatus[d.id]==="review"?"需複習":"");
      continueInner += dzCard(d, stSub, true);
    });
    continueInner += '</div>';
  }

  if (recent.length){
    // 繼續閱讀 + 學習路徑 並排（兩欄）；今日複習若有則放在下方全寬
    h += '<div class="hm-cols">';
    h += '<div class="hm-sect">' + continueInner + '</div>';
    h += '<div class="hm-sect hm-paths-col">' + pathsInner + '</div>';
    h += '</div>';
    if (dueInner){
      h += '<div class="hm-sect hm-sect-wide hm-due-sect">' + dueInner + '</div>';
    }
  } else {
    // 沒有繼續閱讀 → 今日複習（若有）+ 學習路徑全寬（維持原樣）
    if (dueInner){
      h += '<div class="hm-sect hm-sect-wide hm-due-sect">' + dueInner + '</div>';
    }
    h += '<div class="hm-sect hm-sect-wide">' + pathsInner + '</div>';
  }

  // Support footer — low-key, only on home (never on content pages)
  h += '<div class="hm-support">'+
    '<a class="hm-support-btn" href="'+BMC_URL+'" target="_blank" rel="noopener">'+
    '<span class="hm-support-cup">☕</span>'+
    '<span class="hm-support-txt"><b>覺得有幫助？</b>請我喝杯咖啡，支持持續更新</span>'+
    '</a>'+
    '<div class="hm-support-note">本平台免費提供，無廣告 · 純個人醫學教育專案</div>'+
    '</div>';

  h += '</div>'; // home
  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
}

// Open a topic learning path: set activePath to its ordered disease_ids, resume at first unread
function goPath(pathId){
  var p = learningPaths.find(function(x){ return x.id === pathId; });
  if (!p) return;
  var ids = (p.disease_ids||[]).filter(function(id){ return diseases.some(function(d){return d.id===id;}); });
  if (!ids.length) return;
  activePath = { name: p.name, ids: ids, color: p.color || "#185FA5" };
  var resume = ids.find(function(id){ return dStatus[id] !== "read"; }) || ids[0];
  var rd = diseases.find(function(d){ return d.id === resume; });
  if (rd && rd.category) expandedCat = rd.category;
  selectDisease(resume);
}

// Open a category: expand its accordion and select its first disease
function goCategory(encName){
  var name = decodeURIComponent(encName);
  // Build the ordered path (by sort_order then name) and remember we're "in" this path
  var inPath = diseases.filter(function(d){ return (d.category||"其他") === name; });
  inPath.sort(function(a,b){
    var sa = (a.sort_order==null?9999:a.sort_order), sb = (b.sort_order==null?9999:b.sort_order);
    if (sa !== sb) return sa - sb;
    return (a.name||"").localeCompare(b.name||"");
  });
  activePath = { name: name, ids: inPath.map(function(d){ return d.id; }) };
  // Resume at first unread disease in the path if any, else the first
  var resume = inPath.find(function(d){ return dStatus[d.id] !== "read"; }) || inPath[0];
  expandedCat = name;
  if (resume) selectDisease(resume.id);
}

// Move through the active learning path (dir = -1 prev, +1 next)
function pathNav(dir){
  if (!activePath || !activePath.ids.length) return;
  var i = activePath.ids.indexOf(currentId);
  if (i === -1) return;
  var ni = i + dir;
  if (ni < 0 || ni >= activePath.ids.length) return;
  // Advancing forward → mark the one you're leaving as read (progress accumulates as you go)
  if (dir > 0 && dStatus[currentId] !== "read"){
    dStatus[currentId] = "read";
    saveStatus();
    filterList();
  }
  selectDisease(activePath.ids[ni]);
}
// Exit the path (hide the path navigator)
function exitPath(){ activePath = null; renderEntry(); }

// Home search — searches diseases AND symptoms (症狀導向) by name/name_en/category
function hmSearchInput(q){
  var box = document.getElementById("hmSearchResults");
  if(!box) return;
  q = (q||"").trim().toLowerCase();
  if(q.length < 1){ box.innerHTML=""; box.classList.remove("show"); return; }
  // Diseases
  var dHits = diseases.filter(function(d){
    return (d.name && d.name.toLowerCase().indexOf(q)>=0) ||
           (d.name_en && d.name_en.toLowerCase().indexOf(q)>=0) ||
           (d.category && d.category.toLowerCase().indexOf(q)>=0);
  }).map(function(d){ return {kind:"disease", item:d}; });
  // Symptoms (症狀導向學習)
  var sHits = (symptoms||[]).filter(function(s){
    return (s.name && s.name.toLowerCase().indexOf(q)>=0) ||
           (s.name_en && s.name_en.toLowerCase().indexOf(q)>=0);
  }).map(function(s){ return {kind:"symptom", item:s}; });
  // Knowledge topics (知識專題)
  var tHits = (topics||[]).filter(function(t){
    return (t.name && t.name.toLowerCase().indexOf(q)>=0) ||
           (t.name_en && t.name_en.toLowerCase().indexOf(q)>=0) ||
           (t.summary && t.summary.toLowerCase().indexOf(q)>=0) ||
           (t.specialty && t.specialty.toLowerCase().indexOf(q)>=0);
  }).map(function(t){ return {kind:"topic", item:t}; });
  // Symptoms first (a symptom query usually means "I don't know the disease yet"), then topics, then diseases
  var hits = sHits.concat(tHits).concat(dHits).slice(0, 12);
  if(!hits.length){ box.innerHTML='<div class="hm-sr-empty">找不到「'+escHtml(q)+'」相關內容</div>'; box.classList.add("show"); return; }
  box.innerHTML = hits.map(function(h){
    if(h.kind === "symptom"){
      var s = h.item;
      return '<a class="hm-sr-item" onclick="showSymptomDetail(\''+s.id+'\')">'+
        '<span class="hm-sr-dot" style="background:var(--green)"></span>'+
        '<span class="hm-sr-name">'+escHtml(s.name)+'</span>'+
        (s.name_en?'<span class="hm-sr-en">'+escHtml(s.name_en)+'</span>':'')+
        '<span class="hm-sr-cat hm-sr-cat-sx">症狀導向</span></a>';
    }
    if(h.kind === "topic"){
      var t = h.item;
      return '<a class="hm-sr-item" onclick="selectTopic(\''+t.id+'\')">'+
        '<span class="hm-sr-dot" style="background:#6B3FA0"></span>'+
        '<span class="hm-sr-name">'+escHtml(t.name)+'</span>'+
        (t.name_en?'<span class="hm-sr-en">'+escHtml(t.name_en)+'</span>':'')+
        '<span class="hm-sr-cat hm-sr-cat-topic">知識專題</span></a>';
    }
    var d = h.item;
    var col = CAT_COLORS[d.category] || "#7ab3d9";
    return '<a class="hm-sr-item" onclick="selectDisease(\''+d.id+'\')">'+
      '<span class="hm-sr-dot" style="background:'+col+'"></span>'+
      '<span class="hm-sr-name">'+escHtml(d.name)+'</span>'+
      (d.name_en?'<span class="hm-sr-en">'+escHtml(d.name_en)+'</span>':'')+
      '<span class="hm-sr-cat">'+escHtml(d.category||"")+'</span></a>';
  }).join("");
  box.classList.add("show");
}
function hmSearchKey(e){
  if(e.key === "Enter"){
    var first = document.querySelector("#hmSearchResults .hm-sr-item");
    if(first) first.click();
  }
}

function showMyMarks(){
  currentView = "mymarks";
  currentId = null;
  clearBreadcrumb();
  try{ history.pushState(null,null,"#mymarks"); }catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent = "我的學習標記";
  document.getElementById("topBadges").innerHTML = "";
  document.getElementById("topStatus").innerHTML = "";
  syncTopbarRow2();

  var byId = {};
  diseases.forEach(function(d){ byId[d.id] = d; });
  var all = getAllMarks().filter(function(m){ return byId[m.disease_id]; });
  // newest first
  all.sort(function(a,b){ return (b.updated_at||"").localeCompare(a.updated_at||""); });

  var weak = all.filter(function(m){ return m.flag === "weak"; });
  var important = all.filter(function(m){ return m.flag === "important"; });
  var noted = all.filter(function(m){ return m.note && m.note.trim(); });

  var h = '<div class="mm">';
  h += '<div class="mm-head"><div class="mm-title">我的學習標記</div>';
  h += '<div class="mm-sub">跨疾病彙整你的筆記、易錯點與重點標記</div></div>';

  if (!all.length){
    h += '<div class="mm-empty"><i class="ti ti-notebook"></i><div>還沒有任何標記</div>'+
         '<div class="mm-empty-hint">在任何疾病的 tab 下方「我的標記」面板，寫筆記或標記易錯/重點，就會集中顯示在這裡。</div></div>';
    h += '</div>';
    document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
    return;
  }

  // Filter chips
  h += '<div class="mm-tabs">';
  h += '<button class="mm-tab on" onclick="filterMarks(this,\'all\')">全部 '+all.length+'</button>';
  if(weak.length) h += '<button class="mm-tab" onclick="filterMarks(this,\'weak\')">⚠ 易錯 '+weak.length+'</button>';
  if(important.length) h += '<button class="mm-tab" onclick="filterMarks(this,\'important\')">★ 重點 '+important.length+'</button>';
  if(noted.length) h += '<button class="mm-tab" onclick="filterMarks(this,\'note\')">📝 有筆記 '+noted.length+'</button>';
  h += '</div>';

  h += '<div class="mm-list" id="mmList">';
  all.forEach(function(m){ h += mmRow(m, byId); });
  h += '</div>';

  h += '</div>';
  document.getElementById("mainContent").innerHTML = h;
  scrollMainTop();
}

function mmRow(m, byId){
  var d = byId[m.disease_id];
  if(!d) return "";
  var tabLabelText = tabLabel(m.tab);
  var col = CAT_COLORS[d.category] || "#7ab3d9";
  var flagCls = m.flag === "weak" ? "weak" : (m.flag === "important" ? "important" : "");
  var dataAttr = 'data-flag="'+(m.flag||"")+'" data-note="'+(m.note&&m.note.trim()?"1":"0")+'"';
  var h = '<div class="mm-row '+flagCls+'" '+dataAttr+' onclick="openMark(\''+m.disease_id+'\',\''+m.tab+'\')">';
  h += '<span class="mm-row-dot" style="background:'+col+'"></span>';
  h += '<div class="mm-row-body">';
  h += '<div class="mm-row-head"><span class="mm-row-dz">'+escHtml(d.name)+'</span>';
  h += '<span class="mm-row-tab">'+escHtml(tabLabelText)+'</span>';
  if(m.flag==="weak") h += '<span class="mm-row-flag mm-flag-weak">易錯</span>';
  if(m.flag==="important") h += '<span class="mm-row-flag mm-flag-important">重點</span>';
  h += '</div>';
  if(m.note && m.note.trim()) h += '<div class="mm-row-note">'+escHtml(m.note)+'</div>';
  h += '</div><i class="ti ti-chevron-right mm-row-chev"></i></div>';
  return h;
}

function filterMarks(btn, kind){
  document.querySelectorAll(".mm-tab").forEach(function(b){ b.classList.remove("on"); });
  btn.classList.add("on");
  document.querySelectorAll("#mmList .mm-row").forEach(function(row){
    var show = true;
    if(kind === "weak") show = row.getAttribute("data-flag") === "weak";
    else if(kind === "important") show = row.getAttribute("data-flag") === "important";
    else if(kind === "note") show = row.getAttribute("data-note") === "1";
    row.style.display = show ? "" : "none";
  });
}

function openMark(diseaseId, tab){
  selectDisease(diseaseId, tab);
}

function showBookmarks(){
  currentView="bookmarks";
  clearBreadcrumb();
  try{history.pushState(null,null,"#bookmarks")}catch(e){}
  closeSidebarMobile();
  renderSidebar(diseases);
  document.getElementById("topTitle").textContent="⭐ 書籤列表";
  document.getElementById("topBadges").innerHTML="";
  document.getElementById("topStatus").innerHTML="";
  syncTopbarRow2();

  var bmList=diseases.filter(function(d){return bookmarks[d.id]}).sort(function(a,b){return(bookmarks[b.id]||0)-(bookmarks[a.id]||0)});
  var h='<div class="card">';
  h+='<div style="padding:12px 16px;background:var(--bg);border-bottom:0.5px solid var(--border);display:flex;justify-content:space-between;align-items:center">';
  h+='<span style="font-size:14px;font-weight:500;color:var(--blue)">⭐ 書籤（'+bmList.length+'）</span>';
  if(bmList.length)h+='<button class="btn btn-ghost" style="padding:4px 10px;font-size:12px" onclick="if(confirm(\'清除所有書籤？\')){bookmarks={};saveBookmarks();showBookmarks()}">清除全部</button>';
  h+='</div>';

  if(!bmList.length){
    h+='<div class="empty" style="padding:30px">尚無書籤，在疾病頁面點擊 ⭐ 加入</div>';
  } else {
    bmList.forEach(function(d){
      var st=dStatus[d.id];
      var stBadge="";
      if(st==="read")stBadge='<span style="font-size:11px;background:var(--green-bg);color:var(--green);padding:1px 8px;border-radius:10px">已讀完</span>';
      if(st==="review")stBadge='<span style="font-size:11px;background:var(--amber-bg);color:var(--amber);padding:1px 8px;border-radius:10px">需複習</span>';
      var mk=diseaseMarkSummary(d.id);
      var subExtra="";
      if(mk.hasNote)subExtra+=' · 📝 有筆記';
      if(mk.hasWeak)subExtra+=' · ⚠ 易錯';
      if(mk.hasImportant)subExtra+=' · ★ 重點';
      h+='<div class="bm-item" onclick="selectDisease(\''+d.id+'\')">';
      h+='<div><div class="bm-name">'+d.name+' <span style="font-weight:400;color:var(--text2);font-size:13px">'+(d.name_en||"")+'</span></div>';
      h+='<div class="bm-sub">'+(d.category||"")+subExtra+'</div></div>';
      h+='<div style="display:flex;gap:6px;align-items:center">'+stBadge+'</div>';
      h+='</div>';
    });
  }

  // Review section
  var reviewList=diseases.filter(function(d){return dStatus[d.id]==="review"});
  if(reviewList.length){
    h+='<div style="padding:12px 16px;background:var(--amber-bg);border-top:0.5px solid #FAC775">';
    h+='<div style="font-size:13px;font-weight:500;color:var(--amber);margin-bottom:6px">⟳ 需複習（'+reviewList.length+'）</div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    reviewList.forEach(function(d){
      h+='<span style="padding:4px 12px;background:var(--card);border:0.5px solid #FAC775;border-radius:16px;font-size:13px;color:var(--amber);cursor:pointer" onclick="selectDisease(\''+d.id+'\')">'+d.name+'</span>';
    });
    h+='</div></div>';
  }
  h+='</div>';

  document.getElementById("mainContent").innerHTML=h;
}

init();

  var FALLBACK = '<circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>';

  function svgFor(name){
    var inner = P[name];
    var extra = "";
    if (inner == null){ inner = FALLBACK; }
    return '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" '+
           'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" '+
           'class="ti-svg" aria-hidden="true" focusable="false" style="display:inline-block;vertical-align:-0.125em">'+inner+'</svg>';
  }

  function swap(el){
    if (!el || el.getAttribute("data-svg") === "1") return;
    var cls = el.getAttribute("class") || "";
    var m = cls.match(/ti-([a-z0-9-]+)/);
    if (!m) return;
    el.innerHTML = svgFor(m[1]);
    el.setAttribute("data-svg","1");
  }

  function sweep(root){
    (root || document).querySelectorAll && (root||document).querySelectorAll("i.ti").forEach(swap);
  }
  window.renderIcons = sweep;

  // initial pass
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function(){ sweep(document); });
  else sweep(document);

  // Global image-protection: block right-click context menu on any <img> (incl. dynamically added)
  document.addEventListener("contextmenu", function(e){
    if (e.target && e.target.tagName === "IMG") e.preventDefault();
  }, true);

  // ── #2 a11y: make clickable non-native elements keyboard-operable ──
  // Elements with onclick that are <div>/<span> get keyboard support (Tab + Enter/Space).
  function makeFocusable(root){
    var nodes = (root||document).querySelectorAll('[onclick]');
    for (var i=0;i<nodes.length;i++){
      var el = nodes[i];
      var tag = el.tagName;
      if (tag === "BUTTON" || tag === "A" || tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") continue;
      if (el.getAttribute("data-kb") === "1") continue;
      el.setAttribute("data-kb","1");
      if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex","0");
      if (!el.hasAttribute("role")) el.setAttribute("role","button");
    }
